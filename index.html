<!DOCTYPE html>
<html lang="ko">
<head>
<script src="persistence.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">   <!-- favicon 요청(404) 방지 -->
<title>교실 자리배치 프로그램</title>
<style>
  /* ────────────────────────────────────────────
     자리 배치 — 회색 한 계열 + 파랑 하나, 이모지 없음, 모서리 2/4/6px.
     칸 크기를 재는 fit() 과 그 변수(--nm · --no · --w · --gap …)는 그대로 쓴다.
     더한 것 : 줄(1줄…) · 분단(1분단…) 머리글 — 자리 위치를 눈으로 짚으려고.
     ──────────────────────────────────────────── */
  :root{
    --bg:#f5f5f5;
    --surface:#ffffff;
    --card:#ffffff;
    --line:#e6e6e6;
    --line-2:#d9d9d9;
    --ink:#1e1e1e;
    --ink-2:#757575;
    --ink-soft:#757575;
    --ink-3:#b3b3b3;
    --accent:#0d99ff;
    --ok:#1e1e1e;
    --danger:#d93025;

    --r-sm:2px;
    --r-md:4px;
    --r-lg:6px;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",-apple-system,"Segoe UI",sans-serif;
    font-size:12px;line-height:1.45;-webkit-font-smoothing:antialiased;
  }
  .app{height:100vh;display:flex;flex-direction:column;}

  /* ── 페이지 전환 ── */
  @keyframes pageOutLeft {from{transform:none;opacity:1} to{transform:translateX(-14px);opacity:0}}
  @keyframes pageOutRight{from{transform:none;opacity:1} to{transform:translateX(14px);opacity:0}}
  @keyframes pageInRight {from{transform:translateX(16px);opacity:0} to{transform:none;opacity:1}}
  @keyframes pageInLeft  {from{transform:translateX(-16px);opacity:0} to{transform:none;opacity:1}}
  body.leaving-left  .app{animation:pageOutLeft .15s ease-in forwards;}
  body.leaving-right .app{animation:pageOutRight .15s ease-in forwards;}
  body.entering-right .app{animation:pageInRight .22s cubic-bezier(.22,.61,.36,1);}
  body.entering-left  .app{animation:pageInLeft .22s cubic-bezier(.22,.61,.36,1);}
  @media (prefers-reduced-motion: reduce){
    body.leaving-left .app,body.leaving-right .app,
    body.entering-right .app,body.entering-left .app{animation:none;}
  }

  /* ── 상단 도구 막대 ── */
  .topbar{
    flex:none;height:48px;display:flex;align-items:center;gap:10px;padding:0 12px;
    background:#ebebeb;border-bottom:1px solid #dcdcdc;
  }
  .left{display:flex;align-items:center;gap:10px;min-width:0;}
  .tools{display:flex;align-items:center;gap:4px;margin-left:auto;}
  .sep{width:1px;height:20px;background:#d5d5d5;flex:none;}

  .pager{display:flex;gap:1px;align-items:center;}
  .pager button{
    border:none;background:transparent;color:var(--ink-2);
    font-size:14px;font-weight:500;padding:6px 12px;border-radius:var(--r-md);
  }
  .pager button:hover{background:#dedede;color:var(--ink);}
  .pager button.on{background:var(--surface);color:var(--ink);font-weight:600;
    box-shadow:0 1px 2px rgba(0,0,0,.08);}

  button{
    font-family:inherit;cursor:pointer;white-space:nowrap;
    display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;
    border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
    border-radius:var(--r-md);font-size:13px;font-weight:500;
  }
  button:hover{background:#f5f5f5;}
  button:disabled{opacity:.45;cursor:default;}
  button:disabled:hover{background:var(--surface);}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  button svg{flex:none;}
  button.primary,button.done{
    background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600;
  }
  button.primary:hover,button.done:hover{background:#000;}
  button.primary:disabled:hover,button.done:disabled:hover{background:var(--ink);}
  button.on,#tvBtn.on,#printBtn.open{background:#dcdcdc;border-color:#c4c4c4;color:var(--ink);}
  button.on:hover{background:#d3d3d3;}
  /* 시안의 quiet : 테두리만 투명하고 배경은 흰색 — 회색 바 위에서 하얀 칩으로 보인다 */
  .quiet{border-color:transparent;color:var(--ink-2);}
  .quiet:hover{background:#dedede;color:var(--ink);}
  .icon{padding:0 9px;}

  /* 저장 상태 — 글자만. 문제가 있을 때만 붉게 */
  .chip-btn{
    border-color:transparent;background:transparent;max-width:240px;
    color:var(--ink-2);font-size:13px;font-weight:400;padding:0 4px;
  }
  .chip-btn:hover{background:#dedede;color:var(--ink);}
  .chip-btn .label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chip-btn.attn{color:var(--danger);}
  .chip-btn.attn:hover{background:#f7eceb;}

  .placed-date{
    display:flex;align-items:center;gap:6px;
    font-size:13px;color:var(--ink-2);white-space:nowrap;
  }
  .placed-date .suffix{margin-left:2px;color:var(--ink-3);}

  /* ── 배치도 ── */
  .stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px;padding:5px 12px 4px;}
  /* 교탁·자리 쪽 가운데에 맞춘다 — 왼쪽 줄 번호 칸만큼(--board-shift) 오른쪽으로 */
  .mode-note{
    flex:none;align-self:center;transform:translateX(var(--board-shift,0px));
    font-size:12.5px;color:var(--ink-2);
    background:#ededed;border:1px solid var(--line-2);border-radius:var(--r-md);padding:5px 12px;
  }
  .mode-note b{font-weight:600;color:var(--ink);}
  .chart-title{
    flex:none;width:min(620px,92%);margin:0 auto;text-align:center;
    font-size:15px;font-weight:600;letter-spacing:-.02em;color:var(--ink);
    padding:2px 10px;line-height:1.3;
  }

  .area{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;}
  .board{display:flex;flex-direction:column;align-items:center;gap:calc(var(--gap,14px) * .55);}
  .podium-bar{
    flex:none;display:flex;align-items:center;justify-content:center;
    margin-left:calc(var(--lab,0px) + var(--gap-pair,0px));
    border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--surface);
    font-size:var(--nm,19px);font-weight:500;letter-spacing:.14em;color:var(--ink-2);
  }

  /* 줄·분단 머리글이 왼쪽 첫 칸과 첫 줄을 차지한다 */
  .grid{
    display:grid;
    grid-template-columns:var(--lab,0px) repeat(var(--pairs),minmax(0,1fr));
    column-gap:var(--gap-pair,24px);row-gap:var(--gap,14px);width:var(--w,100%);
  }
  /* 머리글은 자리 글자 크기를 따라가지 않는다 — 따라가면 줄 높이가 훌쩍 뛰어
     배치도가 아래로 넘치고 '1줄' 이 두 줄로 접힌다 */
  .colh,.rowh{
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:500;color:var(--ink-3);white-space:nowrap;
  }
  .colh{align-items:flex-end;line-height:1.4;}

  /* 짝꿍 둘을 한 칸(.pair)으로 묶고, 분단 사이만 조금 더 띄운다 */
  .pair{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    gap:var(--gap-in,8px);min-width:0;
    padding:calc(var(--gap-in,8px) * .5);border-radius:var(--r-lg);background:#ededed;
  }
  .seat{
    position:relative;aspect-ratio:1.62/1;
    background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-md);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    cursor:grab;user-select:none;
    transition:border-color .15s ease,background .15s ease,transform .12s ease;
  }
  .seat:hover{border-color:var(--ink-3);}
  .seat:active{cursor:grabbing;}
  .seat.empty{border-style:dashed;border-color:#cfcfcf;background:#fafafa;cursor:pointer;}
  /* 고정 = 테두리로만. 손으로 바꾼 자리 = 점선 */
  .seat.locked{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);}
  .seat.swapped{border-style:dashed;border-color:var(--ink);}
  .seat.drag-over{border-color:var(--ink);border-style:dashed;background:#f0f0f0;}
  .seat.dragging{opacity:.35;}
  .seat .nm{
    font-size:var(--nm,19px);font-weight:500;letter-spacing:-.02em;line-height:1.15;
    text-align:center;padding:0 6px;
  }
  .seat .nm.long{font-size:calc(var(--nm,19px) * .82);}
  .seat .no{
    font-size:var(--no,12.5px);color:var(--ink-3);font-weight:400;white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  /* 모서리 표시는 번호와 따로 : 번호만 키워도 크기는 그대로 */
  .seat .mark{position:absolute;top:5px;right:7px;font-size:calc(var(--nm,19px) * .5);opacity:.75;}
  .seat.pop{animation:pop .34s cubic-bezier(.2,1.5,.4,1);}
  @keyframes pop{0%{transform:scale(.94);opacity:.4}100%{transform:scale(1);opacity:1}}

  /* 추첨 중 : 살짝 움츠렸다가 이름이 빠르게 바뀐다 */
  body.spinning .grid{transform:scale(.99);transition:transform .18s ease;}
  body.spinning .seat .nm{opacity:.72;}
  body.spinning .seat .no{opacity:.45;}

  /* 확정 : 한 칸씩 차례로 내려앉는다 (--d 만큼 늦게 시작) */
  .seat.settle{animation:settle .46s cubic-bezier(.2,1.35,.35,1) var(--d,0ms) both;}
  @keyframes settle{
    0%  {transform:scale(.88) translateY(-8px);opacity:0;}
    58% {transform:scale(1.04) translateY(0);opacity:1;}
    100%{transform:none;opacity:1;}
  }

  /* 이름 바꾸기 모드 */
  .seat .ed{
    width:86%;text-align:center;font-family:inherit;font-weight:500;letter-spacing:-.02em;
    font-size:var(--nm,19px);color:var(--ink);background:#fff;
    border:none;border-bottom:1px solid var(--line-2);border-radius:0;padding:2px 4px;
  }
  .seat .ed:focus{outline:none;border-bottom-color:var(--ink);}
  body.editing .seat{cursor:text;border-color:var(--line-2);background:#fff;}
  body.editing .seat.locked{border-color:var(--ink);}
  body.editing .seat:focus-within{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);}
  body.editing .seat .mark{display:none;}
  /* 이름 바꾸기 중에는 상단에 '완료' 버튼만 남긴다 */
  #doneEdit{display:none;}
  body.editing #doneEdit{display:inline-flex;}
  body.editing .tools > *:not(#doneEdit){display:none !important;}

  .legend{
    flex:none;font-size:12px;color:var(--ink-3);
    display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:center;
  }
  .chip{display:inline-flex;align-items:center;gap:6px;}
  .swatch{width:11px;height:11px;border-radius:var(--r-sm);border:1px solid var(--ink-3);}
  .swatch.lock{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);}
  .swatch.swap{border-color:var(--ink);border-style:dashed;}
  .legend .edit-tip{color:var(--ink);font-weight:600;}

  /* ── 오른쪽에 덧씌우는 창 : 추가 설정 · 인쇄 ── */
  .backdrop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.12);}
  .sheet{
    position:absolute;top:0;right:0;width:420px;max-width:100%;height:100%;
    overflow-y:auto;background:var(--surface);
    border-left:1px solid var(--line-2);border-radius:0;
    padding:16px;display:flex;flex-direction:column;gap:14px;
    box-shadow:-8px 0 24px rgba(0,0,0,.10);
  }
  .sheet h2{
    margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em;
    padding-bottom:10px;border-bottom:1px solid var(--line);
  }
  .sheet h3{
    margin:0;font-size:12.5px;font-weight:600;color:var(--ink-2);
    padding-top:12px;border-top:1px solid var(--line);
  }
  .field{display:flex;flex-direction:column;gap:6px;}
  .field > label{font-size:12.5px;color:var(--ink-2);}
  input[type=number],input[type=text]{
    width:100%;padding:7px 9px;border:1px solid var(--line-2);border-radius:var(--r-sm);
    font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface);
  }
  .check{
    display:flex;align-items:center;gap:7px;margin-top:2px;
    font-size:12.5px;color:var(--ink-2);cursor:pointer;
  }
  .check input{width:14px;height:14px;accent-color:var(--ink);cursor:pointer;}
  input:focus{outline:none;border-color:var(--ink);}
  .row{display:flex;gap:8px;}
  .row .field{flex:1;}
  .row.btns button{flex:1;justify-content:center;}
  .hint{margin:0;font-size:11.5px;color:var(--ink-3);line-height:1.6;}

  /* 인쇄 : 오른쪽 창으로 (버튼 옆 드롭다운이 아니라) */
  .menu-wrap{display:contents;}
  .menu{
    position:fixed;top:0;right:0;z-index:45;width:420px;max-width:100%;height:100%;
    padding:16px;background:var(--surface);
    border-left:1px solid var(--line-2);box-shadow:-8px 0 24px rgba(0,0,0,.10);
    display:flex;flex-direction:column;gap:6px;overflow-y:auto;
  }
  .menu::before{
    content:"인쇄";font-size:15px;font-weight:600;color:var(--ink);
    padding-bottom:10px;margin-bottom:4px;border-bottom:1px solid var(--line);
  }
  .menu button{
    width:100%;height:auto;text-align:left;justify-content:flex-start;
    border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-md);
    padding:11px 12px;font-size:13.5px;font-weight:500;line-height:1.35;
    flex-direction:column;align-items:flex-start;gap:2px;
  }
  .menu button:hover{background:#f5f5f5;border-color:var(--ink-3);}
  .menu button small{font-size:11.5px;font-weight:400;color:var(--ink-3);}

  /* ── TV 화면 (?tv=1) : 자리표만 크게 ── */
  body.tv .topbar,body.tv .legend,body.tv .warn,body.tv .mode-note,
  body.tv .backdrop,body.tv .menu,body.tv .toast{display:none !important;}
  body.tv .stage{padding:16px 20px 20px;}
  body.tv .chart-title{font-size:26px;}
  /* 고정·교환 표시는 선생님용이라 TV 에서는 뺀다 (인쇄와 같은 모양) */
  body.tv .seat{
    background:#fff !important;border-color:var(--line-2) !important;
    border-style:solid !important;box-shadow:none !important;
  }
  body.tv .seat .nm{color:var(--ink) !important;}
  body.tv .seat .mark{display:none;}

  /* 이전 배치 기록 목록 */
  .hist-list{
    flex:none;max-height:200px;overflow-y:auto;
    border:1px solid var(--line);border-radius:var(--r-md);
    display:flex;flex-direction:column;
  }
  .hist-list .empty{padding:14px;text-align:center;color:var(--ink-3);font-size:12px;}
  .hist-row{
    flex:none;display:flex;align-items:center;gap:7px;padding:8px 9px;font-size:12px;
    border-bottom:1px solid var(--line);
  }
  .hist-row:last-child{border-bottom:none;}
  .hist-row:hover{background:#fafafa;}
  .hist-row .no{flex:none;width:44px;font-weight:600;color:var(--ink);}
  .hist-row .when{flex:1;min-width:0;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hist-row .mix{flex:none;color:var(--ink-3);font-size:11px;}
  .hist-row button{
    flex:none;height:26px;padding:0 9px;font-size:11.5px;border-radius:var(--r-md);
    color:var(--danger);border-color:#e3c3c1;
  }
  .hist-row button:hover{background:#fdf6f5;}
  .hist-row button.load{color:var(--ink);border-color:var(--line-2);}
  .hist-row button.load:hover{background:#f0f0f0;}

  .file-state{
    font-size:12.5px;color:var(--ink);background:#fafafa;
    border:1px solid var(--line);border-radius:var(--r-md);padding:9px 11px;line-height:1.5;
    white-space:pre-line;word-break:break-all;
  }
  .warn{
    display:none;font-size:12px;line-height:1.6;color:#8a4b12;background:#fdf6ec;
    border:1px solid #ecd9bd;border-radius:var(--r-md);padding:9px 11px;
  }
  .warn.on{display:block;}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,10px);z-index:80;
    background:var(--ink);color:#fff;font-size:13px;font-weight:500;line-height:1.5;
    padding:11px 18px;border-radius:var(--r-md);max-width:90vw;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .16s ease,transform .16s ease;
  }
  .toast.on{opacity:1;transform:translate(-50%,0);}

  @media (max-width:980px){
    .topbar{padding:0 10px;gap:6px;}
    .placed-date{font-size:12px;}
    button{padding:0 10px;font-size:12px;}
    .chip-btn{max-width:120px;}
    .chart-title{font-size:15px;}
    .stage{padding:8px 10px;}
    .sheet,.menu{width:100%;}
  }

  /* ── 인쇄 / PDF ───────────────────────────── */
  @page{size:A4 landscape;margin:5mm;}
  @media print{
    /* 인쇄에서는 애니메이션·트랜지션을 모두 끈다.
       남아 있으면 요소가 합성 레이어로 처리돼 글자가 벡터가 아닌 이미지로 인쇄된다.
       그림자도 전부 제거한다. .seat 만 지우면 특이도가 더 높은 .seat:hover 가 이겨서,
       마우스가 올라간 자리의 그림자가 그대로 인쇄된다. */
    *,*::before,*::after{
      animation:none !important;transition:none !important;box-shadow:none !important;
    }
    html,body{height:auto;overflow:visible;background:#fff;}
    .app{height:auto;}
    .topbar,.legend,.backdrop,.menu,.toast,.mode-note{display:none !important;}
    /* 좌우 여백을 조금 둔다. 폭을 100% 로 꽉 채우면 반올림 때문에
       바깥쪽 테두리가 페이지 경계에 걸려 왼쪽 끝이 잘려 나온다. */
    .stage{padding:0 2mm;gap:7px;height:auto;}
    .area{display:block;}
    .board{width:100%;gap:5mm !important;--nm:20pt !important;--no:14pt !important;}
    /* 좌석 2.5칸 폭 : 화면에서 보이는 비율과 같게 맞춘다. */
    .podium-bar{
      width:41% !important;min-width:50mm;height:auto !important;margin-left:0;
      padding:2.5mm 0;letter-spacing:.2em;color:var(--ink);border-color:#999;
    }
    .chart-title{font-size:20pt;font-weight:600;}
    .grid{
      width:100% !important;max-width:none;
      grid-template-columns:8mm repeat(var(--pairs),minmax(0,1fr)) !important;
      row-gap:9px !important;column-gap:16px !important;   /* 분단 사이 */
    }
    .colh,.rowh{font-size:9pt;color:#777;}
    .pair{gap:5px !important;padding:0 !important;background:none !important;}
    .seat{background:#fff !important;border:1px solid #999 !important;border-style:solid !important;}
    .seat .nm{color:var(--ink) !important;}
    .seat .no{color:#555 !important;}
    .seat .mark{display:none;}
    /* 교탁용 : 자리 위치는 그대로 두고 칸 안의 글씨만 180° 돌린다.
       제목은 맨 아래로 내려 뒤집는다. 종이를 반 바퀴 돌리면
       제목이 위로 오고 교탁이 아래(=선생님 쪽)에 놓이면서 모두 바로 읽힌다. */
    body.podium .seat,
    body.podium .podium-bar,
    body.podium .colh,body.podium .rowh{transform:rotate(180deg);}
    body.podium .chart-title{order:2;transform:rotate(180deg);}
  }

  /* ── 시안에 맞춘 것들 ── */
  .meta{
    flex:none;height:36px;display:flex;align-items:center;gap:10px;padding:0 14px;
    background:#f2f2f2;border-bottom:1px solid var(--line);
    font-size:13px;color:var(--ink-2);
  }
  .meta .stats{display:flex;gap:15px;font-variant-numeric:tabular-nums;}
  .meta .stats i{font-style:normal;color:var(--ink-3);}

  /* 자리표 이름은 상단 바 가운데(교탁과 같은 세로선)에 둔다.
     배치도 위의 제목은 인쇄와 그림 복사용으로 남긴다. */
  .topbar{position:relative;}
  .chart-name{
    position:absolute;left:calc(50% + var(--board-shift,0px));top:50%;
    transform:translate(-50%,-50%);pointer-events:none;
    font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px;
  }
  /* 좁은 화면에서는 가운데에 두면 양옆 버튼과 겹친다 → 날짜 옆으로 */
  @media (max-width:1180px){
    .chart-name{position:static;transform:none;pointer-events:auto;max-width:200px;}
  }
  .chart-title{display:none;}
  body.shooting .chart-title{display:block;}

  /* 짝꿍 뒤의 회색 판은 시안에 없다 — 칸 사이 간격만 둔다 */
  .pair{padding:0;background:none;border-radius:0;}

  /* 교탁 : 좁고 작게 */
  .podium-bar{
    font-size:calc(var(--no,12.5px) * .95);font-weight:500;letter-spacing:.1em;
    color:var(--ink-2);
  }

  /* 아래 설명 줄 */
  .legend{gap:18px;font-size:12px;color:var(--ink-3);}

  /* 확정은 이 화면에서 가장 중요한 한 가지 → 파랑 */
  #confirmBtn{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  #confirmBtn:hover{background:#0b87e3;}
  #confirmBtn:disabled{background:var(--surface);border-color:var(--line-2);color:var(--ink-3);opacity:1;}
  #confirmBtn:disabled:hover{background:var(--surface);}

  /* 자리 높이는 fit() 이 재서 넣는다. 인쇄에서는 비율로 돌아간다. */
  @media screen{ .seat{height:var(--cardh,auto);aspect-ratio:auto;} }
  @media print{ .seat{height:auto !important;aspect-ratio:1.62/1;} }
  .placed-date .suffix{margin-left:4px;color:var(--ink-2);}

  /* ── 오른쪽 패널 : 청소 역할 페이지와 같은 모양 (추가 설정 · 인쇄) ── */
  .side{
    position:fixed;right:0;top:84px;bottom:0;width:420px;max-width:100%;z-index:50;
    display:flex;flex-direction:column;
    background:var(--surface);border-left:1px solid #dcdcdc;
    box-shadow:-10px 0 30px rgba(0,0,0,.10);
  }
  .side > header{
    flex:none;height:44px;display:flex;align-items:center;padding:0 14px;
    background:var(--surface);border-bottom:1px solid var(--line);font-size:14px;font-weight:600;
  }
  .side > header .x{
    margin-left:auto;height:auto;border:none;background:transparent;color:var(--ink-3);
    padding:3px;cursor:pointer;
  }
  .side > header .x:hover{color:var(--ink);background:transparent;}
  .side-body{flex:1;min-height:0;overflow-y:auto;}
  .sect{border-bottom:1px solid var(--line);padding:13px 14px;display:flex;flex-direction:column;gap:9px;}
  .sect:last-child{border-bottom:none;}
  .sect > h4{margin:0;font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--ink-3);}
  .side .row{display:flex;align-items:center;gap:9px;font-size:13px;}
  .side .row label{color:var(--ink-2);width:72px;flex:none;font-size:13px;}
  .side .row input{
    flex:1;min-width:0;width:auto;height:30px;padding:0 9px;font-family:inherit;font-size:13px;color:var(--ink);
    border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);
  }
  .side .row input:focus{outline:none;border-color:var(--accent);}
  .side .row.btns{gap:7px;}
  .side .row.btns button{flex:1;justify-content:center;}
  .side .check{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer;margin:0;}
  .side .check input{width:14px;height:14px;accent-color:var(--ink);}
  .side button.danger{color:#b3261e;border-color:#e3b6b2;}
  .side button.danger:hover{background:#fdf6f5;}
  .side .warn{margin:0;}
  .file-note{margin:0;font-size:11.5px;color:var(--ink-3);line-height:1.6;}
  .file-note:empty{display:none;}

  /* 이전 배치 목록 — 청소 역할의 배정 기록과 같은 줄 모양 */
  .side .hist-list{
    display:flex;flex-direction:column;max-height:200px;overflow-y:auto;
    border:1px solid var(--line);border-radius:var(--r-md);
  }
  .side .hist-row{
    display:flex;align-items:center;gap:10px;padding:8px 10px;font-size:12px;
    border-bottom:1px solid #f2f2f2;
  }
  .side .hist-row:last-child{border-bottom:none;}
  .side .hist-row:hover{background:#fafafa;}
  .side .hist-row .no{flex:none;width:58px;font-weight:600;color:var(--ink);}
  .side .hist-row .when{flex:1;min-width:0;color:var(--ink-2);}
  .side .hist-row .mix{flex:none;color:var(--ink-3);font-size:11.5px;}
  .side .hist-row button{height:26px;padding:0 9px;font-size:11.5px;border-radius:var(--r-md);}

  /* 인쇄 항목 */
  .pitems{display:flex;flex-direction:column;gap:6px;}
  .pitem{
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;height:auto;
    padding:13px 14px;text-align:left;cursor:pointer;
    border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--surface);
  }
  .pitem:hover{background:#f5f5f5;border-color:var(--ink-3);}
  .pitem b{font-size:13px;font-weight:600;}
  .pitem span{font-size:11.5px;color:var(--ink-3);font-weight:400;}

  body.tv .side{display:none !important;}
  @media print{ .side{display:none !important;} }
  @media (max-width:980px){ .side{width:100%;} }

  /* TV : 현황 줄은 선생님용이라 뺀다. 자리표 제목은 상단 바 대신 배치도 위에 크게 */
  body.tv .meta{display:none !important;}
  body.tv .chart-title{display:block;}

  /* 인쇄 : 현황 줄은 종이에 맞게 담백하게. 교탁용은 제목처럼 아래로 내려 뒤집는다
     (종이를 반 바퀴 돌리면 맨 위로 와서 바로 읽힌다) */
  @media print{
    .meta{
      height:auto;background:none;border:none;justify-content:center;
      padding:0 2mm 2mm;font-size:10pt;color:#555;
    }
    .meta .stats i{color:#555;}
    body.podium .meta{order:3;transform:rotate(180deg);padding:2mm 2mm 0;}
  }
</style>
</head>

<script>
(function(){
  "use strict";

  const DEFAULT_NAMES = [
    "고희성","곽현진","김건우","김나연","김도윤","김서윤","김수훈","나윤아","류경민","박시우",
    "박유찬","박진서","방재원","손지원","신동화","신의진","양하준","오승후","유하람","이민제",
    "이유진","이준서","이지환","정현우","차예린","최민영","최성빈","최정우","현태윤","홍의준"
  ];
  const DEFAULT_ROLES = { "신의진":"회장", "최정우":"부회장" };

  const CACHE_KEY = "seating-chart-cache";   // 파일이 없을 때를 대비한 예비 저장
  const FILE_NAME   = "data.json";     // 브라우저에서 직접 열었을 때 쓰는 내보내기 파일
  const SERVER_NAME = "data.sqlite";   // start.bat 으로 켰을 때 서버가 쓰는 데이터베이스
  // start.bat 으로 켜면 http 로 열린다. 이때는 서버가 data.json 을 직접 읽고 써 준다.
  const SERVER = location.protocol === "http:" || location.protocol === "https:";
  const NUM_RE = /^(\d{1,3})\s*[.)번]?\s+(.+)$/;   // "7 김수훈" / "7. 김수훈" / "7번 김수훈"
  const $ = id => document.getElementById(id);
  const els = {
    rows:$("rows"), cols:$("cols"),
    chartTitle:$("chartTitle"), titleInput:$("titleInput"), titleShow:$("titleShow"),
    grid:$("grid"), area:$("area"), board:$("board"), podiumBar:$("podiumBar"),
    warn:$("warn"), count:$("count"), toast:$("toast"),
    legend:$("legend"), editLegend:$("editLegend"),
    renameStart:$("renameStart"), doneEdit:$("doneEdit"), shuffle:$("shuffle"),
    printBtn:$("printBtn"), printMenu:$("printMenu"),
    toCleaning:$("toCleaning"), toCheck:$("toCheck"), placedDate:$("placedDate"),
    settings:$("settings"), backdrop:$("backdrop"), close:$("close"),
    renumber:$("renumber"), clearSwap:$("clearSwap"),
    histList:$("histList"), clearHist:$("clearHist"), tvBtn:$("tvBtn"),
    confirmBtn:$("confirmBtn"), draftTag:$("draftTag"),
    roleA:$("roleA"), roleB:$("roleB"), nameList:$("nameList"),
    fileChip:$("fileChip"), fileState:$("fileState"), fileHint:$("fileHint"),
    fsButtons:$("fsButtons"), dlButtons:$("dlButtons"),
    fileNew:$("fileNew"), fileOpen:$("fileOpen"),
    fileExport:$("fileExport"), fileImport:$("fileImport"), filePicker:$("filePicker")
  };

  // students[] = {no, name} 명단 (번호 순)
  // seats[i]   = 좌석 i 에 앉은 학생 인덱스 (없으면 null)
  // base[i]    = 마지막 랜덤 배치 직후의 자리 → 이것과 다를 때만 '교환됨(보라)'
  // locked[i]  = 고정석
  // lockWho[i] = 고정할 때 그 자리에 있던 학생 인덱스 (빈자리를 고정했으면 null)
  //              → 고정은 '자리 + 사람' 으로 기억한다. 자리만 기억하면 확정 전 배치에서
  //                고정한 뒤 다시 열었을 때 확정본의 다른 학생이 그 자리에 고정돼 버린다.
  let students = [], seats = [], base = [], locked = [], lockWho = [], cells = [];
  let busy = false, editing = false;

  function renderTitle(){
    els.chartTitle.textContent = els.titleInput.value;
    els.chartTitle.hidden = !els.titleShow.checked;
    // 화면에서는 상단 바에 보인다 (배치도 위의 제목은 인쇄·그림 복사용)
    const nm = document.getElementById("chartName");
    if(nm) nm.textContent = els.titleInput.value;   // 상단 바 이름은 늘 보인다
    fit();                                    // 제목이 사라지면 배치도가 그만큼 커진다
  }

  const clamp = (v, lo, hi, dflt) =>
    Number.isFinite(+v) ? Math.min(hi, Math.max(lo, Math.round(+v))) : dflt;
  const seatCount = () => (+els.rows.value || 1) * (+els.cols.value || 1);

  /* ── 상태 읽기 / 쓰기 ──────────────────────── */
  // 저장 파일은 청소 페이지와 함께 쓴다. 이 페이지가 모르는 항목(cleaning 등)은
  // 그대로 보관했다가 다시 써 준다. 안 그러면 저장할 때마다 상대 페이지 데이터가 지워진다.
  const MINE = ["v","savedAt","placedAt","title","showTitle","rows","cols","students","seats","base","locked","lockWho","names","seatHistory"];
  let extra = {};
  let placedAt = "";                       // 마지막으로 자리를 뽑은 시각
  let seatHistory = [];                    // 이전 배치 기록 (최신이 앞, 최대 10개)
  const HIST_MAX = 10;

  /* ── 확정 전에는 저장하지 않는다 ──────────────
     랜덤 배치·드래그로 자리를 바꾸는 동안은 화면만 바뀌고, 파일에는 마지막으로
     확정한 자리·기준·기록·날짜가 그대로 남는다 (청소 역할 페이지와 같은 방식).
     고정(locked)은 예외 — 배치와 무관하게 그때그때 바로 저장된다. */
  let dirty = false, committed = null;
  const grabAssign = () => JSON.parse(JSON.stringify({ seats, base, placedAt, seatHistory }));
  function markDirty(){ dirty = true; updateConfirm(); save(); }

  // 지금 화면 그대로의 상태 (확정 전 배치 포함) — TV 로 보낼 때 쓴다
  function liveData(){
    return Object.assign({}, extra, {
      v:3, savedAt:new Date().toISOString(), placedAt, seatHistory,
      title:els.titleInput.value, showTitle:els.titleShow.checked,
      rows:+els.rows.value, cols:+els.cols.value,
      students, seats, base, locked, lockWho
    });
  }
  function snapshot(){
    const data = liveData();
    // 확정(✓ 확정)을 누르기 전에는 화면만 바뀐다 — 파일에는 마지막으로 확정된
    // 자리·기준·기록·날짜가 그대로 남는다.
    if(!(dirty && committed)) return data;
    // 고정은 바로 저장되므로, 확정본에서도 고정한 학생이 고정한 자리에 앉아 있게 맞춘다
    const c = JSON.parse(JSON.stringify(committed));
    if(c.seats.length === locked.length){ enforceLocks(c.seats); enforceLocks(c.base); }
    return Object.assign(data, c);
  }

  // TV 에 지금 화면을 보낸다. 파일은 확정본이라 TV 가 파일만 읽으면 확정 전 배치가 안 보인다.
  var liveAt = 0;                            // (TV) 노트북 화면을 마지막으로 받은 시각
  function tvSend(){
    if(TV || !TV_CH) return;
    try{ TV_CH.postMessage({ cmd:"state", page:"seating", data:liveData() }); }catch(e){}
  }

  function apply(d){
    if(!d || typeof d !== "object") return false;
    extra = {};
    for(const k in d) if(!MINE.includes(k)) extra[k] = d[k];
    // placedAt 이 생기기 전에 저장된 파일은 마지막 저장 시각을 배치 날짜로 본다 (한 번만)
    placedAt = typeof d.placedAt === "string" && d.placedAt ? d.placedAt
             : (typeof d.savedAt === "string" ? d.savedAt : "");
    seatHistory = (Array.isArray(d.seatHistory) ? d.seatHistory : [])
      .filter(h => h && Array.isArray(h.seats))
      .map(h => ({ at:String(h.at || ""), rows:clamp(h.rows, 1, 12, 5),
                   cols:clamp(h.cols, 1, 12, 6),
                   seats:h.seats.map(n => Number.isFinite(+n) ? +n : null) }))
      .slice(0, HIST_MAX);
    els.titleInput.value = d.title || "1-4 자리배치도";
    els.titleShow.checked = d.showTitle !== false;   // 예전 저장 파일은 표시로 본다
    renderTitle();
    els.rows.value  = clamp(d.rows, 1, 12, 5);
    els.cols.value  = clamp(d.cols, 1, 12, 6);

    if(Array.isArray(d.students)){
      students = d.students
        .filter(s => s && typeof s.name === "string" && s.name.trim())
        .map(s => {
          const out = { no:clamp(s.no, 1, 999, 0) || 0, name:s.name.trim() };
          if(typeof s.role === "string" && s.role.trim()) out.role = s.role.trim();
          return out;
        });
      numberAll();
    }else if(typeof d.names === "string"){         // 예전 저장 형식 (줄바꿈 텍스트)
      students = parseNameText(d.names);
    }else{
      return false;
    }

    const n = seatCount();
    const valid = v => (Number.isInteger(v) && v >= 0 && v < students.length) ? v : null;
    if(Array.isArray(d.seats) && d.seats.length === n){
      seats  = d.seats.map(valid);
      base   = Array.isArray(d.base) && d.base.length === n ? d.base.map(valid) : seats.slice();
      locked = fitFlags(d.locked, n);
      // lockWho 가 없던 예전 파일은 지금 그 자리에 있는 학생을 고정한 것으로 본다
      lockWho = Array.isArray(d.lockWho) && d.lockWho.length === n
        ? d.lockWho.map(valid) : seats.slice();
      tidyLocks();
      enforceLocks(seats); enforceLocks(base);
    }else{
      resetSeats(); fillInOrder();
    }
    dirty = false;
    committed = grabAssign();                 // 방금 읽은 상태가 곧 '확정된' 상태다
    return true;
  }

  function parseNameText(text){
    const list = [];
    for(const raw of String(text).split(/[\n,]/)){
      const line = raw.trim();
      if(!line) continue;
      const m = line.match(NUM_RE);
      list.push(m ? { no:+m[1], name:m[2].trim() } : { no:0, name:line });
    }
    const out = list.map(s => ({ no:s.no, name:s.name }));
    students = out;
    numberAll();
    return students;
  }

  // 번호가 없거나(0) 겹치는 학생에게 비어 있는 번호를 채워 준다
  function numberAll(){
    const taken = new Set();
    for(const s of students){
      if(s.no && !taken.has(s.no)) taken.add(s.no);
      else s.no = 0;
    }
    let next = 1;
    for(const s of students){
      if(s.no) continue;
      while(taken.has(next)) next++;
      s.no = next; taken.add(next);
    }
  }

  function fitFlags(arr, n){
    const out = (Array.isArray(arr) ? arr : []).slice(0, n).map(Boolean);
    while(out.length < n) out.push(false);
    return out;
  }

  // 고정 정보 정리 : 고정 안 된 자리는 사람을 비우고, 한 학생이 두 자리에 고정돼 있지 않게
  function tidyLocks(){
    const n = locked.length, seen = new Set();
    lockWho = lockWho.slice(0, n);
    while(lockWho.length < n) lockWho.push(null);
    for(let i=0;i<n;i++){
      const s = lockWho[i];
      if(!locked[i] || s == null || s < 0 || s >= students.length || seen.has(s)) lockWho[i] = null;
      else seen.add(s);
    }
  }

  // 고정된 학생을 고정한 자리로 되돌린다 (그 자리에 있던 학생과 맞바꾼다)
  function enforceLocks(arr){
    if(!Array.isArray(arr) || arr.length !== locked.length) return arr;
    for(let i=0;i<arr.length;i++){
      const s = lockWho[i];
      if(!locked[i] || s == null || arr[i] === s) continue;
      const j = arr.indexOf(s);
      if(j >= 0){ arr[j] = arr[i]; arr[i] = s; continue; }
      // 그 학생이 자리에 없었다 → 앉히고, 원래 있던 학생은 고정 안 된 빈자리로
      const out = arr[i];
      arr[i] = s;
      if(out != null){
        const k = arr.findIndex((v, x) => v == null && !locked[x]);
        if(k >= 0) arr[k] = out;
      }
    }
    return arr;
  }

  /* ── 이전 배치 기록 ────────────────────────── */
  // 좌석에는 명단 위치가 들어 있지만, 기록에는 학생 '번호' 로 남긴다.
  // 그래야 나중에 이름 목록 순서가 바뀌어도 제자리를 찾아간다.
  // 손으로 바꾼 자리가 있는지 (보라색 표시가 하나라도 있으면 확정할 것이 있다)
  function hasMoved(){
    for(let i = 0; i < seats.length; i++)
      if(seats[i] != null && base[i] != null && seats[i] !== base[i]) return true;
    return false;
  }
  function updateConfirm(){
    if(!els.confirmBtn) return;
    const on = !busy && !editing && dirty;
    els.confirmBtn.disabled = !on;
    els.confirmBtn.title = on
      ? "지금 배치를 이대로 저장하고 기록에 남깁니다"
      : "랜덤 배치를 하거나 자리를 바꾸면 확정할 수 있습니다";
    if(els.draftTag) els.draftTag.hidden = !dirty;
  }

  // 지금 화면의 배치를 기준으로 삼고 기록에 남긴다
  function confirmSeats(){
    if(busy || editing || !dirty) return;
    base = seats.slice();                        // 보라색 표시가 사라진다
    placedAt = new Date().toISOString();         // 상단 날짜도 오늘로
    pushHistory();                               // '이전 배치' 목록에 남는다
    dirty = false;
    committed = grabAssign();                    // 지금 상태가 새 확정본이 된다
    paint(); save();
    toast("지금 배치를 확정했습니다. 기록에도 남았습니다.", 4000);
  }

  function pushHistory(){
    const list = seats.map(i => (i != null && students[i]) ? students[i].no : null);
    if(!list.some(v => v != null)) return;             // 빈 배치는 남기지 않는다
    seatHistory.unshift({
      at:new Date().toISOString(),
      rows:+els.rows.value || 5, cols:+els.cols.value || 6,
      seats:list
    });
    seatHistory = seatHistory.slice(0, HIST_MAX);
  }

  // 기록에 남은 자리를 그대로 되살린다
  function loadSeatHistory(k){
    const h = seatHistory[k];
    if(!h || busy) return;

    // 줄·칸이 달랐다면 그때의 배치대로 맞춰 준다
    if((+els.rows.value !== h.rows) || (+els.cols.value !== h.cols)){
      els.rows.value = h.rows;
      els.cols.value = h.cols;
    }
    const n = h.rows * h.cols;
    const idxOf = new Map(students.map((st, i) => [st.no, i]));
    const next = new Array(n).fill(null);
    let 빠짐 = 0;
    h.seats.forEach((no, i) => {
      if(no == null || i >= n) return;
      if(idxOf.has(no)) next[i] = idxOf.get(no);
      else 빠짐++;                                      // 명단에서 없어진 학생
    });

    seats = next;
    locked = fitFlags(locked, n);
    tidyLocks();
    enforceLocks(seats);                               // 고정한 학생은 고정한 자리에 그대로
    base = seats.slice();                              // 되살린 배치가 기준 → 교환 표시 없음
    placedAt = h.at;                                   // 화면엔 그때 날짜로 보인다 (저장은 확정 후)
    buildGrid();
    markDirty();
    closeSheet();
    const 몇 = k === 0 ? "직전" : `${k}회 전`;
    toast(빠짐 ? `${몇} 배치를 불러왔습니다. ${빠짐}명은 명단에 없어 빈자리가 됐습니다.`
               : `${몇} 배치를 불러왔습니다.`, 4500);
  }

  function renderHistList(){
    if(!seatHistory.length){
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = "랜덤 배치를 하면 기록이 쌓입니다";
      els.histList.replaceChildren(e);
      return;
    }
    els.histList.replaceChildren(...seatHistory.map((h, i) => {
      const row = document.createElement("div");
      row.className = "hist-row";

      const no = document.createElement("span");
      no.className = "no";
      no.textContent = i === 0 ? "직전" : `${i}회 전`;

      const when = document.createElement("span");
      when.className = "when";
      const d = new Date(h.at);
      when.textContent = isNaN(d) ? "(시각 없음)"
        : `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} ` +
          `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;

      const mix = document.createElement("span");
      mix.className = "mix";
      mix.textContent = `${h.seats.filter(v => v != null).length}명 · ${h.rows}×${h.cols}`;

      const load = document.createElement("button");
      load.className = "load";
      load.textContent = "불러오기";
      load.title = "이 배치로 되돌립니다";
      load.addEventListener("click", () => loadSeatHistory(i));

      const del = document.createElement("button");
      del.textContent = "지우기";
      del.title = "이 회차만 기록에서 지웁니다";
      del.addEventListener("click", () => {
        seatHistory.splice(i, 1);
        renderHistList(); save();
        toast(`${no.textContent} 기록을 지웠습니다. 남은 기록 ${seatHistory.length}회.`);
      });

      row.append(no, when, mix, load, del);
      return row;
    }));
  }

  function resetSeats(){
    const n = seatCount();
    seats = new Array(n).fill(null);
    base = new Array(n).fill(null);
    locked = new Array(n).fill(false);
    lockWho = new Array(n).fill(null);
  }

  function fillInOrder(){
    const n = seatCount();
    for(let i=0;i<n;i++) seats[i] = i < students.length ? i : null;
    base = seats.slice();                       // 기준 배치를 새로 잡는다
  }

  let saveTimer = null;
  function save(){
    if(TV) return;                      // TV 화면은 보여 주기만 한다
    // 추첨 애니메이션 중에는 저장하지 않는다. 중간 단계의 임의 배치가 기준 배치(base)와
    // 어긋난 채 기록되면, 다시 열었을 때 좌석이 전부 '교환됨'으로 표시된다.
    // 이 사이에 바뀐 값들은 추첨이 끝날 때의 save() 가 함께 기록한다.
    if(busy) return;
    needsSave = true; editVersion++;
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(snapshot())); }catch(e){}
    tvSend();
    if(SERVER){
      clearTimeout(saveTimer);
      saveTimer = setTimeout(putServer, 350);
      return;
    }
    if(!fileHandle) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(writeFile, 350);
  }

  /* ── 서버 모드 : data.json 을 직접 읽고 쓴다 ── */
  // 저장에 실패해도 포기하지 않는다. 프로그램이 잠깐 꺼져 있었어도
  // 다시 켜지는 순간 밀린 내용이 저장되도록 계속 다시 시도한다.
  let retryTimer = null, saveFailed = false, needsSave = false, editVersion = 0;
  async function putServer(){
    clearTimeout(saveTimer); saveTimer = null;
    clearTimeout(retryTimer);
    const version = editVersion;
    try{
      const r = await fetch("api/data", {
        method:"PUT",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify(snapshot())
      });
      if(!r.ok) throw new Error(r.status);
      tvPing();                                  // TV 화면을 새로 고치게 한다
      if(saveFailed) toast("연결이 돌아와 밀린 내용을 저장했습니다.");
      saveFailed = false;
      if(version === editVersion) needsSave = false;
      setChip("linked", needsSave ? "저장 중" : "저장됨");
      return true;
    }catch(e){
      saveFailed = true;
      setChip("attn", "저장 안 됨");
      if(!window.classroomStorage?.blocked) retryTimer = setTimeout(putServer, 3000);
      return false;
    }
  }
  // 창으로 돌아오거나 네트워크가 살아나면 즉시 한 번 더
  document.addEventListener("visibilitychange", () => {
    if(!document.hidden && saveFailed) putServer();
  });
  window.addEventListener("online", () => { if(saveFailed) putServer(); });

  async function loadServer(){
    if(needsSave || window.classroomStorage?.pending || window.classroomStorage?.blocked) return;
    try{
      const r = await fetch("api/data", { cache:"no-store" });
      if(!r.ok) throw new Error(r.status);
      const d = await r.json();
      if(needsSave || window.classroomStorage?.pending) return;
      window.classroomStorage?.acceptRead(r);
      if(d && Object.keys(d).length && apply(d)) buildGrid();
      setChip("linked", "자동 저장");
      els.fileState.textContent = SERVER_NAME + " · 자동 저장";
    }catch(e){
      setChip("attn", "읽기 실패");
    }
  }

  /* ── 저장 파일 (File System Access API) ────── */
  const FS_OK = typeof window.showSaveFilePicker === "function";
  let fileHandle = null, pendingHandle = null, writing = false, writeAgain = false;

  function idb(){
    return new Promise((res, rej) => {
      const r = indexedDB.open("seating-chart", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function idbSet(k, v){
    const db = await idb();
    return new Promise((res, rej) => {
      const t = db.transaction("kv", "readwrite");
      t.objectStore("kv").put(v, k);
      t.oncomplete = res; t.onerror = () => rej(t.error);
    });
  }
  async function idbGet(k){
    const db = await idb();
    return new Promise((res, rej) => {
      const t = db.transaction("kv", "readonly");
      const q = t.objectStore("kv").get(k);
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
    });
  }

  function setChip(mode, text){
    els.fileChip.classList.toggle("linked", mode === "linked");
    els.fileChip.classList.toggle("attn", mode === "attn");
    els.fileChip.querySelector(".label").textContent = text;
  }

  function fileStatus(msg){
    if(SERVER){
      setChip("linked", msg || "자동 저장");
      els.fileState.textContent = SERVER_NAME + " · 자동 저장";
      return;
    }
    if(fileHandle){
      setChip("linked", msg ? fileHandle.name + " · " + msg : fileHandle.name);
      els.fileState.textContent = `연결됨 — ${fileHandle.name}`;
    }else if(pendingHandle){
      setChip("attn", "연결 필요");
      els.fileState.textContent = `${pendingHandle.name} — 다시 연결 필요`;
    }else{
      setChip("", "저장 파일 연결");
      els.fileState.textContent = "연결 안 됨 · 이 브라우저에만 임시 저장";
    }
  }

  let fileWriteQueue = Promise.resolve();
  function writeFile(){
    const job = fileWriteQueue.then(writeFileNow);
    fileWriteQueue = job.catch(() => {});
    return job;
  }
  async function writeFileNow(){
    if(!fileHandle) return true;
    if(writing){ writeAgain = true; return false; }
    writing = true;
    try{
      const w = await fileHandle.createWritable();
      await w.write(JSON.stringify(snapshot(), null, 2));
      await w.close();
      fileStatus("저장됨");
      return true;
    }catch(e){
      fileStatus("저장 실패");
      toast("저장 파일에 쓸 수 없습니다. 파일을 다시 연결해 주세요.");
      return false;
    }finally{
      writing = false;
      if(writeAgain){ writeAgain = false; writeFile(); }
    }
  }

  async function readFile(handle){
    const f = await handle.getFile();
    const txt = (await f.text()).trim();
    if(!txt) return false;                       // 새로 만든 빈 파일
    apply(JSON.parse(txt));
    buildGrid();
    return true;
  }

  async function linkNew(){
    try{
      const h = await window.showSaveFilePicker({
        suggestedName: FILE_NAME,
        types:[{ description:"자리배치 저장 파일", accept:{ "application/json":[".json"] } }]
      });
      fileHandle = h; pendingHandle = null;
      await idbSet("handle", h);
      await writeFile();
      toast("이제 " + h.name + " 에 자동으로 저장됩니다.");
    }catch(e){ if(e && e.name !== "AbortError") toast("저장 파일을 만들지 못했습니다."); }
  }

  async function linkOpen(){
    try{
      const [h] = await window.showOpenFilePicker({
        types:[{ description:"자리배치 저장 파일", accept:{ "application/json":[".json"] } }]
      });
      if((await h.requestPermission({ mode:"readwrite" })) !== "granted"){
        toast("파일 쓰기 권한이 필요합니다."); return;
      }
      fileHandle = h; pendingHandle = null;
      await idbSet("handle", h);
      const ok = await readFile(h);
      if(!ok) await writeFile();
      fileStatus("저장됨");
      toast(h.name + " 을(를) 불러왔습니다.");
    }catch(e){
      if(e && e.name === "AbortError") return;
      toast("파일을 읽지 못했습니다. 형식을 확인해 주세요.");
    }
  }

  async function reconnect(){
    if(!pendingHandle) return;
    try{
      if((await pendingHandle.requestPermission({ mode:"readwrite" })) !== "granted"){
        toast("파일 접근을 허용해야 자동 저장됩니다."); return;
      }
      fileHandle = pendingHandle; pendingHandle = null;
      await readFile(fileHandle);
      fileStatus("저장됨");
      toast(fileHandle.name + " 에 다시 연결되었습니다.");
    }catch(e){
      pendingHandle = null; fileStatus();
      toast("파일에 다시 연결하지 못했습니다. ‘저장 파일 열기’로 선택해 주세요.");
    }
  }

  async function restoreHandle(){
    if(!FS_OK) return;
    let h = null;
    try{ h = await idbGet("handle"); }catch(e){}
    if(!h) return;
    try{
      const p = await h.queryPermission({ mode:"readwrite" });
      if(p === "granted"){
        fileHandle = h;
        await readFile(h);
        fileStatus("저장됨");
      }else{
        pendingHandle = h;
        fileStatus();
      }
    }catch(e){ fileStatus(); }
  }

  // File System Access API 를 못 쓰는 브라우저용 (내보내기 / 불러오기)
  function exportFile(){

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = FILE_NAME;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);

  els.filePicker.addEventListener("change", () => {
