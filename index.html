  /* ── 그리드 만들기 / 크기 맞추기 ───────────── */
  function buildGrid(){
    const rows = +els.rows.value || 1, cols = +els.cols.value || 1;
    const pairs = Math.ceil(cols / 2);                 // 한 줄에 들어가는 짝꿍 묶음 수
    els.board.style.setProperty("--pairs", pairs);
    els.grid.innerHTML = "";
    cells = new Array(rows * cols);

    // 첫 줄은 분단 머리글, 각 줄 맨 앞은 줄 번호 — 자리 위치를 눈으로 짚으려고 둔다
    const lab = (cls, text) => {
      const d = document.createElement("div");
      d.className = cls; d.textContent = text;
      return d;
    };
    els.grid.appendChild(lab("rowh", ""));                 // 왼쪽 위 빈 칸
    for(let p = 0; p < pairs; p++) els.grid.appendChild(lab("colh", (p + 1) + "분단"));

    for(let r = 0; r < rows; r++){
      els.grid.appendChild(lab("rowh", (r + 1) + "줄"));
      for(let p = 0; p < pairs; p++){
        const box = document.createElement("div");
        box.className = "pair";
        for(let c = p * 2; c < Math.min(p * 2 + 2, cols); c++){
          const i = r * cols + c;
          const el = document.createElement("div");
          el.className = "seat";
          el.draggable = true;
          el.dataset.i = i;
          el.innerHTML =
            '<span class="mark"></span><span class="nm"></span>' +
            '<input class="ed" name="seat' + i + '" autocomplete="off" maxlength="20" ' +
            'spellcheck="false" hidden><span class="no"></span>';
          bindSeat(el);
          box.appendChild(el);
          cells[i] = el;
        }
        els.grid.appendChild(box);
      }
    }
    paint();
    fit();
  }

  // 화면에 꽉 차도록 좌석 크기와 글자 크기를 계산
  function fit(){
    const rows = +els.rows.value || 1, cols = +els.cols.value || 1;
    const availW = els.area.clientWidth, rawH = els.area.clientHeight;
    if(!availW || !rawH) return;

    const gap = availW < 700 ? 8 : 12;                   // 줄 사이
    const gapIn = Math.round(gap * 0.6);                 // 짝꿍 사이 (좁게)
    const gapPr = Math.round(gap * 1.8);                 // 분단 사이 (조금만 넓게)
    const ratio = 1.49;                                  // 좌석 가로/세로 비율 (시안과 같게)

    const pairs = Math.ceil(cols / 2);
    const wGaps = gapIn * (cols - pairs) + gapPr * (pairs - 1);   // 가로 간격 합계

    // 줄 번호 칸과 분단 머리글이 차지하는 만큼을 먼저 빼 둔다
    const labW = 34, headH = 19;
    const sideW = labW + gapPr;

    // 교탁 높이만큼 뺀 나머지에 좌석을 채운다
    const solve = barH => {
      // 교탁 아래 간격은 줄 간격의 55% 다 (.board 의 gap)
      const availH = rawH - barH - headH - gap * 0.55 - gap * (rows - 1);
      let cardH = availH / rows;
      let cardW = Math.min(cardH * ratio, 360);
      let w = cardW * cols + wGaps;
      const maxW = availW - sideW;
      if(w > maxW){
        // 가로가 먼저 찼다 → 세로가 남는다. 그 높이를 자리에 준다
        // (너무 정사각이 되지 않게 가로/세로 1.25 까지만)
        w = maxW;
        cardW = (w - wGaps) / cols;
        cardH = Math.min(availH / rows, cardW / 1.25);
      }
      return {
        cardW, cardH, w,
        nm: Math.max(13, Math.min(52, Math.min(cardW * 0.158, cardH * 0.27))),
      };
    };

    let barH = Math.round(Math.min(40, Math.max(24, rawH * 0.055)));
    let L = solve(barH);
    const need = Math.ceil(L.nm * 0.46 * 1.9);           // 교탁 글자는 번호 크기다
    if(need > barH){ barH = need; L = solve(barH); }

    els.board.style.setProperty("--gap", gap + "px");
    els.board.style.setProperty("--gap-in", gapIn + "px");
    els.board.style.setProperty("--gap-pair", gapPr + "px");
    els.board.style.setProperty("--lab", labW + "px");
    els.board.style.setProperty("--w", Math.floor(L.w + sideW) + "px");
    els.board.style.setProperty("--cardh", Math.floor(L.cardH) + "px");
    els.board.style.setProperty("--nm", L.nm.toFixed(1) + "px");
    els.board.style.setProperty("--no", Math.max(11, L.nm * 0.46).toFixed(1) + "px");

    // 교탁·자리는 왼쪽 줄 번호 칸만큼 오른쪽으로 치우쳐 있다 → 안내·상단 이름도 같은 선에 맞춘다
    document.querySelector(".app").style.setProperty("--board-shift", Math.round(sideW / 2) + "px");

    els.podiumBar.style.height = barH + "px";
    els.podiumBar.style.width =
      Math.round(Math.min(L.w, Math.max(130, L.cardW * 1.25 + gap))) + "px";
  }

  // 상단바에 "언제 배치했는지" — 마지막으로 자리를 뽑은 날짜
  function showPlacedDate(){
    const d = placedAt ? new Date(placedAt) : null;
    if(!d || isNaN(d)){ els.placedDate.textContent = ""; return; }
    els.placedDate.innerHTML =
      `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일<span class="suffix">배치</span>`;
  }

  function paint(){
    for(let i=0;i<cells.length;i++){
      const el = cells[i], s = seats[i] != null ? students[seats[i]] : null;
      const nm = el.querySelector(".nm"), no = el.querySelector(".no");
      // 기준 배치와 다를 때만 '교환됨' → 원래대로 되돌리면 표시가 사라진다
      // (추첨 애니메이션 중에는 기준 배치가 아직 정해지지 않았으므로 표시하지 않는다)
      const moved = !busy && !locked[i] && seats[i] !== (base[i] != null ? base[i] : null);

      nm.textContent = s ? s.name : "";
      nm.classList.toggle("long", !!s && s.name.length >= 5);
      no.textContent = s ? s.no + "번" + (s.role ? " · " + s.role : "") : "";   // 예) 16번 · 회장
      el.classList.toggle("empty", !s && !editing);
      el.classList.toggle("locked", !!locked[i]);
      el.classList.toggle("swapped", moved);
      el.querySelector(".mark").textContent = "";     // 고정·교환은 테두리로 보인다
    }
    showPlacedDate();
    updateConfirm();
    const seated = seats.filter(v => v != null).length;
    // 현황 줄 — 숫자는 흐리게 (시안과 같은 모양)
    els.count.replaceChildren(...[
      ["학생", students.length], ["자리", cells.length],
      ["줄", +els.rows.value || 0], ["분단", Math.ceil((+els.cols.value || 0) / 2)],
    ].map(([lab, n]) => {
      const sp = document.createElement("span");
      sp.append(lab + " ");
      const i = document.createElement("i"); i.textContent = n;
      sp.append(i);
      return sp;
    }));

    const over = students.length - cells.length;
    if(over > 0){
      els.warn.textContent = `좌석(${cells.length}칸)보다 학생이 ${over}명 많습니다. 가로·세로 수를 늘려 주세요.`;
      els.warn.classList.add("on");
    }else{
      els.warn.classList.remove("on");
    }
  }

  /* ── 이름 바꾸기 모드 ──────────────────────── */
  function setEdit(on){
    if(on === editing || busy) return;
    editing = on;
    document.body.classList.toggle("editing", on);
    els.legend.hidden = on;
    els.editLegend.hidden = !on;
    if(on) toggleMenu(false);   // 나머지 상단 버튼은 CSS(body.editing)로 감춘다

    if(on){
      cells.forEach((el, i) => {
        const s = seats[i] != null ? students[seats[i]] : null;
        const ed = el.querySelector(".ed");
        ed.value = s ? s.name : "";
        ed.hidden = false;
        el.querySelector(".nm").hidden = true;
        el.draggable = false;
      });
      paint();
      focusSeat(0);
    }else{
      commitEdits();
      cells.forEach(el => {
        el.querySelector(".ed").hidden = true;
        el.querySelector(".nm").hidden = false;
        el.draggable = true;
      });
      paint();
      save();
    }
  }

  function focusSeat(i){
    if(i < 0 || i >= cells.length){ setEdit(false); return; }
    const ed = cells[i].querySelector(".ed");
    ed.focus(); ed.select();
  }

  // 좌석 칸에 적힌 이름을 읽어 명단을 다시 만든다
  function commitEdits(){
    const n = cells.length;
    const entries = [];
    for(let i=0;i<n;i++){
      const raw = cells[i].querySelector(".ed").value.trim();
      if(!raw) continue;
      const m = raw.match(NUM_RE);
      const prev = seats[i] != null ? students[seats[i]] : null;
      entries.push({
        seat:i,
        name: m ? m[2].trim() : raw,
        no:   m ? +m[1] : (prev ? prev.no : 0),     // 번호를 안 쓰면 원래 번호를 유지
        role: prev ? prev.role : undefined          // 역할도 그대로 따라간다
      });
    }

    const oldSeats = seats.slice(), oldBase = base.slice();

    // 번호 충돌 정리 후 번호순으로 명단 구성
    const taken = new Set();
    for(const e of entries){
      if(e.no && !taken.has(e.no)) taken.add(e.no);
      else e.no = 0;
    }
    let next = 1;
    for(const e of entries){
      if(e.no) continue;
      while(taken.has(next)) next++;
      e.no = next; taken.add(next);
    }
    entries.sort((a,b) => a.no - b.no);

    students = entries.map(e => {
      const s = { no:e.no, name:e.name };
      if(e.role) s.role = e.role;
      return s;
    });
    seats = new Array(n).fill(null);
    entries.forEach((e, idx) => { seats[e.seat] = idx; });

    // 교환 표시가 유지되도록, 같은 자리에 있던 사람끼리 이어서 기준 배치를 옮겨 준다
    // (이름·번호만 고친 경우는 같은 사람으로 보고 교환 표시가 생기지 않는다)
    const remap = new Map();
    for(let i=0;i<n;i++){
      if(oldSeats[i] != null) remap.set(oldSeats[i], seats[i]);
    }
    base = oldBase.map(v => (v != null && remap.has(v)) ? remap.get(v) : null);
    lockWho = lockWho.map(v => (v != null && remap.has(v)) ? remap.get(v) : null);

    // 비어 있던 자리에 새로 적은 이름은 '교환'이 아니므로 기준 배치로 삼는다
    for(let i=0;i<n;i++){
      if(oldSeats[i] == null && oldBase[i] == null && seats[i] != null) base[i] = seats[i];
    }
  }

  /* ── 역할 (회장 / 부회장) ──────────────────── */
  const ROLES = ["회장", "부회장"];

  function syncRoleInputs(){
    const of = role => (students.find(s => s.role === role) || {}).name || "";
    els.roleA.value = of("회장");
    els.roleB.value = of("부회장");
  }

  function fillNameList(){
    els.nameList.replaceChildren(...students.map(s => {
      const o = document.createElement("option");
      o.value = s.name;
      return o;
    }));
  }

  function applyRole(role, input){
    const name = input.value.trim();
    for(const s of students) if(s.role === role) delete s.role;   // 기존 담당자 해제
    if(name){
      const t = students.find(s => s.name === name);
      if(t) t.role = role;                                        // 한 사람은 역할 하나
      else toast(`‘${name}’ 이름의 학생이 명단에 없습니다.`);
    }
    syncRoleInputs(); paint(); save();
  }

  function renumberByName(){
    if(!students.length) return;
    const order = students.map((s, i) => i)
                          .sort((a, b) => students[a].name.localeCompare(students[b].name, "ko"));
    const map = new Map(order.map((oldIdx, k) => [oldIdx, k]));
    const numbers = new Map(order.map((oldIdx, k) => [students[oldIdx].no, k + 1]));
    const remapNo = no => no == null ? null : (numbers.get(+no) ?? no);
    const remapKeys = bag => Object.fromEntries(Object.entries(bag || {}).map(([no, value]) => [remapNo(no), value]));
    const remapHistory = list => (list || []).map(h => Object.assign({}, h, {seats:h.seats.map(remapNo)}));
    seatHistory = remapHistory(seatHistory);
    if(committed){
      for(const key of ["seats", "base"]) committed[key] = committed[key].map(v => v == null ? null : (map.get(v) ?? null));
      committed.seatHistory = remapHistory(committed.seatHistory);
    }
    const cleaning = extra.cleaning;
    if(cleaning){
      for(const key of ["assign", "base"])
        for(const id of Object.keys(cleaning[key] || {})) cleaning[key][id] = cleaning[key][id].map(remapNo);
      for(const key of ["locked", "excluded", "badly"])
        if(Array.isArray(cleaning[key])) cleaning[key] = cleaning[key].map(remapNo);
      for(const key of ["chief", "vice", "captain"]) if(key in cleaning) cleaning[key] = remapNo(cleaning[key]);
      for(const role of cleaning.roles || []) role.no = remapNo(role.no);
      cleaning.checks = remapKeys(cleaning.checks);
      for(const week of Object.keys(cleaning.marks || {})) cleaning.marks[week] = remapKeys(cleaning.marks[week]);
      for(const history of cleaning.history || []){
        history.rec = remapKeys(history.rec);
        if(history.chk) history.chk = remapKeys(history.chk);
      }
    }
    // Scratch checkmarks are browser-local and keyed by number, too.
    try{
      const scratch = JSON.parse(localStorage.getItem("check-scratch") || "{}");
      localStorage.setItem("check-scratch", JSON.stringify(Object.fromEntries(Object.entries(scratch).map(([key,value]) => {
        const [no, ...rest] = key.split(":"); return [[remapNo(no), ...rest].join(":"), value];
      }))));
    }catch(e){}
    students = order.map((oldIdx, k) => {
      const s = { no:k+1, name:students[oldIdx].name };
      if(students[oldIdx].role) s.role = students[oldIdx].role;
      return s;
    });
    seats = seats.map(v => (v != null && map.has(v)) ? map.get(v) : null);
    base  = base.map(v => (v != null && map.has(v)) ? map.get(v) : null);
    lockWho = lockWho.map(v => (v != null && map.has(v)) ? map.get(v) : null);
    paint(); save();
    toast("이름 가나다순으로 번호를 다시 매겼습니다.");
  }

  /* ── 좌석 상호작용 (클릭=고정 / 드래그=교환) ── */
  let dragFrom = null;

  function bindSeat(el){
    const i = +el.dataset.i;
    const ed = el.querySelector(".ed");

    // 애니메이션이 끝나면 클래스를 떼어 낸다.
    // 남겨 두면 좌석이 합성 레이어로 유지돼 인쇄할 때 비트맵으로 구워진다(=화질 저하).
    el.addEventListener("animationend", () => {
      el.classList.remove("pop", "settle");
      el.style.removeProperty("--d");
    });

    el.addEventListener("click", () => {
      // TV 화면은 보여 주기만 한다 — 거기서 전체화면을 켜려고 누른 클릭에
      // 고정이 바뀌면, 노트북에서 돌릴 때 그 학생이 따라 움직인다.
      if(TV || busy) return;
      if(editing){ ed.focus(); ed.select(); return; }
      locked[i] = !locked[i];
      lockWho[i] = locked[i] ? seats[i] : null;    // 자리와 함께 지금 앉은 학생을 기억한다
      paint(); save();
    });

    ed.addEventListener("keydown", e => {
      if(e.key === "Enter"){ e.preventDefault(); focusSeat(i + (e.shiftKey ? -1 : 1)); }
      else if(e.key === "Escape"){ e.preventDefault(); ed.blur(); setEdit(false); }
    });

    el.addEventListener("dragstart", e => {
      if(TV || busy || editing){ e.preventDefault(); return; }
      if(locked[i]){ e.preventDefault(); toast("고정된 자리입니다. 눌러서 고정을 풀고 옮기세요."); return; }
      dragFrom = i;
      el.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", String(i));
    });
    el.addEventListener("dragend", () => {
      el.classList.remove("dragging");
      cells.forEach(c => c.classList.remove("drag-over"));
      dragFrom = null;
    });
    el.addEventListener("dragover", e => {
      if(dragFrom === null || dragFrom === i || locked[i]) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      el.classList.add("drag-over");
    });
    el.addEventListener("dragleave", () => el.classList.remove("drag-over"));
    el.addEventListener("drop", e => {
      e.preventDefault();
      el.classList.remove("drag-over");
      const from = dragFrom;
      if(from === null || from === i || locked[i] || locked[from]) return;

      const t = seats[i]; seats[i] = seats[from]; seats[from] = t;
      [i, from].forEach(k => {
        cells[k].classList.remove("pop");
        void cells[k].offsetWidth;
        cells[k].classList.add("pop");
      });
      paint(); markDirty();
    });
  }

  /* ── 랜덤 배치 ─────────────────────────────── */
  function shuffled(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function assign(open, pool){
    for(let k=0;k<open.length;k++) seats[open[k]] = k < pool.length ? pool[k] : null;
  }

  function doShuffle(){
    if(busy || editing) return;

    // 고정된 자리의 학생은 그대로 두고 나머지만 섞는다
    const open = [], keep = new Set();
    for(let i=0;i<cells.length;i++){
      if(locked[i]){ if(seats[i] != null) keep.add(seats[i]); }
      else open.push(i);
    }
    if(!open.length) return;

    const pool = [];
    for(let i=0;i<students.length;i++) if(!keep.has(i)) pool.push(i);

    busy = true;
    els.shuffle.disabled = true;
    document.body.classList.add("spinning");

    // 처음엔 빠르게, 갈수록 느리게 — 돌아가던 룰렛이 멈추는 느낌
    const start = performance.now(), DURATION = 2600;
    (function tick(){
      const p = Math.min(1, (performance.now() - start) / DURATION);
      assign(open, shuffled(pool));
      paint();

      if(p >= 1){
        assign(open, shuffled(pool));
        base = seats.slice();                   // 새로 뽑은 자리가 기준이 된다 (화면에서만)
        // 배치 날짜와 '이전 배치' 기록은 확정할 때 남긴다 — 그전까지는 화면만 바뀐다
        document.body.classList.remove("spinning");
        paint();
        settleSeats(open);                      // 한 칸씩 차례로 내려앉기
        busy = false;
        els.shuffle.disabled = false;
        markDirty();
        return;
      }
      setTimeout(tick, 30 + 300 * Math.pow(p, 3));
    })();
  }

  // 앞줄 왼쪽부터 순서대로 착지시킨다
  function settleSeats(list){
    const order = list.slice().sort((a, b) => a - b);
    const step = order.length > 24 ? 28 : 36;
    order.forEach((i, k) => {
      const el = cells[i];
      el.classList.remove("pop", "settle");
      void el.offsetWidth;
      el.style.setProperty("--d", (k * step) + "ms");
      el.classList.add("settle");
    });
  }

  /* ── 설정 창 ───────────────────────────────── */
  const isOpen = () => !els.backdrop.hasAttribute("hidden");
  function openSheet(){
    renderHistList();
    if(editing) return;
    els.backdrop.removeAttribute("hidden");
    fillNameList();
    syncRoleInputs();
    fileStatus();
  }
  function closeSheet(){ els.backdrop.setAttribute("hidden",""); fit(); }

  els.settings.addEventListener("click", openSheet);
  els.close.addEventListener("click", closeSheet);
  els.backdrop.addEventListener("mousedown", e => { if(e.target === els.backdrop) closeSheet(); });

  /* ── 알림 ──────────────────────────────────── */
  let toastTimer = null;
  function toast(msg, ms){
    els.toast.textContent = msg;
    els.toast.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove("on"), ms || 3200);
  }

  /* ── 이벤트 연결 ───────────────────────────── */
  function relayout(){
    if(editing) return;
    els.rows.value = clamp(els.rows.value, 1, 12, 5);
    els.cols.value = clamp(els.cols.value, 1, 12, 6);
    resetSeats();
    fillInOrder();
    buildGrid();
    dirty = false;                      // 칸 수를 바꾸면 그 자리에서 바로 새 자리를 확정한다
    committed = grabAssign();
    save();
  }
  els.rows.addEventListener("change", relayout);
  els.cols.addEventListener("change", relayout);

  els.titleInput.addEventListener("input", () => { renderTitle(); save(); });
  els.titleShow.addEventListener("change", () => { renderTitle(); save(); });
  els.renameStart.addEventListener("click", () => { closeSheet(); setEdit(true); });
  els.doneEdit.addEventListener("click", () => setEdit(false));
  els.renumber.addEventListener("click", renumberByName);
  els.clearHist.addEventListener("click", () => {
    if(!seatHistory.length){ toast("지울 기록이 없습니다."); return; }
    if(!confirm(`이전 배치 기록 ${seatHistory.length}회를 모두 지울까요?`)) return;
    seatHistory = [];
    renderHistList(); save();
    toast("이전 배치 기록을 모두 지웠습니다.");
  });

  els.clearSwap.addEventListener("click", () => {
    if(busy) return;
    base = seats.slice();                       // 지금 배치를 기준으로 삼는다
    paint(); save();
    toast("지금 배치를 기준으로 삼았습니다. 교환 표시가 사라집니다.");
  });
  els.roleA.addEventListener("change", () => applyRole("회장", els.roleA));
  els.roleB.addEventListener("change", () => applyRole("부회장", els.roleB));
  els.shuffle.addEventListener("click", doShuffle);
  els.confirmBtn.addEventListener("click", confirmSeats);
  function toggleMenu(show){
    const on = show === undefined ? els.printMenu.hasAttribute("hidden") : show;
    if(on) els.printMenu.removeAttribute("hidden");
    else els.printMenu.setAttribute("hidden", "");
    els.printBtn.classList.toggle("open", on);
    els.printBtn.setAttribute("aria-expanded", String(on));
  }

  // podium = 이름을 180° 돌려서 인쇄 (교탁용)
  /* ── 배치를 그림으로 만들어 클립보드에 담기 ── */
  // 화면에 보이는 그대로를 SVG 안에 담아 캔버스로 옮긴다.
  // 글꼴이 시스템 글꼴(맑은 고딕·Noto Sans KR 등)이라 따로 넣지 않아도 그대로 나온다.
  const SHOT_PAD = 18, SHOT_GAP = 12, SHOT_SCALE = 2;

  async function makeShot(){
    document.body.classList.add("shooting");   // 제목은 그림에 담을 때만 보인다
    try{ return await makeShotInner(); }
    finally{ document.body.classList.remove("shooting"); }
  }

  async function makeShotInner(){
    const nodes = shotNodes();
    if(!nodes.length) throw new Error("담을 것이 없습니다");

    const rects = nodes.map(n => n.getBoundingClientRect());
    const w = Math.ceil(Math.max(...rects.map(r => r.width))) + SHOT_PAD * 2;
    const h = Math.ceil(rects.reduce((a, r) => a + r.height, 0)
                        + SHOT_GAP * (nodes.length - 1)) + SHOT_PAD * 2;

    const wrap = document.createElement("div");
    wrap.style.cssText =
      `width:${w}px;height:${h}px;box-sizing:border-box;padding:${SHOT_PAD}px;` +
      `display:flex;flex-direction:column;align-items:center;justify-content:flex-start;` +
      `gap:${SHOT_GAP}px;background:#fff;` +
      `font-family:${getComputedStyle(document.body).fontFamily};`;

    const st = document.createElement("style");
    st.textContent = [...document.querySelectorAll("style")].map(s => s.textContent).join("\n") +
      "\n*{animation:none!important;transition:none!important;box-shadow:none!important;}";
    wrap.append(st);

    nodes.forEach((n, i) => {
      const c = n.cloneNode(true);
      // 화면에서만 쓰는 것들은 그림에 넣지 않는다
      c.querySelectorAll(".legend,.warn,.toast,.mode-note,.roster-bar,.draft-tag,.setup-tip,[hidden]")
       .forEach(x => x.remove());
      c.style.flex = "none";
      c.style.margin = "0";
      c.style.width  = Math.ceil(rects[i].width) + "px";
      c.style.height = Math.ceil(rects[i].height) + "px";
      wrap.append(c);
    });

    const xml = new XMLSerializer().serializeToString(wrap);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}">` +
                `<foreignObject width="100%" height="100%">${xml}</foreignObject></svg>`;

    const img = new Image();
    await new Promise((res, rej) => {
      img.onload = res;
      img.onerror = () => rej(new Error("그림을 만들지 못했습니다"));
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    });

    const cv = document.createElement("canvas");
    cv.width = w * SHOT_SCALE; cv.height = h * SHOT_SCALE;
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.scale(SHOT_SCALE, SHOT_SCALE);
    ctx.drawImage(img, 0, 0);

    return new Promise((res, rej) =>
      cv.toBlob(b => b ? res(b) : rej(new Error("그림을 만들지 못했습니다")), "image/png"));
  }

  async function copyShot(){
    if(busy) return;
    let blob;
    try{
      blob = await makeShot();
    }catch(e){
      toast("그림을 만들지 못했습니다. 다시 시도해 주세요.", 4000);
      return;
    }
    try{
      if(!navigator.clipboard || !window.ClipboardItem) throw new Error("클립보드 없음");
      await navigator.clipboard.write([ new ClipboardItem({ "image/png": blob }) ]);
      toast("배치 그림을 복사했습니다. 붙여넣기(Ctrl+V) 하세요.", 4000);
    }catch(e){
      // 클립보드를 막아 둔 브라우저면 그림 파일로 내려 준다
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = SHOT_NAME();
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast("클립보드를 쓸 수 없어 그림 파일로 저장했습니다.", 5000);
    }
  }

  // 그림에 담을 것 : 제목(켜 둔 경우) + 교탁·자리표
  function shotNodes(){
    const list = [];
    if(els.titleShow.checked && els.chartTitle.textContent.trim()) list.push(els.chartTitle);
    list.push(els.board);
    return list;
  }
  const SHOT_NAME = () =>
    (els.titleInput.value.trim() || "자리배치도").replace(/[\/:*?"<>|]/g, "") + ".png";

  /* ── TV(외부 화면)로 전환 ───────────────────── */
  // PPT 슬라이드쇼처럼, HDMI 로 연결된 확장 화면에 큰 화면을 띄우고
  // 노트북에는 손으로 다루는 화면을 남긴다.
  const TV = new URLSearchParams(location.search).has("tv");
  const TV_CH = ("BroadcastChannel" in window) ? new BroadcastChannel("classroom-screen") : null;
  let tvWin = null, tvWatch = null;

  // 확장 화면(HDMI 등)이 붙어 있을 때만 버튼을 보여 준다
  const tvReady = () => !!(window.screen && screen.isExtended);

  function syncTvBtn(){
    if(!els.tvBtn) return;
    const on = !!(tvWin && !tvWin.closed);
    els.tvBtn.hidden = TV || !tvReady();
    els.tvBtn.classList.toggle("on", on);
    els.tvBtn.title = on ? "TV 끄기 — TV 화면을 닫습니다"
                         : "TV 에 크게 띄우고 이 화면은 다루는 쪽으로 바꿉니다";
  }

  // 브라우저는 한 번의 클릭으로 "팝업 열기"와 "전체화면" 을 같이 해 주지 않는다.
  // (둘이 같은 사용자 동작을 서로 소비한다) → TV 전환 때 전체화면을 먼저 걸고,
  // 그래도 못 들어간 쪽은 다음 클릭이나 키 입력에 다시 시도한다.
  // meOk = 이 화면은 이미 전체화면이라 TV 만 남았을 때 true
  function armFullscreen(meOk){
    let bar = document.getElementById("fsHint");
    if(!bar){
      bar = document.createElement("div");
      bar.id = "fsHint";
      bar.style.cssText = "position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:70;" +
        "background:#1c2431;color:#fff;font-size:14px;font-weight:700;padding:11px 18px;" +
        "border-radius:11px;cursor:pointer;box-shadow:0 6px 24px rgba(15,20,30,.3);";
      document.body.appendChild(bar);
    }
    bar.textContent = meOk ? "Enter 를 누르면 TV 가 전체화면이 됩니다"
                           : "Enter 를 누르면 TV 가, 이 화면을 누르면 여기도 전체화면이 됩니다";
    const go = e => {
      document.removeEventListener("click", go, true);
      document.removeEventListener("keydown", go, true);
      bar.remove();
      // 이 클릭은 '전체화면 켜기' 로만 쓰고 여기서 끝낸다.
      // 소비하지 않으면 밑에 있는 좌석까지 눌려 고정이 풀린다.
      if(e && e.type === "click"){
        e.preventDefault();
        e.stopPropagation();
        if(e.stopImmediatePropagation) e.stopImmediatePropagation();
      }
      tvFullscreen();          // TV 부터 (거기는 아무도 누를 수 없다)
      goFullNow();
      if(!tvFullscreenOn()) setTimeout(() => { try{ tvWin && tvWin.focus(); }catch(err){} }, 300);
    };
    document.addEventListener("click", go, true);
    document.addEventListener("keydown", go, true);
    // 시간이 지나면 안내를 거둔다. 리스너도 같이 떼야 한다 —
    // 남겨 두면 그 뒤의 클릭 한 번이 (소비돼) 아무 일도 없이 사라진다.
    setTimeout(() => {
      document.removeEventListener("click", go, true);
      document.removeEventListener("keydown", go, true);
      bar.remove();
    }, 15000);
  }

  function goFullNow(){
    const el = document.documentElement;
    if(document.fullscreenElement || !el.requestFullscreen) return;
    try{ const p = el.requestFullscreen({ navigationUI:"hide" }); if(p) p.catch(() => {}); }
    catch(e){}
  }

  // TV 창을 전체화면으로 만든다.
  // TV 창 스스로는 사용자 동작이 없어 requestFullscreen 이 거부된다.
  // 사용자 동작이 살아 있는 이쪽(노트북)에서 대신 걸어 준다 — 같은 출처라 된다.
  // 그래도 막히면 TV 에게 직접 시도하라고 알린다.
  function tvFullscreen(){
    if(!tvWin || tvWin.closed) return;
    try{
      const d = tvWin.document;
      if(d && !d.fullscreenElement && d.documentElement.requestFullscreen){
        const p = d.documentElement.requestFullscreen({ navigationUI:"hide" });
        if(p) p.catch(() => askTvFullscreen());
        return;
      }
    }catch(e){ /* 접근이 막히면 메시지로 부탁한다 */ }
    askTvFullscreen();
  }
  function askTvFullscreen(){
    if(TV_CH) TV_CH.postMessage({ cmd:"fullscreen" });
  }
  // TV 창이 전체화면인지 (읽을 수 없으면 됐다고 보고 더 조르지 않는다)
  function tvFullscreenOn(){
    if(!tvWin || tvWin.closed) return true;
    try{ return !!tvWin.document.fullscreenElement; }catch(e){ return true; }
  }

  async function toggleTv(){
    if(tvWin && !tvWin.closed){
      tvWin.close();                                     // 감시 타이머가 뒷정리한다
      if(document.fullscreenElement) document.exitFullscreen().catch(() => {});
      return;
    }

    // 전체화면을 '먼저' 요청한다.
    // window.open 이 사용자 동작을 써 버리므로 팝업을 먼저 열면 그 뒤의
    // requestFullscreen 은 거부된다. (실측 : 팝업 먼저 0/3, 전체화면 먼저 5/5)
    goFullNow();

    let feat = "width=1280,height=800";
    try{
      if(window.getScreenDetails){
        const d = await window.getScreenDetails();
        const other = d.screens.filter(s => s !== d.currentScreen);
        const t = other.find(s => !s.isPrimary) || other[0];
        if(t) feat = `left=${t.availLeft},top=${t.availTop},width=${t.availWidth},height=${t.availHeight}`;
      }
    }catch(e){ /* 권한을 거부하면 기본 크기로 연다 */ }

    tvWin = window.open(location.pathname + "?tv=1", "classroomTv",
                        feat + ",menubar=no,toolbar=no,location=no,status=no");
    if(!tvWin){
      toast("팝업이 막혀 있습니다. 주소창 오른쪽의 팝업 허용을 눌러 주세요.", 6000);
      return;
    }
    onTvOpened();
    syncTvBtn();
    try{ tvWin.focus(); }catch(e){}        // 키보드를 TV 로 → Enter 한 번이면 TV 가 전체화면
    // 이 화면은 위에서 이미 전체화면이 됐다. TV 쪽은 자기 사용자 동작이 없어
    // 막힐 수 있으니 곧바로 한 번 걸어 보고, 그래도 안 되면 다음 클릭을 기다린다.
    tvFullscreen();
    setTimeout(() => {
      const meOk = !!document.fullscreenElement;
      const tvOk = tvFullscreenOn();
      if(!meOk || !tvOk) armFullscreen(meOk);
    }, 500);
    clearInterval(tvWatch);
    tvWatch = setInterval(() => {
      if(tvWin && tvWin.closed){
        clearInterval(tvWatch); tvWin = null; onTvClosed(); syncTvBtn();
      }
    }, 700);
  }

  // 노트북 쪽에서 내용이 바뀌면 TV 화면에 알린다
  function tvPing(){ if(TV_CH && !TV) TV_CH.postMessage("changed"); }

  if(TV){
    document.body.classList.add("tv");
    // TV 창은 스스로 누른 적이 없어서 전체화면이 막힐 수 있다.
    // 열리자마자 · 잠시 뒤 · 첫 클릭 때까지 여러 번 시도한다.
    // 꽉 찼는가 — 코드로 켠 전체화면이든 F11(브라우저 전체화면)이든 화면을 채우면 된 것으로 본다.
    // (F11 상태에서 코드가 또 전체화면을 걸면 둘이 번갈아 켜지고 꺼져 여러 번 눌러야 했다)
    const isFull = () => !!document.fullscreenElement ||
      (innerWidth >= screen.width - 2 && innerHeight >= screen.height - 2);
    let tip = null;
    const hideTip = () => { if(tip){ tip.remove(); tip = null; } };
    const goFull = e => {
      // F11 은 브라우저가 알아서 한다 — 여기서 또 걸면 서로 뒤집는다. Esc 는 창 닫기다.
      if(e && e.type === "keydown" && (e.key === "F11" || e.key === "Escape")) return;
      if(isFull()){ hideTip(); return; }
      const el = document.documentElement;
      try{ const p = el.requestFullscreen({ navigationUI:"hide" }); if(p) p.then(hideTip, () => {}); }
      catch(err){}
    };
    // 이 창은 누른 적이 없어 자동 요청은 브라우저가 거의 막는다. 그래도 한 번은 해 본다.
    goFull();
    // 이 창에서의 첫 동작(Enter 같은 아무 키 · 클릭 한 번)으로 전체화면이 된다.
    ["keydown", "pointerdown"].forEach(ev => window.addEventListener(ev, goFull, true));
    document.addEventListener("fullscreenchange", () => { if(isFull()) hideTip(); });
    window.addEventListener("resize", () => { if(isFull()) hideTip(); });
    // 안내는 TV 한가운데 크게 — 전체화면이 될 때까지 둔다
    setTimeout(() => {
      if(isFull() || tip) return;
      tip = document.createElement("div");
      tip.style.cssText = "position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:80;" +
        "background:rgba(30,30,30,.92);color:#fff;font-size:22px;font-weight:600;" +
        "padding:18px 28px;border-radius:8px;text-align:center;line-height:1.5;pointer-events:none;";
      tip.textContent = "Enter 를 누르거나 화면을 한 번 누르면 전체화면이 됩니다";
      document.body.appendChild(tip);
    }, 600);
    document.addEventListener("keydown", e => { if(e.key === "Escape") window.close(); });
    if(TV_CH) TV_CH.onmessage = e => {
      const m = e.data;
      if(m && m.cmd === "close"){ window.close(); return; }
      if(m && m.cmd === "fullscreen"){ goFull(); return; }
      if(m && m.ask){ TV_CH.postMessage({ alive:1 }); return; }
      // 노트북이 보낸 지금 화면 — 확정 전 배치도 그대로 보여 준다
      if(m && m.cmd === "state"){
        if(m.page === "seating" && m.data){ liveAt = Date.now(); if(apply(m.data)) buildGrid(); }
        return;
      }
      // 파일은 '확정본' 이라, 노트북 화면을 받고 있는 동안엔 다시 읽지 않는다
      if(m === "changed" && SERVER && Date.now() - liveAt > 30000) loadServer();
    };
    // 살아 있다고 알려 준다 (다른 페이지의 'TV 끄기' 버튼이 이걸 본다)
    if(TV_CH) setInterval(() => TV_CH.postMessage({ alive:1 }), 1500);
    setInterval(() => { if(SERVER && Date.now() - liveAt > 30000) loadServer(); }, 20000);   // 놓친 변화 대비
  }else if(window.screen && "addEventListener" in window.screen){
    try{ screen.addEventListener("change", syncTvBtn); }catch(e){}
  }
  window.addEventListener("pagehide", () => { if(tvWin && !tvWin.closed) tvWin.close(); });

  if(!TV){
    setInterval(() => { if(dirty && tvWin && !tvWin.closed) tvSend(); }, 3000);
    syncTvBtn();
    setInterval(syncTvBtn, 2000);     // HDMI 를 꽂거나 빼면 버튼이 따라 나타나고 사라진다
  }

  // 자리 배치는 TV 에만 크게 띄우고, 노트북 화면은 그대로 둔다
  function onTvOpened(){
    toast("TV 에 자리 배치를 띄웠습니다.", 4000);
  }
  function onTvClosed(){}

  function doPrint(podium){
    document.body.classList.toggle("podium", !!podium);
    const cleanup = () => document.body.classList.remove("podium");
    window.addEventListener("afterprint", cleanup, { once:true });
    setTimeout(cleanup, 60000);                 // afterprint 가 오지 않는 경우의 안전장치
    window.print();
  }

  els.tvBtn.addEventListener("click", toggleTv);
  els.printBtn.addEventListener("click", e => {
    e.stopPropagation();
    if(!editing) toggleMenu();
  });
  els.printMenu.addEventListener("click", e => {
    const item = e.target.closest("button[data-print]");
    if(!item) return;
    toggleMenu(false);
    if(item.dataset.print === "copy"){
      copyShot();
    }else if(item.dataset.print === "podium"){
      setTimeout(() => doPrint(true), 60);       // 패널이 닫힌 다음 인쇄 창을 연다
    }else if(item.dataset.print === "pdf"){
      setTimeout(() => doPrint(false), 60);
    }else{
      doPrint(false);
    }
  });
  document.addEventListener("click", () => toggleMenu(false));

  els.fileChip.addEventListener("click", () => {
    if(SERVER) openSheet();
    else if(pendingHandle) reconnect();
    else if(fileHandle) openSheet();
    else if(FS_OK) linkNew();
    else openSheet();
  });
  els.fileNew.addEventListener("click", linkNew);
  els.fileOpen.addEventListener("click", linkOpen);
  els.fileExport.addEventListener("click", exportFile);
  els.fileImport.addEventListener("click", () => els.filePicker.click());

  document.addEventListener("keydown", e => {
    if(e.key === "Escape"){
      if(isOpen()){ closeSheet(); return; }
      toggleMenu(false);
    }
    const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    if(TV) return;
    if(e.code === "Space" && !typing && !isOpen() && !editing){ e.preventDefault(); doShuffle(); }
  });

  window.addEventListener("resize", fit);
  if(window.ResizeObserver) new ResizeObserver(fit).observe(els.area);

  /* ── 페이지 전환 ───────────────────────────── */
  const app = document.querySelector(".app");
  // 애니메이션이 끝나면 클래스를 제거한다. 남겨 두면 합성 레이어가 유지돼 인쇄 화질이 떨어진다.
  app.addEventListener("animationend", () =>
    document.body.classList.remove("entering-right", "entering-left"));

  // 탭 순서 : 자리 배치 → 청소 역할 → 청소 체크.
  // 오른쪽 탭으로 갈수록 화면이 왼쪽으로 밀리도록 방향을 자동으로 정한다.
  const PAGES = ["index.html", "cleaning.html", "check.html"];
  const pageIdx = u => {
    const f = String(u).split("/").pop().split("?")[0];
    const i = PAGES.indexOf(f || "index.html");
    return i < 0 ? 0 : i;
  };
  const HERE = pageIdx(location.pathname);

  window.addEventListener("beforeunload", e => {
    if(SERVER && (needsSave || window.classroomStorage?.pending)){
      e.preventDefault(); e.returnValue = "";
    }
  });
  let navigating = false;
  async function flushBeforeNavigation(){
    clearTimeout(saveTimer); saveTimer = null;
    if(SERVER){
      while(needsSave || window.classroomStorage?.pending){
        if(!await putServer()) return false;
      }
      return !window.classroomStorage?.blocked;
    }
    return fileHandle ? await writeFile() : true;
  }

  async function navTo(url, dir){
    if(editing || busy) return;
    dir = pageIdx(url) > HERE ? "left" : "right";
    if(navigating) return;
    navigating = true;
    if(!await flushBeforeNavigation()){
      navigating = false;
      toast("저장하지 못해 화면 이동을 멈췄습니다. 저장 상태를 확인해 주세요.");
      return;
    }
    sessionStorage.setItem("navdir", dir);
    document.body.classList.add(dir === "left" ? "leaving-left" : "leaving-right");
    setTimeout(() => { location.href = url; }, 235);
  }
  els.toCleaning.addEventListener("click", () => navTo("cleaning.html"));
  els.toCheck.addEventListener("click", () => navTo("check.html"));

  const navdir = sessionStorage.getItem("navdir");
  if(navdir){
    sessionStorage.removeItem("navdir");
    document.body.classList.add(navdir === "right" ? "entering-left" : "entering-right");
  }

  /* ── 시작 ──────────────────────────────────── */
  if(SERVER){                                   // start.bat 으로 켠 경우 : 연결 버튼이 필요 없다
    els.fsButtons.hidden = true;
    els.dlButtons.hidden = true;
    els.fileHint.textContent = "";
  }else if(!FS_OK){                             // 파일 자동 저장을 못 쓰는 브라우저
    els.fsButtons.hidden = true;
    els.dlButtons.hidden = false;
    els.fileHint.textContent =
      "이 브라우저는 파일 자동 저장을 지원하지 않습니다. 내보내기로 저장 파일을 만들고, 다음에 불러오기로 여세요. (Chrome·Edge 권장)";
  }

  let cached = null;
  try{ cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); }catch(e){}
  if(!apply(cached)){
    students = DEFAULT_NAMES.map((name, i) => {
      const s = { no:i+1, name };
      if(DEFAULT_ROLES[name]) s.role = DEFAULT_ROLES[name];
      return s;
    });
    resetSeats();
    fillInOrder();
    committed = grabAssign();
  }
  renderTitle();
  buildGrid();
  fileStatus();

  // 서버 모드에서는 살아 있다는 신호를 보낸다. 이 신호가 끊기면 프로그램이 스스로 종료된다.
  if(SERVER){
    const ping = () => fetch("api/ping", { cache:"no-store" }).catch(() => {});
    ping();
    setInterval(ping, 5000);
    document.addEventListener("visibilitychange", () => { if(!document.hidden) ping(); });
  }


  if(SERVER) loadServer();                      // 서버가 가진 data.json 이 기준
  else restoreHandle();                         // 저장 파일이 있으면 그 내용으로 덮어쓴다
})();
</script>
</body>
</html>
