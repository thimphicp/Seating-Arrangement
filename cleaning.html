  els.printBtn.addEventListener("click", e => { e.stopPropagation(); toggleMenu(); });
  /* ── 청소 체크리스트 ───────────────────────── */
  // 구역 · 점검 기준 · 이름 · 요일별 체크 칸으로 된 표를 만든다.
  // 요일은 그 구역이 실제로 하는 날만 열어 둔다 (월수금 · 화목 등).
  function buildChecklist(){
    const box = els.checkSheet;
    box.replaceChildren();

    const h1 = document.createElement("h1");
    h1.textContent = "청소 체크리스트";
    const sub = document.createElement("p");
    sub.className = "cl-sub";
    const h = C.history && C.history[0];
    const d = h ? new Date(h.at) : new Date();
    sub.textContent = `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 배정 기준` +
                      `　·　학급 ${students.length}명 · 청소 ${rosterNos().length}명`;
    box.append(h1, sub);

    const table = document.createElement("table");
    table.className = "cl-table";
    const thead = document.createElement("thead");
    const hr = document.createElement("tr");
    for(const t of ["난이도", "청소 구역", "점검 기준", "이름"]){
      const th = document.createElement("th");
      th.textContent = t;
      th.className = "cl-" + (t === "점검 기준" ? "std" : t === "이름" ? "nm" : t === "난이도" ? "tier" : "area");
      hr.append(th);
    }
    for(const day of DAYS){
      const th = document.createElement("th");
      th.className = "cl-day";
      th.textContent = day;
      hr.append(th);
    }
    thead.append(hr);
    table.append(thead);

    const tbody = document.createElement("tbody");
    for(const tier of Object.keys(TIERS)){
      const list = C.areas.filter(a => a.tier === tier);
      if(!list.length) continue;
      let tierRows = 0;
      const rowsForTier = [];

      for(const a of list){
        const members = (C.assign[a.id] || []).slice();
        const names = members.length ? members.map(no => `${no}번 ${nameOf(no)}`) : ["(미배정)"];
        const std = (a.checks && a.checks.length) ? a.checks : ["—"];
        const days = daysOf(a);

        names.forEach((who, k) => {
          const tr = document.createElement("tr");
          if(k === 0) tr.classList.add("cl-first");
          if(k === 0){
            const tdA = document.createElement("td");
            tdA.className = "cl-area";
            tdA.rowSpan = names.length;
            tdA.textContent = a.name;
            const tdS = document.createElement("td");
            tdS.className = "cl-std";
            tdS.rowSpan = names.length;
            const ul = document.createElement("ul");
            for(const t of std){
              const li = document.createElement("li");
              li.textContent = t;
              ul.append(li);
            }
            tdS.append(ul);
            tr.append(tdA, tdS);
          }
          const tdN = document.createElement("td");
          tdN.className = "cl-nm";
          tdN.textContent = who;
          tr.append(tdN);

          DAYS.forEach((_, di) => {
            const td = document.createElement("td");
            td.className = "cl-box";   // 요일 제한 없음 — 아무 날이나 적을 수 있다
            tr.append(td);
          });
          rowsForTier.push(tr);
          tierRows++;
        });
      }
      rowsForTier.forEach((tr, i) => {
        if(i === 0){
          const tdT = document.createElement("td");
          tdT.className = "cl-tier";
          tdT.rowSpan = tierRows;
          tdT.textContent = TIERS[tier];
          tr.insertBefore(tdT, tr.firstChild);
        }
        tbody.append(tr);
      });
    }
    table.append(tbody);
    box.append(table);

    const foot = document.createElement("p");
    foot.className = "cl-foot";
    foot.textContent = "회색 칸은 그 요일에 하지 않는 구역입니다. " +
                       "센 체크 횟수는 추가 설정 → 체크 횟수 에 입력하면 다음 배정에 반영됩니다.";
    box.append(foot);
  }

  // 체크리스트 인쇄 모드가 켜져 있었다면 끄고 배치도로 되돌린다
  function normalPrint(){
    document.body.classList.remove("check-print");
    els.pageRule.textContent = "";
  }

  /* ── TV(외부 화면)로 전환 ───────────────────── */
  // PPT 슬라이드쇼처럼, HDMI 로 연결된 확장 화면에 큰 화면을 띄우고
  // 노트북에는 손으로 다루는 화면을 남긴다.
  const TV = new URLSearchParams(location.search).has("tv");
  const TV_CH = ("BroadcastChannel" in window) ? new BroadcastChannel("classroom-screen") : null;
  let tvWin = null, tvWatch = null;

  // 확장 화면(HDMI 등)이 붙어 있을 때만 버튼을 보여 준다
  const tvReady = () => !!(window.screen && screen.isExtended);

  function syncTvBtn(){
    if(!els.tvBtn) return;
    const on = !!(tvWin && !tvWin.closed);
    els.tvBtn.hidden = TV || !tvReady();
    els.tvBtn.classList.toggle("on", on);
    els.tvBtn.title = on ? "TV 끄기 — TV 화면을 닫습니다"
                         : "TV 에 크게 띄우고 이 화면은 다루는 쪽으로 바꿉니다";
  }

  // 이 창을 전체화면으로 (실패해도 조용히 넘어간다)
  // 브라우저는 한 번의 클릭으로 "팝업 열기"와 "전체화면" 을 같이 해 주지 않는다.
  // (둘이 같은 사용자 동작을 서로 소비한다) → 팝업을 먼저 열고,
  // 그 다음 아무 클릭이나 키 입력에 이 화면을 전체화면으로 만든다.
  // meOk = 이 화면은 이미 전체화면이라 TV 만 남았을 때 true
  function armFullscreen(meOk){
    let bar = document.getElementById("fsHint");
    if(!bar){
      bar = document.createElement("div");
      bar.id = "fsHint";
      bar.style.cssText = "position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:70;" +
        "background:#1c2431;color:#fff;font-size:14px;font-weight:700;padding:11px 18px;" +
        "border-radius:11px;cursor:pointer;box-shadow:0 6px 24px rgba(15,20,30,.3);";
      document.body.appendChild(bar);
    }
    bar.textContent = meOk ? "Enter 를 누르면 TV 가 전체화면이 됩니다"
                           : "Enter 를 누르면 TV 가, 이 화면을 누르면 여기도 전체화면이 됩니다";
    const go = e => {
      document.removeEventListener("click", go, true);
      document.removeEventListener("keydown", go, true);
      bar.remove();
      // 이 클릭은 '전체화면 켜기' 로만 쓰고 여기서 끝낸다.
      // 소비하지 않으면 밑에 있는 학생 칩까지 눌려 고정이 풀린다.
      if(e && e.type === "click"){
        e.preventDefault();
        e.stopPropagation();
        if(e.stopImmediatePropagation) e.stopImmediatePropagation();
      }
      tvFullscreen();          // TV 부터 (거기는 아무도 누를 수 없다)
      goFullNow();
      if(!tvFullscreenOn()) setTimeout(() => { try{ tvWin && tvWin.focus(); }catch(err){} }, 300);
    };
    document.addEventListener("click", go, true);
    document.addEventListener("keydown", go, true);
    // 시간이 지나면 안내를 거둔다. 리스너도 같이 떼야 한다 —
    // 남겨 두면 그 뒤의 클릭 한 번이 (소비돼) 아무 일도 없이 사라진다.
    setTimeout(() => {
      document.removeEventListener("click", go, true);
      document.removeEventListener("keydown", go, true);
      bar.remove();
    }, 15000);
  }

  function goFullNow(){
    const el = document.documentElement;
    if(document.fullscreenElement || !el.requestFullscreen) return;
    try{ const p = el.requestFullscreen({ navigationUI:"hide" }); if(p) p.catch(() => {}); }
    catch(e){}
  }

  // TV 창을 전체화면으로 만든다.
  // TV 창 스스로는 사용자 동작이 없어 requestFullscreen 이 거부된다.
  // 사용자 동작이 살아 있는 이쪽(노트북)에서 대신 걸어 준다 — 같은 출처라 된다.
  // 그래도 막히면 TV 에게 직접 시도하라고 알린다.
  function tvFullscreen(){
    if(!tvWin || tvWin.closed) return;
    try{
      const d = tvWin.document;
      if(d && !d.fullscreenElement && d.documentElement.requestFullscreen){
        const p = d.documentElement.requestFullscreen({ navigationUI:"hide" });
        if(p) p.catch(() => askTvFullscreen());
        return;
      }
    }catch(e){ /* 접근이 막히면 메시지로 부탁한다 */ }
    askTvFullscreen();
  }
  function askTvFullscreen(){
    if(TV_CH) TV_CH.postMessage({ cmd:"fullscreen" });
  }
  // TV 창이 전체화면인지 (읽을 수 없으면 됐다고 보고 더 조르지 않는다)
  function tvFullscreenOn(){
    if(!tvWin || tvWin.closed) return true;
    try{ return !!tvWin.document.fullscreenElement; }catch(e){ return true; }
  }

  async function toggleTv(){
    if(tvWin && !tvWin.closed){
      tvWin.close();                                     // 감시 타이머가 뒷정리한다
      if(document.fullscreenElement) document.exitFullscreen().catch(() => {});
      return;
    }

    // 전체화면을 '먼저' 요청한다.
    // window.open 이 사용자 동작을 써 버리므로 팝업을 먼저 열면 그 뒤의
    // requestFullscreen 은 거부된다. (실측 : 팝업 먼저 0/3, 전체화면 먼저 5/5)
    goFullNow();

    let feat = "width=1280,height=800";
    try{
      if(window.getScreenDetails){
        const d = await window.getScreenDetails();
        const other = d.screens.filter(s => s !== d.currentScreen);
        const t = other.find(s => !s.isPrimary) || other[0];
        if(t) feat = `left=${t.availLeft},top=${t.availTop},width=${t.availWidth},height=${t.availHeight}`;
      }
    }catch(e){ /* 권한을 거부하면 기본 크기로 연다 */ }

    tvWin = window.open(location.pathname + "?tv=1", "classroomTv",
                        feat + ",menubar=no,toolbar=no,location=no,status=no");
    if(!tvWin){
      toast("팝업이 막혀 있습니다. 주소창 오른쪽의 팝업 허용을 눌러 주세요.", 6000);
      return;
    }
    onTvOpened();
    syncTvBtn();
    try{ tvWin.focus(); }catch(e){}        // 키보드를 TV 로 → Enter 한 번이면 TV 가 전체화면
    // 이 화면은 위에서 이미 전체화면이 됐다. TV 쪽은 자기 사용자 동작이 없어
    // 막힐 수 있으니 곧바로 한 번 걸어 보고, 그래도 안 되면 다음 클릭을 기다린다.
    tvFullscreen();
    setTimeout(() => {
      const meOk = !!document.fullscreenElement;
      const tvOk = tvFullscreenOn();
      if(!meOk || !tvOk) armFullscreen(meOk);
    }, 500);
    clearInterval(tvWatch);
    tvWatch = setInterval(() => {
      if(tvWin && tvWin.closed){
        clearInterval(tvWatch); tvWin = null; onTvClosed(); syncTvBtn();
      }
    }, 700);
  }

  // 노트북 쪽에서 내용이 바뀌면 TV 화면에 알린다
  function tvPing(){ if(TV_CH && !TV) TV_CH.postMessage("changed"); }

  if(TV){
    document.body.classList.add("tv");
    // TV 창은 스스로 누른 적이 없어서 전체화면이 막힐 수 있다.
    // 열리자마자 · 잠시 뒤 · 첫 클릭 때까지 여러 번 시도한다.
    // 꽉 찼는가 — 코드로 켠 전체화면이든 F11(브라우저 전체화면)이든 화면을 채우면 된 것으로 본다.
    // (F11 상태에서 코드가 또 전체화면을 걸면 둘이 번갈아 켜지고 꺼져 여러 번 눌러야 했다)
    const isFull = () => !!document.fullscreenElement ||
      (innerWidth >= screen.width - 2 && innerHeight >= screen.height - 2);
    let tip = null;
    const hideTip = () => { if(tip){ tip.remove(); tip = null; } };
    const goFull = e => {
      // F11 은 브라우저가 알아서 한다 — 여기서 또 걸면 서로 뒤집는다. Esc 는 창 닫기다.
      if(e && e.type === "keydown" && (e.key === "F11" || e.key === "Escape")) return;
      if(isFull()){ hideTip(); return; }
      const el = document.documentElement;
      try{ const p = el.requestFullscreen({ navigationUI:"hide" }); if(p) p.then(hideTip, () => {}); }
      catch(err){}
    };
    // 이 창은 누른 적이 없어 자동 요청은 브라우저가 거의 막는다. 그래도 한 번은 해 본다.
    goFull();
    // 이 창에서의 첫 동작(Enter 같은 아무 키 · 클릭 한 번)으로 전체화면이 된다.
    ["keydown", "pointerdown"].forEach(ev => window.addEventListener(ev, goFull, true));
    document.addEventListener("fullscreenchange", () => { if(isFull()) hideTip(); });
    window.addEventListener("resize", () => { if(isFull()) hideTip(); });
    // 안내는 TV 한가운데 크게 — 전체화면이 될 때까지 둔다
    setTimeout(() => {
      if(isFull() || tip) return;
      tip = document.createElement("div");
      tip.style.cssText = "position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:80;" +
        "background:rgba(30,30,30,.92);color:#fff;font-size:22px;font-weight:600;" +
        "padding:18px 28px;border-radius:8px;text-align:center;line-height:1.5;pointer-events:none;";
      tip.textContent = "Enter 를 누르거나 화면을 한 번 누르면 전체화면이 됩니다";
      document.body.appendChild(tip);
    }, 600);
    document.addEventListener("keydown", e => { if(e.key === "Escape") window.close(); });
    if(TV_CH) TV_CH.onmessage = e => {
      const m = e.data;
      if(m && m.cmd === "close"){ window.close(); return; }
      if(m && m.cmd === "fullscreen"){ goFull(); return; }
      if(m && m.ask){ TV_CH.postMessage({ alive:1 }); return; }
      // 노트북이 보낸 지금 화면 — 확정 전 배치도 그대로 보여 준다
      if(m && m.cmd === "state"){
        if(m.page === "cleaning" && m.data){ liveAt = Date.now(); adopt(m.data); render(); }
        return;
      }
      // 파일은 '확정본' 이라, 노트북 화면을 받고 있는 동안엔 다시 읽지 않는다
      if(m === "changed" && SERVER && Date.now() - liveAt > 30000) loadServer();
    };
    // 살아 있다고 알려 준다 (다른 페이지의 'TV 끄기' 버튼이 이걸 본다)
    if(TV_CH) setInterval(() => TV_CH.postMessage({ alive:1 }), 1500);
    setInterval(() => { if(SERVER && Date.now() - liveAt > 30000) loadServer(); }, 20000);   // 놓친 변화 대비
  }else if(window.screen && "addEventListener" in window.screen){
    try{ screen.addEventListener("change", syncTvBtn); }catch(e){}
  }
  window.addEventListener("pagehide", () => { if(tvWin && !tvWin.closed) tvWin.close(); });

  if(!TV){
    setInterval(() => { if(dirty && tvWin && !tvWin.closed) tvSend(); }, 3000);
    syncTvBtn();
    setInterval(syncTvBtn, 2000);     // HDMI 를 꽂거나 빼면 버튼이 따라 나타나고 사라진다
  }

  // TV 를 켜면 노트북은 체크 페이지로 넘어간다
  function onTvOpened(){
    // 페이지를 넘기면 전체화면이 풀리므로 여기 그대로 둔다.
    // 체크는 위쪽 '청소 체크' 탭으로 옮겨 가시면 된다.
    toast("TV 에 청소 배치를 띄웠습니다.", 4000);
  }
  function onTvClosed(){}

  function printChecklist(){
    if(busy) return;
    buildChecklist();
    els.pageRule.textContent = "@page{size:A4 portrait;margin:5mm;}";
    document.body.classList.add("check-print");
    const done = () => {
      clearTimeout(guard);
      document.body.classList.remove("check-print");
      els.pageRule.textContent = "";
      window.removeEventListener("afterprint", done);
    };
    // afterprint 가 오지 않는 브라우저에서도 모드가 남지 않게 한다
    const guard = setTimeout(done, 60000);
    window.addEventListener("afterprint", done);
    setTimeout(() => window.print(), 60);
  }

  /* ── 배치를 그림으로 만들어 클립보드에 담기 ── */
  // 화면에 보이는 그대로를 SVG 안에 담아 캔버스로 옮긴다.
  // 글꼴이 시스템 글꼴(맑은 고딕·Noto Sans KR 등)이라 따로 넣지 않아도 그대로 나온다.
  const SHOT_PAD = 18, SHOT_GAP = 12, SHOT_SCALE = 2;

  async function makeShot(){
    const nodes = shotNodes();
    if(!nodes.length) throw new Error("담을 것이 없습니다");

    const rects = nodes.map(n => n.getBoundingClientRect());
    const w = Math.ceil(Math.max(...rects.map(r => r.width))) + SHOT_PAD * 2;
    const h = Math.ceil(rects.reduce((a, r) => a + r.height, 0)
                        + SHOT_GAP * (nodes.length - 1)) + SHOT_PAD * 2;

    const wrap = document.createElement("div");
    wrap.style.cssText =
      `width:${w}px;height:${h}px;box-sizing:border-box;padding:${SHOT_PAD}px;` +
      `display:flex;flex-direction:column;align-items:center;justify-content:flex-start;` +
      `gap:${SHOT_GAP}px;background:#fff;` +
      `font-family:${getComputedStyle(document.body).fontFamily};`;

    const st = document.createElement("style");
    st.textContent = [...document.querySelectorAll("style")].map(s => s.textContent).join("\n") +
      "\n*{animation:none!important;transition:none!important;box-shadow:none!important;}";
    wrap.append(st);

    nodes.forEach((n, i) => {
      const c = n.cloneNode(true);
      // 화면에서만 쓰는 것들은 그림에 넣지 않는다
      c.querySelectorAll(".legend,.warn,.toast,.mode-note,.roster-bar,.draft-tag,.setup-tip,[hidden]")
       .forEach(x => x.remove());
      c.style.flex = "none";
      c.style.margin = "0";
      c.style.width  = Math.ceil(rects[i].width) + "px";
      c.style.height = Math.ceil(rects[i].height) + "px";
      wrap.append(c);
    });

    const xml = new XMLSerializer().serializeToString(wrap);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}">` +
                `<foreignObject width="100%" height="100%">${xml}</foreignObject></svg>`;

    const img = new Image();
    await new Promise((res, rej) => {
      img.onload = res;
      img.onerror = () => rej(new Error("그림을 만들지 못했습니다"));
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    });

    const cv = document.createElement("canvas");
    cv.width = w * SHOT_SCALE; cv.height = h * SHOT_SCALE;
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.scale(SHOT_SCALE, SHOT_SCALE);
    ctx.drawImage(img, 0, 0);

    return new Promise((res, rej) =>
      cv.toBlob(b => b ? res(b) : rej(new Error("그림을 만들지 못했습니다")), "image/png"));
  }

  async function copyShot(){
    if(busy) return;
    let blob;
    try{
      blob = await makeShot();
    }catch(e){
      toast("그림을 만들지 못했습니다. 다시 시도해 주세요.", 4000);
      return;
    }
    try{
      if(!navigator.clipboard || !window.ClipboardItem) throw new Error("클립보드 없음");
      await navigator.clipboard.write([ new ClipboardItem({ "image/png": blob }) ]);
      toast("배치 그림을 복사했습니다. 붙여넣기(Ctrl+V) 하세요.", 4000);
    }catch(e){
      // 클립보드를 막아 둔 브라우저면 그림 파일로 내려 준다
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = SHOT_NAME();
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast("클립보드를 쓸 수 없어 그림 파일로 저장했습니다.", 5000);
    }
  }

  // 그림에 담을 것 : 역할 칩 + 구역표
  function shotNodes(){
    const list = [];
    const sp = els.cols.querySelector('.col[data-tier="special"]');
    if(els.leads.children.length) list.push(sp || els.leads);
    list.push(els.cols);
    return list;
  }
  const SHOT_NAME = () => {
    const h = C.history && C.history[0];
    const d = h ? new Date(h.at) : new Date();
    return `청소역할_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-` +
           `${String(d.getDate()).padStart(2,"0")}.png`;
  };

  els.printMenu.addEventListener("click", e => {
    const item = e.target.closest("button[data-print]");
    if(!item) return;
    toggleMenu(false);
    if(item.dataset.print === "check"){
      printChecklist();
    }else if(item.dataset.print === "copy"){
      copyShot();
    }else if(item.dataset.print === "pdf"){
      normalPrint();
      setTimeout(() => window.print(), 60);
    }else{ normalPrint(); window.print(); }
  });
  document.addEventListener("click", () => toggleMenu(false));

  els.fileChip.addEventListener("click", () => {
    if(SERVER) openSheet();
    else if(pendingHandle) reconnect();
    else if(fileHandle) openSheet();
    else if(FS_OK) linkNew();
    else openSheet();
  });
  els.fileNew.addEventListener("click", linkNew);
  els.fileOpen.addEventListener("click", linkOpen);
  els.fileExport.addEventListener("click", exportFile);
  els.fileImport.addEventListener("click", () => els.filePicker.click());

  els.svClose.addEventListener("click", backToSheet);

  document.addEventListener("keydown", e => {
    if(e.key === "Escape"){
      if(!els.stuView.hidden){ backToSheet(); return; }
      if(isOpen()){ closeSheet(); return; }
      if(setup){ setSetup(false); return; }
      toggleMenu(false);
    }
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if(TV) return;
    if(e.code === "Space" && !typing && !isOpen() && !setup && !editRec && els.stuView.hidden){
      e.preventDefault(); doDraw();
    }
  });

  window.addEventListener("beforeunload", e => {
    if(TV) return;
    if(editRec){ e.preventDefault(); e.returnValue = ""; return; }
    if(!dirty) return;
    e.preventDefault();                        // 확정 전에 닫으면 배정이 사라진다
    e.returnValue = "";
  });

  window.addEventListener("resize", fit);
  if(window.ResizeObserver) new ResizeObserver(fit).observe(els.cols);

  /* ── 페이지 전환 ───────────────────────────── */
  const app = document.querySelector(".app");
  app.addEventListener("animationend", e => {
    if(e.target !== app) return;            // 학생 칸 등 안쪽 애니메이션은 무시한다
    document.body.classList.remove("entering-right", "entering-left");
  });

  // 탭 순서 : 자리 배치 → 청소 역할 → 청소 체크.
  // 오른쪽 탭으로 갈수록 화면이 왼쪽으로 밀리도록 방향을 자동으로 정한다.
  // 웹(frontend)은 "/seating/…" 주소, 레거시 프로그램은 "cleaning.html" 을 연다.
  // 둘 다 http 로 열리므로 SERVER 로는 못 가른다 — 지금 주소 모양으로 가른다.
  const WEB = /\/seating(\/|$)/.test(location.pathname);
  const PAGE_URL = WEB ? ["/seating/", "/seating/cleaning/", "/seating/check/"]
                       : ["index.html", "cleaning.html", "check.html"];
  // "cleaning.html"(로컬 파일) · "/seating/cleaning/"(웹) 둘 다 알아본다
  const PAGE_MAP = { "":0, "seating":0, "index.html":0, "cleaning":1, "cleaning.html":1, "check":2, "check.html":2 };
  const pageIdx = u => {
    const f = String(u).replace(/\/+$/, "").split("/").pop().split("?")[0];
    const i = PAGE_MAP[f];
    return i == null ? 0 : i;
  };
  const HERE = pageIdx(location.pathname);

  window.addEventListener("beforeunload", e => {
    if(SERVER && (needsSave || window.classroomStorage?.pending)){
      e.preventDefault(); e.returnValue = "";
    }
  });
  let navigating = false;
  async function flushBeforeNavigation(){
    clearTimeout(saveTimer); saveTimer = null;
    if(SERVER){
      while(needsSave || window.classroomStorage?.pending){
        if(!await putServer()) return false;
      }
      return !window.classroomStorage?.blocked;
    }
    return fileHandle ? await writeFile() : true;
  }

  async function navTo(url){
    if(busy) return;
    if(dirty && !confirm("확정하지 않은 배정이 있습니다. 저장하지 않고 나갈까요?")) return;
    if(setup) setSetup(false);
    const dir = pageIdx(url) > HERE ? "left" : "right";
    if(navigating) return;
    navigating = true;
    if(!await flushBeforeNavigation()){
      navigating = false;
      toast("저장하지 못해 화면 이동을 멈췄습니다. 저장 상태를 확인해 주세요.");
      return;
    }
    sessionStorage.setItem("navdir", dir);
    document.body.classList.add(dir === "left" ? "leaving-left" : "leaving-right");
    setTimeout(() => { location.href = url; }, 235);
  }
  els.toSeating.addEventListener("click", () => {
    if(editRec){ toast("고치는 중입니다. ✓ 저장 또는 취소를 먼저 눌러 주세요."); return; }
    navTo(PAGE_URL[0]);
  });

  const navdir = sessionStorage.getItem("navdir");
  if(navdir){
    sessionStorage.removeItem("navdir");
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.body.classList.add(navdir === "right" ? "entering-left" : "entering-right");
      document.documentElement.classList.remove("nav-in");
    }));
  }else document.documentElement.classList.remove("nav-in");

  /* ── 시작 ──────────────────────────────────── */
  if(SERVER){                                   // start.bat 으로 켠 경우 : 연결 버튼이 필요 없다
    els.fsButtons.hidden = true;
    els.dlButtons.hidden = true;
    els.fileHint.textContent = "";
  }else if(!FS_OK){
    els.fsButtons.hidden = true;
    els.dlButtons.hidden = false;
    els.fileHint.textContent =
      "이 브라우저는 파일 자동 저장을 지원하지 않습니다. 내보내기로 저장 파일을 만들고, 다음에 불러오기로 여세요. (Chrome·Edge 권장)";
  }

  let cached = null;
  try{ cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); }catch(e){}
  adopt(cached);
  render();
  fileStatus();

  // 서버 모드에서는 살아 있다는 신호를 보낸다. 이 신호가 끊기면 프로그램이 스스로 종료된다.
  if(SERVER){
    const ping = () => fetch("api/ping", { cache:"no-store" }).catch(() => {});
    ping();
    setInterval(ping, 5000);
    document.addEventListener("visibilitychange", () => { if(!document.hidden) ping(); });
  }


  if(SERVER) loadServer();                      // 서버가 가진 data.json 이 기준
  else restoreHandle();
})();

/* role gate */
(async () => {
  try {
    const s = await apiRequest("auth/session/");
    const u = s && s.user;
    const op = u && (u.isSiteAdmin || u.is_site_admin);
    if (op) document.body.classList.remove("seat-view-only");
  } catch (e) {  }
})();

</script>
</body>
