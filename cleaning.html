<!DOCTYPE html>
<html lang="ko">
<head>
<script src="persistence.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">   <!-- favicon 요청(404) 방지 -->
<title>교실 청소 역할 뽑기</title>
<style>
  /* ────────────────────────────────────────────
     청소 역할 — 디자인 규칙 (세 페이지 공통)
     모서리 2/4/6px, 회색 한 계열 + 파랑 하나, 이모지 없음.
     칸(특별·쉬움·중간·어려움)은 끌어서 배치하고, 설정·인쇄는 오른쪽 패널.
     ──────────────────────────────────────────── */
  :root{
    --bg:#f5f5f5;
    --surface:#ffffff;
    --line:#e6e6e6;
    --line-2:#d9d9d9;
    --ink:#1e1e1e;
    --ink-2:#757575;
    --ink-3:#b3b3b3;
    --accent:#0d99ff;
    --accent-bg:#e8f4ff;
    --danger:#d93025;

    --r-sm:2px;   /* 입력 */
    --r-md:4px;   /* 버튼·학생칸 */
    --r-lg:6px;   /* 구역·패널 */
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",-apple-system,"Segoe UI",sans-serif;
    font-size:12px;line-height:1.45;-webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;}

  .app{height:100%;display:flex;flex-direction:column;}


  /* ── 상단 도구 막대 ── */
  .bar{
    flex:none;height:48px;display:flex;align-items:center;gap:10px;padding:0 12px;
    background:#ebebeb;border-bottom:1px solid #dcdcdc;
  }
  .tabs{display:flex;gap:1px;}
  .tabs button{
    border:none;background:transparent;color:var(--ink-2);
    font-size:14px;font-weight:500;padding:6px 12px;border-radius:var(--r-md);
  }
  .tabs button:hover{background:#e0e0e0;color:var(--ink);}
  .tabs button.on{background:var(--surface);color:var(--ink);font-weight:600;}
  .sep{width:1px;height:22px;background:var(--line);flex:none;}
  .save{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13px;}
  .save svg{opacity:.7;}
  .when{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13px;white-space:nowrap;}
  .when svg{opacity:.7;}
  .bar .right{margin-left:auto;display:flex;align-items:center;gap:4px;}
  .btn{
    display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;
    border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
    border-radius:var(--r-md);font-size:13px;font-weight:500;
  }
  .btn:hover{background:#f5f5f5;}
  .btn.icon{padding:0 9px;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .btn.primary:hover{background:#0b87e3;}
  .btn.quiet{border-color:transparent;color:var(--ink-2);}
  .btn.quiet:hover{background:#dedede;color:var(--ink);}
  /* 켜져 있는 상태 — 가리기, TV, 인쇄·설정 창, 오늘 */
  .btn.on,.btn.quiet.on{background:#dcdcdc;border-color:#c4c4c4;color:var(--ink);}
  .btn.on:hover,.btn.quiet.on:hover{background:#d3d3d3;}
  .btn svg{flex:none;}

  /* ── 요약 줄 ── */
  .meta{
    flex:none;height:36px;display:flex;align-items:center;gap:10px;padding:0 14px;
    background:#f2f2f2;border-bottom:1px solid var(--line);
    font-size:13px;color:var(--ink-2);
  }
  .meta .stats{display:flex;gap:15px;font-variant-numeric:tabular-nums;}
  .meta .stats i{font-style:normal;color:var(--ink-3);}

  /* ── 배치도 : 세 칸, 구역은 가로로 늘어나며 줄바꿈 (이전과 같은 방식) ── */
  /* 칸 배치는 중첩 분할이다. 가로 묶음 안에 세로 묶음을 넣을 수 있어서
     "왼쪽은 통으로, 오른쪽만 위아래로" 같은 배치도 만들어진다. */
  /* --k 는 1 로 고정. 화면에 맞춰 줄이는 대신, 폭을 줄이는 쪽을 제한한다. */
  /* 세로로 쌓는다 : [특별 칸] / 경계 / [난이도 칸들] — 특별은 난이도 위(또는 아래) 한 줄을 통으로 쓴다 */
  .cols{
    /* --k : 배치도 안의 크기를 한 번에 조절하는 배율 */
    --k:1.35;flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;
    background:var(--bg);overflow:hidden;
  }
  /* 이름은 sb- 로 시작한다 — .row / .col 은 설정 모달과 칸에서 이미 쓰고 있다 */
  .splitbox{display:flex;align-items:stretch;gap:0;min-width:0;min-height:0;}
  .splitbox.sb-row{flex-direction:row;}
  .splitbox.sb-col{flex-direction:column;}
  .col{
    background:var(--bg);display:flex;flex-direction:column;
    min-width:0;min-height:0;
    /* 가로는 절대 스크롤하지 않는다. 세로는 넘칠 때만 — 잘라내는 것보다 낫다.
       끌어서 크기를 줄일 때는 넘치기 직전에서 멈추므로 평소엔 보이지 않는다. */
    overflow-x:hidden;overflow-y:auto;
  }

  /* 칸 사이 경계 — 끌면 양옆(또는 위아래) 칸이 폭·높이를 주고받는다 */
  .split{position:relative;flex:none;touch-action:none;}
  .split.v{width:5px;cursor:col-resize;}
  .split.h{height:5px;cursor:row-resize;}
  .split.v::before{
    content:"";position:absolute;top:0;bottom:0;left:2px;width:1px;
    background:var(--line);transition:background .1s,left .1s,width .1s;
  }
  .split.h::before{
    content:"";position:absolute;left:0;right:0;top:2px;height:1px;
    background:var(--line);transition:background .1s,top .1s,height .1s;
  }
  .split.v:hover::before,.split.v.on::before{left:1px;width:3px;background:var(--accent);}
  .split.h:hover::before,.split.h.on::before{top:1px;height:3px;background:var(--accent);}

  /* 특별 칸을 끌 때 : board 위/아래 어디에 붙을지 */
  .cols.drop-top{box-shadow:inset 0 3px 0 var(--accent);}
  .cols.drop-bottom{box-shadow:inset 0 -3px 0 var(--accent);}
  .treebox{display:flex;min-width:0;min-height:0;}

  /* 놓을 자리 미리보기 — 어느 모서리에 붙일지 파란 선으로 */
  .col.drop{background:#f2f9ff;}
  .col.drop[data-side="left"]{box-shadow:inset 3px 0 0 var(--accent);}
  .col.drop[data-side="right"]{box-shadow:inset -3px 0 0 var(--accent);}
  .col.drop[data-side="top"]{box-shadow:inset 0 3px 0 var(--accent);}
  .col.drop[data-side="bottom"]{box-shadow:inset 0 -3px 0 var(--accent);}
  .col > header{
    position:sticky;top:0;z-index:1;height:calc(28px * var(--k));flex:none;
    display:flex;align-items:center;gap:calc(6px * var(--k));
    padding:calc(2px * var(--k)) calc(10px * var(--k)) 0;
    background:var(--bg);font-size:calc(13px * var(--k));font-weight:600;color:var(--ink);
    cursor:grab;user-select:none;border-radius:var(--r-md);
  }
  .col > header:hover{background:#ececec;}
  .col > header:active{cursor:grabbing;}
  .col > header i{font-style:normal;font-weight:400;font-size:calc(11px * var(--k));color:var(--ink-3);}
  /* 잡는 곳임을 알리는 점 여섯 개 — 평소엔 흐리게 */
  .col > header .grip{margin-left:auto;display:flex;color:var(--ink-3);opacity:0;transition:opacity .12s;}
  .col > header:hover .grip{opacity:1;}
  .col.dragging{opacity:.4;}
  .col.drop{outline:2px solid var(--accent);outline-offset:-2px;border-radius:var(--r-md);}

  /* 특별 칸은 역할이 넷뿐이라 가운데로 모은다 */
  .col[data-tier="special"] .areas{justify-content:center;}
  .areas{
    flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;
    gap:calc(5px * var(--k));padding:calc(5px * var(--k)) calc(6px * var(--k)) calc(6px * var(--k));
  }
  /* 구역은 남는 폭을 나눠 가지며, 좁아지면 다음 줄로 넘어간다 */
  .area{
    /* 늘어나지 않는다 — 내용만큼만 차지하고 남는 폭은 비운다.
       그래서 한 줄에 여러 구역이 나란히 들어가고 상자 안 여백이 생기지 않는다.
       min-content : 학생 칸이 들어갈 폭보다 좁아지지는 않는다. */
    flex:0 1 auto;min-width:min-content;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:calc(6px * var(--k)) calc(8px * var(--k)) calc(8px * var(--k));
  }
  /* 묶음은 갈라지면 안 되므로 줄어들지 않는다 */
  .group{
    flex:0 0 auto;min-width:min-content;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:calc(6px * var(--k)) calc(8px * var(--k)) calc(8px * var(--k));
  }
  .group > .group-head{
    display:flex;align-items:baseline;flex-wrap:nowrap;gap:calc(8px * var(--k));
    margin-bottom:calc(6px * var(--k));
  }
  .group-name{
    flex:none;white-space:nowrap;
    font-size:calc(14.5px * var(--k));font-weight:600;letter-spacing:-.01em;
  }
  /* 세부구역은 줄을 바꾸지 않는다 — 한 줄에 다 들어가는 폭이 곧 이 묶음의 최소 폭이다
     (책상 끌기라면 가로 6명이 그대로 길이 제한이 된다) */
  .group-body{display:flex;flex-wrap:nowrap;gap:calc(5px * var(--k));}
  .area.sub{
    background:#fafafa;border-color:#efefef;border-radius:var(--r-md);
    padding:calc(5px * var(--k)) calc(7px * var(--k)) calc(7px * var(--k));
  }
  /* 머리글 한 줄 : [이름] [해야 할 일] ...... [정원]
     셋 다 줄을 바꾸지 않으므로, 이 줄의 길이가 곧 구역 상자의 최소 가로 폭이 된다.
     이름이 길면 이름이, 해야 할 일이 길면 그 문장이 폭을 정한다. */
  .area-head{
    display:flex;align-items:baseline;flex-wrap:nowrap;
    gap:calc(8px * var(--k));margin-bottom:calc(5px * var(--k));
  }
  /* 해야 할 일(점검 기준) — 이름 아래 작은 글씨. 위 여백을 조금 당겨 이름에 붙인다 */
  /* 해야 할 일은 한 줄로 쓰되, 상자를 끝없이 넓히지는 않는다.
     한계 폭까지는 문장이 상자 폭을 정하고, 그보다 길면 두 줄로 접힌다.
     (접지 않으면 긴 문장 하나가 칸을 다 차지해 구역이 한 줄에 하나씩만 놓인다) */
  .todo{
    flex:0 1 auto;width:max-content;max-width:calc(300px * var(--k));
    white-space:normal;word-break:keep-all;
    font-size:calc(11.5px * var(--k));line-height:1.4;color:var(--ink-2);
  }
  .area.sub .todo{font-size:calc(11px * var(--k));max-width:calc(260px * var(--k));}
  /* 이름 옆에 자리가 없어 아래로 내려간 경우 — 이름에 붙도록 위 여백을 당긴다 */
  .area > .todo, .group > .todo{
    margin:calc(-2px * var(--k)) 0 calc(6px * var(--k));
    max-width:calc(330px * var(--k));
  }
  .area-name{
    flex:none;white-space:nowrap;
    font-size:calc(14.5px * var(--k));font-weight:600;letter-spacing:-.01em;
  }
  .area.sub .area-name{font-size:calc(12.5px * var(--k));font-weight:600;color:var(--ink-2);}
  .area-cap{
    flex:none;margin-left:auto;padding-left:calc(6px * var(--k));
    font-size:calc(11.5px * var(--k));font-weight:400;color:var(--ink-3);
    white-space:nowrap;font-variant-numeric:tabular-nums;
  }
  .tag{
    font-size:calc(10px * var(--k));font-weight:600;color:var(--ink-2);margin-left:calc(5px * var(--k));
    border:1px solid var(--line-2);border-radius:var(--r-sm);
    padding:0 calc(5px * var(--k));line-height:calc(16px * var(--k));
  }

  /* ── 학생 칸 : 이 화면의 본문이라 가장 크게 ── */
  .slots{display:flex;flex-wrap:nowrap;gap:calc(5px * var(--k));}
  /* 원본과 같이 이름 위 · 번호 아래. 칸 폭이 고르게 떨어져 줄이 맞는다. */
  .stu{
    flex:none;min-width:calc(80px * var(--k));
    display:inline-flex;flex-direction:column;align-items:center;gap:calc(1px * var(--k));
    padding:calc(4px * var(--k)) calc(8px * var(--k));line-height:1.18;
    border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--surface);
  }
  .area.sub .stu{background:var(--surface);}
  .stu:hover{border-color:var(--ink-3);}
  .stu b{
    font-size:calc(18px * var(--k));font-weight:500;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;
  }
  .stu em{
    display:flex;align-items:center;gap:calc(3px * var(--k));
    font-style:normal;color:var(--ink-3);font-size:calc(11px * var(--k));font-weight:400;
    font-variant-numeric:tabular-nums;
  }
  .stu{cursor:grab;user-select:none;}
  .stu:active{cursor:grabbing;}
  .stu.dragging{opacity:.35;}
  .stu.target{border-color:var(--ink);border-style:dashed;background:#f0f0f0;}
  /* 고정 : 색으로 칠하지 않고 테두리만 진하게. 자물쇠는 번호와 같은 회색. */
  .stu.lock{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);}
  /* 손으로 바꾼 자리 : 점선 + 바꿈 표시. 바뀐 순간에는 잠깐 도드라지게 */
  .stu.moved{border-style:dashed;border-color:var(--ink);}
  .stu.moved em::after{content:" ⇄";color:var(--ink-2);}
  .stu.flash{animation:flash .5s ease;}
  @keyframes flash{
    0%  {transform:scale(.94);background:#e8e8e8;}
    55% {transform:scale(1.05);background:#f2f2f2;}
    100%{transform:scale(1);background:var(--surface);}
  }

  /* ── 학생 기록 표 ── */
  .record{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg);}
  .rec-top{
    flex:none;height:48px;display:flex;align-items:center;gap:12px;padding:0 12px;
    background:#ebebeb;border-bottom:1px solid #dcdcdc;
  }
  .rec-top .who b{font-size:15px;font-weight:600;}
  .rec-top .who span{margin-left:8px;font-size:12.5px;color:var(--ink-2);}
  .rec-top .figs{margin-left:auto;display:flex;gap:18px;padding-right:6px;}
  .fig{display:flex;flex-direction:column;align-items:flex-end;}
  .fig b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;}
  .fig span{font-size:11.5px;color:var(--ink-3);}
  .rec-wrap{flex:1;min-height:0;overflow:auto;padding:10px 12px 12px;}
  table.rec{
    width:100%;border-collapse:collapse;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;
    table-layout:fixed;font-variant-numeric:tabular-nums;
  }
  .rec th,.rec td{border-right:1px solid #f0f0f0;border-bottom:1px solid #f0f0f0;padding:10px 12px;text-align:center;}
  .rec th:last-child,.rec td:last-child{border-right:none;}
  .rec tr:last-child td{border-bottom:none;}
  .rec thead th{background:#f2f2f2;font-size:13.5px;font-weight:600;border-bottom:1px solid var(--line-2);}
  .rec thead th small{display:block;font-size:11.5px;font-weight:400;color:var(--ink-3);}
  .rec thead th.now{background:#e2e2e2;}
  .rec th.lab{
    width:112px;text-align:left;background:#f2f2f2;font-size:13px;font-weight:500;color:var(--ink-2);
    border-right:1px solid var(--line);
  }
  .rec td{font-size:14.5px;}
  .rec td small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px;}
  .rec tr.key td{background:#f7f7f7;font-weight:600;}
  .rec td.dim{color:var(--ink-3);}
  .rec td.hard{font-weight:600;}

  /* ── 추가 설정 : 지금처럼 가운데 모달 ── */
  /* 설정·인쇄는 덮지 않고 오른쪽에 붙는다 — 배치도를 보면서 고친다 */
  .work{flex:1;min-height:0;display:flex;position:relative;}
  /* 배치도를 밀어내지 않고 그 위에 덧씌운다 */
  .side{
    position:absolute;right:0;top:0;bottom:0;width:420px;z-index:50;
    display:flex;flex-direction:column;
    background:var(--surface);border-left:1px solid #dcdcdc;
    box-shadow:-10px 0 30px rgba(0,0,0,.10);
  }
  .side > header{
    flex:none;height:44px;display:flex;align-items:center;padding:0 14px;
    background:var(--surface);border-bottom:1px solid var(--line);font-size:14px;font-weight:600;
  }
  .side > header .x{margin-left:auto;border:none;background:transparent;color:var(--ink-3);padding:3px;cursor:pointer;}
  .side > header .x:hover{color:var(--ink);}
  .side-body{flex:1;min-height:0;overflow-y:auto;}

  /* 인쇄 패널 */
  .pitems{display:flex;flex-direction:column;gap:6px;}
  .pitem{
    display:flex;align-items:center;width:100%;
    padding:13px 14px;text-align:left;
    border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--surface);
  }
  .pitem:hover{background:#f5f5f5;border-color:var(--ink-3);}
  .pitem b{font-size:13px;font-weight:600;}
  .pitem span{font-size:11.5px;color:var(--ink-3);}
  .sect{border-bottom:1px solid var(--line);padding:13px 14px;display:flex;flex-direction:column;gap:9px;}
  .sect:last-child{border-bottom:none;}
  .sect > h4{margin:0;font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--ink-3);}
  .row{display:flex;align-items:center;gap:9px;font-size:13px;}
  .row label{color:var(--ink-2);width:72px;flex:none;}
  .row input,.row select{
    flex:1;min-width:0;height:30px;padding:0 9px;font-family:inherit;font-size:13px;color:var(--ink);
    border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);
  }
  .row input:focus{outline:none;border-color:var(--accent);}
  /* 누적 점수표 — 전원을 세 줄로 */
  /* 누적 점수표 — 이름이 읽혀야 하므로 두 줄로 넓게 */
  .score{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px;
    max-height:236px;overflow-y:auto;
    border:1px solid var(--line);border-radius:var(--r-md);padding:8px 10px;
  }
  .score div{
    display:flex;align-items:center;gap:9px;padding:5px 7px;font-size:13.5px;
    border-radius:var(--r-sm);cursor:pointer;
  }
  .score div:hover{background:#f2f2f2;}
  .score div.top{background:#ececec;}
  .score div.me{box-shadow:inset 2px 0 0 var(--ink);}
  .score em{
    font-style:normal;flex:none;width:20px;text-align:right;
    color:var(--ink-3);font-size:11.5px;font-variant-numeric:tabular-nums;
  }
  .score span{
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-weight:500;letter-spacing:-.01em;
  }
  .score div.top span{font-weight:600;}
  .score b{
    margin-left:auto;flex:none;font-weight:600;font-size:12.5px;
    font-variant-numeric:tabular-nums;color:var(--ink-2);
  }

  /* 회차 목록 */
  .hist{
    display:flex;flex-direction:column;max-height:200px;overflow-y:auto;
    border:1px solid var(--line);border-radius:var(--r-md);
  }
  .hrow{
    display:flex;align-items:center;gap:10px;padding:8px 10px;font-size:12px;
    border-bottom:1px solid #f2f2f2;
  }
  .hrow:last-child{border-bottom:none;}
  .hrow:hover{background:#fafafa;}
  .hrow .when{flex:none;width:58px;}
  .hrow .when b{font-weight:600;display:block;}
  .hrow .when small{color:var(--ink-3);font-size:11px;}
  .hrow .mix{flex:1;min-width:0;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hrow .w{flex:none;color:var(--ink-3);font-size:11.5px;font-variant-numeric:tabular-nums;}
  .hrow .acts{flex:none;display:flex;gap:5px;}
  .hrow .btn{height:26px;padding:0 9px;font-size:11.5px;}
  .btn.danger{color:#b3261e;border-color:#e3b6b2;}
  .btn.danger:hover{background:#fdf6f5;}

  /* 점검 기준 · 외부청소 고르기 */
  .std{display:flex;flex-direction:column;gap:7px;}
  .std div{display:flex;gap:9px;font-size:12.5px;line-height:1.5;}
  .std b{flex:none;width:96px;font-weight:600;}
  .std span{color:var(--ink-2);word-break:keep-all;}
  .pick{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;}
  .pick label{display:flex;align-items:center;gap:7px;font-size:12.5px;}
  .pick input{width:14px;height:14px;}
  .row.btns{gap:7px;}
  .row.btns .btn{flex:1;justify-content:center;}
  .sheet .sum{
    display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:500;
    background:#fafafa;border:1px solid var(--line);border-radius:var(--r-md);padding:8px 11px;
  }
  .sheet .sum span:last-child{color:var(--ink-3);font-weight:400;}


  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,10px);z-index:80;
    background:var(--ink);color:#fff;font-size:13px;font-weight:500;
    padding:11px 18px;border-radius:var(--r-md);
    opacity:0;pointer-events:none;transition:opacity .16s ease,transform .16s ease;
  }
  .toast.on{opacity:1;transform:translate(-50%,0);}

  /* ── 구역 설정 모드 ───────────────────────── */
  body.setup .slots{display:none;}
  body.setup .area,body.setup .group{cursor:grab;}
  /* 해야 할 일 적기 : 설정 중에는 구역 이름 아래에 한 줄로 펴 놓는다 */
  body.setup .todo{display:none;}
  body.setup .todo.ed{
    display:block;width:auto;max-width:none;cursor:text;
    margin:calc(3px * var(--k)) 0 calc(7px * var(--k));
    padding:calc(3px * var(--k)) calc(7px * var(--k));
    border:1px dashed #c9c9c9;border-radius:var(--r-sm);
    background:var(--surface);color:var(--ink-2);outline:none;
  }
  body.setup .todo.ed:hover{border-color:#a8a8a8;}
  body.setup .todo.ed:focus{border-style:solid;border-color:var(--ink);}
  body.setup .todo.ed:empty::before{content:attr(data-ph);color:var(--ink-3);}
  body.setup .area.drop-mark{box-shadow:inset 3px 0 0 var(--ink);}
  .area-name[contenteditable]{
    padding:1px 4px;margin:-1px -4px;border-radius:var(--r-sm);outline:none;
  }
  .area-name[contenteditable]:hover{background:#f0f0f0;}
  .area-name[contenteditable]:focus{background:#fff;box-shadow:0 0 0 1px var(--ink);}
  .cap-in{
    width:calc(52px * var(--k));height:calc(24px * var(--k));flex:none;margin-left:auto;
    padding:0 calc(6px * var(--k));font-family:inherit;font-size:calc(11.5px * var(--k));
    color:var(--ink);text-align:right;
    border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);
  }
  .cap-in:focus{outline:none;border-color:var(--ink);}
  .area-x{
    flex:none;margin-left:calc(6px * var(--k));width:calc(20px * var(--k));height:calc(20px * var(--k));
    display:flex;align-items:center;justify-content:center;padding:0;
    border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);
    color:var(--ink-3);font-size:calc(12px * var(--k));line-height:1;
  }
  .area-x:hover{color:#b3261e;border-color:#e3b6b2;}
  .add-area{
    flex:0 0 auto;align-self:flex-start;
    padding:calc(8px * var(--k)) calc(12px * var(--k));
    border:1px dashed var(--line-2);border-radius:var(--r-lg);background:transparent;
    color:var(--ink-2);font-size:calc(12.5px * var(--k));font-weight:500;
  }
  .add-area:hover{border-color:var(--ink-3);color:var(--ink);background:#fafafa;}
  .setup-note{
    flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;
    background:#fff8e6;border-bottom:1px solid #f0e0b8;font-size:12.5px;color:#7a5a12;
  }

  .hidden{display:none !important;}

  /* ── 인쇄 ─────────────────────────────────── */
  @media print{
    @page{size:A4 landscape;margin:5mm;}
    *,*::before,*::after{box-shadow:none !important;transition:none !important;}
    html,body{height:auto;overflow:visible;background:#fff;}
    .app{height:auto;animation:none !important;}
    .bar,.meta,.side,.toast,.split{display:none !important;}
    .work{display:block;}
    /* 스크롤바가 종이에 찍히지 않도록 넘침을 푼다 */
    .cols,.treebox,.splitbox{height:auto !important;overflow:visible !important;}
    .col{overflow:visible !important;height:auto !important;flex:1 1 auto !important;}
    .area,.group{break-inside:avoid;}
    .stu{break-inside:avoid;}
  }



  /* ════════════════════════════════════════════
     시안에 없던 화면들 — 같은 토큰으로 맞춘다.
     (명단 · 개인 기록 · 체크 판 · 체크리스트 인쇄 · 설정 안의 목록들)
     ════════════════════════════════════════════ */
  [hidden]{display:none !important;}

  /* 저장 상태 — 시안의 .save 자리에 버튼으로 들어간다 */
  button.save{
    border:none;background:transparent;padding:0 4px;height:auto;
    font-size:13px;font-weight:400;color:var(--ink-2);gap:6px;max-width:250px;
  }
  button.save:hover{background:#dedede;color:var(--ink);}
  button.save .label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  button.save.attn{color:var(--danger);}
  .when .suffix{margin-left:5px;color:var(--ink-3);}

  /* 안내 줄 — 시안의 .setup-note 를 그대로 쓰되 안쪽을 조금 더 */
  .setup-note{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;}
  .setup-note b{font-weight:600;color:var(--ink);}
  .setup-note .tip{color:var(--ink-2);}
  .setup-note .adds{display:flex;gap:6px;}
  .setup-note .adds .btn{height:26px;padding:0 10px;font-size:12px;border-style:dashed;}
  .warn{
    display:none;flex:none;margin:0 10px;padding:8px 11px;
    font-size:12.5px;line-height:1.6;color:#8a4b12;
    background:#fdf6ec;border:1px solid #ecd9bd;border-radius:var(--r-md);
  }
  .warn.on{display:block;}
  .tv-head{flex:none;text-align:center;font-size:22px;font-weight:600;letter-spacing:-.02em;padding:6px 0;}

  /* 구역 설정 모드 */
  .sub-add{
    flex:none;height:calc(19px * var(--k));width:calc(19px * var(--k));padding:0;
    display:flex;align-items:center;justify-content:center;
    border:1px dashed var(--line-2);border-radius:var(--r-sm);background:var(--surface);
    color:var(--ink-2);font-size:calc(12px * var(--k));line-height:1;cursor:pointer;
  }
  .sub-add:hover{background:#f0f0f0;border-color:var(--ink-3);color:var(--ink);}
  .area-del{
    position:absolute;top:calc(-8px * var(--k));right:calc(-8px * var(--k));
    width:calc(18px * var(--k));height:calc(18px * var(--k));padding:0;
    display:none;align-items:center;justify-content:center;
    border:1px solid var(--line-2);border-radius:50%;background:var(--surface);
    color:var(--ink-2);font-size:calc(12px * var(--k));line-height:1;cursor:pointer;
  }
  body.setup .area{position:relative;cursor:grab;}
  body.setup .area:hover .area-del{display:flex;}
  .area-del:hover{background:#f7eceb;border-color:#e3c3c1;color:var(--danger);}
  body.setup .group{position:relative;}
  body.setup .area:hover{border-color:var(--ink-3);}
  body.setup .area.drag{opacity:.35;}
  body.setup .area.drop-before{box-shadow:inset 3px 0 0 var(--accent) !important;}
  body.setup .col.drop-in{background:#f2f9ff;}
  body.setup .stu,body.setup .empty-slot{pointer-events:none;}
  .group-name[contenteditable],.area-name[contenteditable]{
    cursor:text;border-radius:var(--r-sm);padding:0 2px;margin:0 -2px;
  }
  .group-name[contenteditable]:hover,.area-name[contenteditable]:hover{background:#f0f0f0;}
  .group-name[contenteditable]:focus,.area-name[contenteditable]:focus{
    outline:none;background:#fff;box-shadow:0 0 0 1px var(--ink);
  }
  .empty-slot{
    flex:none;min-width:calc(80px * var(--k));
    padding:calc(4px * var(--k)) calc(8px * var(--k));
    border:1px dashed var(--line-2);border-radius:var(--r-md);
    color:var(--ink-3);font-size:calc(12px * var(--k));text-align:center;line-height:1.18;
  }
  /* 실제 코드가 쓰는 이름들 — 시안의 .stu.lock 과 같은 모양 */
  .stu.locked{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);}
  .stu.is-lead{background:#fafafa;}
  .stu.pop{animation:flash .34s ease;}
  .stu.settle{animation:settle .44s cubic-bezier(.2,1.35,.35,1) var(--d,0ms) both;}
  @keyframes settle{
    0%  {transform:scale(.88) translateY(-8px);opacity:0;}
    58% {transform:scale(1.04) translateY(0);opacity:1;}
    100%{transform:none;opacity:1;}
  }
  body.spinning .stu b{opacity:.72;}
  body.spinning .stu em{opacity:.45;}
  .area.over{border-color:var(--accent);background:#f2f9ff;}
  .lead.badly{border-style:dashed;cursor:pointer;}
  .badly-x{
    border:none;background:transparent;color:var(--ink-3);cursor:pointer;
    font-size:calc(12px * var(--k));padding:0 4px;
  }
  .badly-x:hover{color:var(--danger);}

  /* ── 설정 안의 목록들 ── */
  .role-list,.survey-list,.roster-list,.hist-list,.score-list,.std-list,.chk-list{
    display:flex;flex-direction:column;
    border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;
  }
  .roster-list,.chk-list{max-height:210px;overflow-y:auto;}
  .hist-list{max-height:210px;overflow-y:auto;}
  .score-list{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px;
    max-height:236px;overflow-y:auto;padding:8px 10px;
  }
  .role-row,.survey-row,.hist-row,.std-item,.chk-row{
    display:flex;align-items:center;gap:9px;padding:8px 10px;font-size:12.5px;
    border-bottom:1px solid #f2f2f2;
  }
  .role-row:last-child,.survey-row:last-child,.hist-row:last-child,
  .std-item:last-child,.chk-row:last-child{border-bottom:none;}
  .role-row:hover,.hist-row:hover,.chk-row:hover{background:#fafafa;}
  .role-label{flex:none;width:92px;}
  .role-who{flex:1;min-width:0;}
  .role-x{
    flex:none;height:24px;padding:0 7px;font-size:12px;
    border:none;background:transparent;color:var(--ink-3);cursor:pointer;border-radius:var(--r-sm);
  }
  .role-x:hover{background:#f7eceb;color:var(--danger);}
  .survey-name{flex:1;min-width:0;}
  .survey-tier{flex:none;color:var(--ink-3);font-size:11.5px;}
  .survey-row input{width:60px;flex:none;height:26px;}
  .std-item{flex-direction:column;align-items:stretch;gap:5px;}
  .std-item > b{font-size:12.5px;font-weight:600;}
  .std-item textarea{
    width:100%;min-height:48px;padding:6px 8px;line-height:1.5;resize:vertical;
    border:1px solid var(--line-2);border-radius:var(--r-sm);
    font-family:inherit;font-size:12.5px;color:var(--ink);background:var(--surface);
  }
  .std-item textarea:focus{outline:none;border-color:var(--accent);}
  .roster-list label{
    display:flex;align-items:center;gap:9px;padding:7px 10px;font-size:12.5px;
    border-bottom:1px solid #f2f2f2;cursor:pointer;
  }
  .roster-list label:last-child{border-bottom:none;}
  .roster-list label:hover{background:#fafafa;}
  .roster-list input{width:14px;height:14px;flex:none;accent-color:var(--ink);}
  .roster-list .off,.roster-list label.off{color:var(--ink-3);}
  .hist-list .hist-row{flex-direction:column;align-items:stretch;gap:4px;}
  .hr-top{display:flex;align-items:baseline;gap:8px;}
  .hr-bot{display:flex;align-items:center;gap:5px;}
  .hist-row .no{flex:none;font-weight:600;}
  .hist-row .no small{margin-left:6px;font-weight:400;color:var(--ink-3);}
  .hist-row .when{flex:1;min-width:0;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hist-row .mix{flex:1;min-width:0;color:var(--ink-3);font-size:11.5px;}
  .hist-row .acts{display:flex;gap:5px;margin-left:auto;}
  .hist-row .btn{height:24px;padding:0 8px;font-size:11.5px;}
  .hist-note{margin:0;font-size:11.5px;color:var(--ink-3);line-height:1.6;}
  .score-list .s-row{
    display:flex;align-items:center;gap:9px;padding:5px 7px;font-size:13.5px;
    border-radius:var(--r-sm);cursor:pointer;
  }
  .score-list .s-row:hover{background:#f2f2f2;}
  .score-list .s-row.top{background:#ececec;}
  .score-list .s-row .no{
    flex:none;width:20px;text-align:right;color:var(--ink-3);font-size:11.5px;
    font-variant-numeric:tabular-nums;
  }
  .score-list .s-name{
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-weight:500;letter-spacing:-.01em;
  }
  .score-list .s-row.top .s-name{font-weight:600;}
  .score-list .s-no{
    margin-left:auto;flex:none;font-weight:600;font-size:12.5px;
    font-variant-numeric:tabular-nums;color:var(--ink-2);
  }
  .chk-row .ck-cnt{margin-left:auto;font-weight:600;color:#b3261e;}
  .file-state{
    font-size:12.5px;color:var(--ink);background:#fafafa;
    border:1px solid var(--line);border-radius:var(--r-md);padding:9px 11px;line-height:1.5;
    white-space:pre-line;word-break:break-all;
  }
  .empty{padding:16px;text-align:center;color:var(--ink-3);font-size:12px;}
  .sect .btn.danger{color:#b3261e;border-color:#e3b6b2;}

  /* ── 명단 (아래에서 올라오는 판) ── */
  .roster-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:45;max-height:46%;
    display:flex;flex-direction:column;
    background:var(--surface);border-top:1px solid #dcdcdc;
    box-shadow:0 -10px 30px rgba(0,0,0,.10);
  }
  .rb-head{
    flex:none;height:46px;display:flex;align-items:center;gap:12px;padding:0 12px;
    background:#ebebeb;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-2);
  }
  .rb-head b{font-size:14px;font-weight:600;color:var(--ink);}
  .rb-modes{display:flex;gap:2px;background:#f0f0f0;border-radius:var(--r-md);padding:2px;}
  .rb-modes button{
    height:28px;padding:0 11px;font-size:12px;border:none;background:transparent;
    color:var(--ink-2);border-radius:var(--r-sm);cursor:pointer;font-family:inherit;
  }
  .rb-modes button.on{background:var(--surface);color:var(--ink);font-weight:600;}
  .rb-tip{margin-left:auto;color:var(--ink-3);}
  .rb-list{
    flex:1;overflow-y:auto;padding:10px 14px 14px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:3px 12px;
  }
  .rb-item{
    display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 6px;
    border-radius:var(--r-md);cursor:pointer;
  }
  .rb-item:hover{background:#f2f2f2;}
  .rb-item input{width:14px;height:14px;flex:none;accent-color:var(--ink);}
  .rb-item .no{color:var(--ink-3);font-size:11.5px;width:22px;text-align:right;}
  .rb-item .placed{margin-left:auto;color:var(--ink-3);font-size:11px;}
  .rb-item.off{color:var(--ink-3);}
  .rb-item.out{opacity:.6;}

  /* ── 학생 한 명의 기록 : 시안의 .record 와 같은 모양 ── */
  .stu-view{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;}
  .sv-top{
    flex:none;height:48px;display:flex;align-items:center;gap:12px;padding:0 12px;
    background:#ebebeb;border-bottom:1px solid #dcdcdc;
  }
  .sv-who b,#svName{font-size:15px;font-weight:600;}
  .sv-who span,#svTag{margin-left:8px;font-size:12.5px;color:var(--ink-2);}
  .sv-figs{margin-left:auto;display:flex;gap:18px;padding-right:6px;}
  .sv-fig{display:flex;flex-direction:column;align-items:flex-end;}
  .sv-fig b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;}
  .sv-fig span{font-size:11.5px;color:var(--ink-3);}
  .sv-tab{height:28px;padding:0 11px;font-size:12.5px;}
  .sv-body{flex:1;min-height:0;overflow:auto;padding:10px 12px 12px;}
  .sv-body table{
    width:100%;border-collapse:collapse;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;
    table-layout:fixed;font-variant-numeric:tabular-nums;
  }
  .sv-body th,.sv-body td{
    border-right:1px solid #f0f0f0;border-bottom:1px solid #f0f0f0;
    padding:9px 11px;text-align:center;font-size:14.5px;
  }
  .sv-body th:last-child,.sv-body td:last-child{border-right:none;}
  .sv-body tr:last-child td{border-bottom:none;}
  .sv-body thead th{background:#f2f2f2;font-size:13.5px;font-weight:600;border-bottom:1px solid var(--line-2);}
  .sv-body thead th small{display:block;font-size:11.5px;font-weight:400;color:var(--ink-3);}
  .sv-body thead th.sv-now,.sv-last{background:#e2e2e2;}
  .sv-lab{
    width:112px;text-align:left !important;background:#f2f2f2;
    font-size:13px;font-weight:500;color:var(--ink-2);border-right:1px solid var(--line);
  }
  .sv-key td{background:#f7f7f7;font-weight:600;}
  .sv-area{font-size:13.5px;}
  .sv-body td small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px;}
  .sv-note{font-size:11.5px;color:var(--ink-3);line-height:1.6;margin:8px 2px 0;}
  body.editrec .sv-body td{cursor:pointer;}

  /* ── 체크 판 · 체크리스트 인쇄 ── */
  .check-panel{position:fixed;inset:0;z-index:55;background:var(--bg);display:flex;flex-direction:column;}
  .ck-head{
    flex:none;height:48px;display:flex;align-items:center;gap:12px;padding:0 12px;
    background:#ebebeb;border-bottom:1px solid #dcdcdc;font-size:13px;
  }
  .ck-head b{font-size:14px;font-weight:600;}
  .ck-clear{margin-left:auto;}
  .ck-scroll{flex:1;min-height:0;overflow:auto;padding:10px 12px 12px;}
  .ck-table{
    width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  }
  .ck-table th,.ck-table td{padding:6px 9px;vertical-align:middle;border-bottom:1px solid #eef1f4;font-size:14px;}
  .ck-table thead th{
    position:sticky;top:0;z-index:2;background:#f2f2f2;
    font-size:13.5px;font-weight:600;color:var(--ink-2);text-align:center;
    border-bottom:1px solid var(--line-2);
  }
  .ck-area{text-align:left;font-weight:600;}
  .ck-std{text-align:left;color:var(--ink-2);font-size:13px;line-height:1.4;word-break:keep-all;}
  .ck-nm{text-align:left;white-space:nowrap;font-size:15px;}
  .ck-day,.ck-box{text-align:center;width:6.4%;}
  .ck-box{cursor:pointer;user-select:none;font-size:18px;font-weight:700;color:#b3261e;border-left:1px solid #f1f3f5;}
  .ck-box:hover{background:#f5f5f5;}
  .ck-box.on{background:#f7efe9;}
  .ck-cnt{text-align:center;font-variant-numeric:tabular-nums;color:var(--ink-3);}
  .ck-first > td{border-top:1.5px solid #cfd5dd;}
  .check-sheet{display:none;}
  .cl-table{width:100%;border-collapse:collapse;table-layout:fixed;}
  .cl-table th,.cl-table td{border:1px solid #bbb;padding:3px 5px;font-size:9pt;}
  .cl-table thead th{background:#f2f2f2;font-weight:600;}
  .cl-tier,.cl-area,.cl-nm{text-align:left;}
  .cl-std{text-align:left;color:#333;}
  .cl-sub{color:#666;}
  .cl-day,.cl-box{width:5.2%;text-align:center;}
  .cl-foot{font-size:8.5pt;color:#666;margin-top:3mm;}

  /* ── TV 화면 ── */
  body.tv .bar,body.tv .meta,body.tv .setup-note,body.tv .warn,body.tv .side,
  body.tv .roster-bar,body.tv .toast{display:none !important;}
  body.tv .stu.locked,body.tv .stu.moved{
    border-color:var(--line-2) !important;border-style:solid !important;box-shadow:none !important;
  }
  body.tv .stu.moved em::after{content:"";}
  body.checking .cols{display:none !important;}

  /* ── 페이지 전환 ── */
  @keyframes pageOutLeft {from{transform:none;opacity:1} to{transform:translateX(-14px);opacity:0}}
  @keyframes pageOutRight{from{transform:none;opacity:1} to{transform:translateX(14px);opacity:0}}
  @keyframes pageInRight {from{transform:translateX(16px);opacity:0} to{transform:none;opacity:1}}
  @keyframes pageInLeft  {from{transform:translateX(-16px);opacity:0} to{transform:none;opacity:1}}
  body.leaving-left  .app{animation:pageOutLeft .15s ease-in forwards;}
  body.leaving-right .app{animation:pageOutRight .15s ease-in forwards;}
  body.entering-right .app{animation:pageInRight .22s cubic-bezier(.22,.61,.36,1);}
  body.entering-left  .app{animation:pageInLeft .22s cubic-bezier(.22,.61,.36,1);}
  @media (prefers-reduced-motion: reduce){
    body.leaving-left .app,body.leaving-right .app,
    body.entering-right .app,body.entering-left .app{animation:none;}
  }

  /* ── 인쇄 ── */
  @page{size:A4 landscape;margin:5mm;}
  @media print{
    *,*::before,*::after{animation:none !important;transition:none !important;box-shadow:none !important;}
    html,body{height:auto;overflow:visible;background:#fff;}
    .app{height:auto;}
    .bar,.meta,.setup-note,.warn,.side,.toast,.roster-bar,.check-panel,.stu-view,
    .lead.badly,.legend{display:none !important;}
    body.check-print .app{display:none !important;}
    body.check-print .check-sheet{display:block !important;}
    .cl-first > td{border-top:1.6px solid #222;}
    .cl-table tr{break-inside:avoid;}
    .cl-table thead{display:table-header-group;}
    .work{display:block;}
    .cols{--k:1 !important;overflow:visible;display:flex !important;background:#fff;}
    .split{display:none !important;}
    .splitbox{gap:5mm;align-items:flex-start;}
    .splitbox.sb-col{gap:4mm;}
    .col{overflow:visible;background:#fff;}
    .col > header{font-size:12pt;background:none;padding:0 0 3mm;}
    .col > header .grip{display:none;}
    .areas{padding:0;gap:4px;align-content:flex-start;}
    .area,.group{break-inside:avoid;background:#fff;border-color:#9aa3af;padding:3px 6px;}
    .area-name,.group-name{font-size:9.5pt;line-height:1.25;}
    .area-cap{font-size:7.5pt;}
    .todo{font-size:7.5pt;}
    .stu{break-inside:avoid;border-color:#9aa3af !important;border-style:solid !important;
         padding:2px 6px;min-width:0;}
    .stu b{font-size:10.5pt;}
    .stu em{font-size:7.5pt;}
    .stu.moved em::after{content:"";}
    .empty-slot{display:none;}
  }

  /* 칸 배치 : 특별은 제 높이만, 난이도 칸들이 남는 높이를 다 쓴다 */
  .cols > .col[data-tier="special"]{flex:none;}
  .cols > .treebox{flex:1;min-height:0;}
  .cols > .treebox > .splitbox{flex:1;}

  /* 남은 자잘한 것들 */
  .hist-row .btn.load{color:var(--ink);border-color:var(--line-2);}
  #printBtn.open{background:#dcdcdc;border-color:#c4c4c4;color:var(--ink);}
  .chip-btn{max-width:250px;}
  /* 보기 전용(운영자가 아닌 사람) : 고치는 버튼은 감춘다 */
  body.seat-view-only #draw,
  body.seat-view-only #resetAreas,
  body.seat-view-only #settings,
  body.seat-view-only #confirmBtn,
  body.seat-view-only #checkSheet{display:none !important;}

  /* ── 상단 버튼 : 지금 할 수 있는 것만 보인다 (시안처럼 청소 뽑기 · 확정만) ── */
  #doneSetup,#editAreas,#editSave,#editCancel{display:none;}
  body.setup #doneSetup{display:inline-flex;}
  body.setup .right > *:not(#doneSetup):not(#tvBtn){display:none !important;}
  body.editrec:not(.setup) #editAreas,
  body.editrec:not(.setup) #editSave,
  body.editrec:not(.setup) #editCancel{display:inline-flex;}
  body.editrec:not(.setup) .right > *:not(#editAreas):not(#editSave):not(#editCancel):not(#tvBtn){display:none !important;}
  body.editrec.setup #doneSetup{display:inline-flex;}
  #editCancel{color:var(--danger);border-color:#e3b6b2;}
  #editCancel:hover{background:#fdf6f5;}
  #confirmBtn:disabled{background:var(--surface);border-color:var(--line-2);color:var(--ink-3);opacity:1;}

  /* ── 설정 : 시안의 .row 와 같은 줄 모양으로 ── */
  .role-row{display:flex;align-items:center;gap:9px;padding:0;border:none;background:none;}
  .role-row:hover{background:none;}
  .role-label{
    flex:none;width:88px;height:30px;padding:0 9px;
    border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);
    font-family:inherit;font-size:13px;color:var(--ink-2);
  }
  .role-who{
    flex:1;min-width:0;height:30px;padding:0 9px;
    border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);
    font-family:inherit;font-size:13px;color:var(--ink);
  }
  .role-label:focus,.role-who:focus{outline:none;border-color:var(--accent);}
  .role-list{display:flex;flex-direction:column;gap:7px;border:none;overflow:visible;}

  /* 점검 기준 : 시안의 .std 줄에 고칠 수 있는 칸을 얹는다 */
  .std > div{align-items:flex-start;}
  .std b small{display:block;font-weight:400;font-size:11px;color:var(--ink-3);margin-top:2px;}
  .std textarea{
    flex:1;min-width:0;min-height:44px;padding:6px 8px;line-height:1.5;resize:vertical;
    border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);
    font-family:inherit;font-size:12.5px;color:var(--ink-2);
  }
  .std textarea:focus{outline:none;border-color:var(--accent);}

  /* 설문 · 명단 · 체크 횟수 목록 */
  .survey-list,.roster-list,.chk-list{
    display:flex;flex-direction:column;max-height:210px;overflow-y:auto;
    border:1px solid var(--line);border-radius:var(--r-md);
  }
  .survey-row,.chk-row,.roster-list label{
    display:flex;align-items:center;gap:9px;padding:7px 10px;font-size:12.5px;
    border-bottom:1px solid #f2f2f2;
  }
  .survey-row:last-child,.chk-row:last-child,.roster-list label:last-child{border-bottom:none;}
  .roster-list label{cursor:pointer;}
  .roster-list label:hover,.chk-row:hover{background:#fafafa;}
  .survey-row input{width:58px;flex:none;height:26px;padding:0 7px;
    border:1px solid var(--line-2);border-radius:var(--r-sm);font-family:inherit;font-size:12.5px;}
  .pick label.off{color:var(--ink-3);}

  /* 특별과 난이도 칸을 가르는 선 — 끌지는 않는다 */
  .split.fixed{cursor:default;}
  .split.fixed::before{background:var(--line-2);}
  .split.fixed:hover::before{background:var(--line-2);left:2px;width:1px;top:2px;height:1px;}
  .split.h.fixed::before{left:0;right:0;top:50%;margin-top:-.5px;height:1px;width:auto;}

  /* 이동해서 들어올 때 : 방향이 정해질 때까지 감춰 둔다 (안전장치 0.7초) */
  html.nav-in .app{opacity:0;animation:navReveal 0s .7s forwards;}
  @keyframes navReveal{to{opacity:1;}}

  /* 설정 창의 요약 줄 — 시안 규칙은 .sheet 안에서만 먹어서 여기선 맨글자로 나왔다 */
  .side .sum{
    display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:500;
    background:#fafafa;border:1px solid var(--line);border-radius:var(--r-md);padding:8px 11px;
  }
  .side .sum span:last-child{color:var(--ink-3);font-weight:400;}
  .side .sum:empty{display:none;}
  /* 인쇄 항목 : 이름 아래 설명 */
  .pitem{flex-direction:column;align-items:flex-start;gap:2px;height:auto;cursor:pointer;font-family:inherit;}

  /* TV : 잡는 점·끌기 커서는 선생님용이다 */
  body.tv .col > header{cursor:default;}
  body.tv .col > header:hover{background:var(--bg);}
  body.tv .col > header .grip{display:none;}
  body.tv .split{cursor:default;pointer-events:none;}

  /* 해야 할 일이 둘 이상 : 이름 옆에 두 줄로 쌓는다 (첫 줄이 이름과 같은 선에 놓인다) */
  .todo.stack{display:inline-flex;flex-direction:column;gap:calc(1px * var(--k));}
  .todo.stack > span{display:block;}

  /* 이름 아래로 내려간 해야 할 일 — 줄 단위(block)여야 위아래 여백이 먹는다.
     (span 이라 여백이 무시돼 이름과는 멀고 학생 칸엔 바짝 붙어 있었다) */
  .area > .todo, .group > .todo{display:block;}

  /* 정원 표시(1/1명 …)는 평소엔 숨긴다 — 빈자리는 '빈자리' 칸으로 이미 보인다.
     구역 설정 모드에서는 정원을 고쳐야 하므로 그대로 보인다. */
  body:not(.setup) .area-cap{display:none;}
</style>

<script>
/* muckwater port shim: repoint the old node server's relative api/* calls
   (GET/PUT api/data, api/ping) to the muckwater backend, with session + CSRF
   handled by site-common.api.js's csrfFetch. Transparent to the app code. */
(function(){
  var _orig = window.fetch.bind(window);
  window.fetch = function(url, opts){
    if (typeof url === "string" && url.indexOf("api/") === 0 &&
        typeof csrfFetch === "function" && typeof apiUrl === "function") {
      return csrfFetch(apiUrl(url.replace(/^api\//, "seating/")), opts || {});
    }
    return _orig(url, opts);
  };
})();

(function(){
  "use strict";

  const CACHE_KEY = "seating-chart-cache";   // 자리 배치와 같은 저장소
  const FILE_NAME   = "data.json";     // 브라우저에서 직접 열었을 때 쓰는 내보내기 파일
  const SERVER_NAME = "data.sqlite";   // start.bat 으로 켰을 때 서버가 쓰는 데이터베이스
  // start.bat 으로 켜면 http 로 열린다. 이때는 서버가 data.json 을 직접 읽고 써 준다.
  const SERVER = location.protocol === "http:" || location.protocol === "https:";
  const TIERS = { easy:"쉬움", mid:"중간", hard:"어려움" };
  const $ = id => document.getElementById(id);
  const els = {
    cols:$("cols"), leads:$("leads"), warn:$("warn"), count:$("count"), toast:$("toast"),
    legend:$("legend"), setupTip:$("setupTip"),
    placedDate:$("placedDate"), rosterBtn:$("rosterBtn"), outsideList:$("outsideList"), outsideSum:$("outsideSum"), rosterBar:$("rosterBar"), rbList:$("rbList"), rbCount:$("rbCount"),
    rbModes:$("rbModes"), rbTip:$("rbTip"),
    toSeating:$("toSeating"), settings:$("settings"), draw:$("draw"),
    confirmBtn:$("confirmBtn"), draftTag:$("draftTag"),
    setupStart:$("setupStart"), doneSetup:$("doneSetup"), resetAreas:$("resetAreas"),
    editNote:$("editNote"), editAreas:$("editAreas"), editSave:$("editSave"), editCancel:$("editCancel"),
    checkSheet:$("checkSheet"), pageRule:$("pageRule"),
    chkSum:$("chkSum"), chkList:$("chkList"), chkClear:$("chkClear"), chkOpen:$("chkOpen"),
    stdList:$("stdList"),
    toCheck:$("toCheck"),
    tvBtn:$("tvBtn"), tvHead:$("tvHead"),
    pendSum:$("pendSum"), pendEdit:$("pendEdit"), pendApply:$("pendApply"), pendClear:$("pendClear"),
    printBtn:$("printBtn"), printMenu:$("printMenu"),
    backdrop:$("backdrop"), close:$("close"),
    roleList:$("roleList"), roleAdd:$("roleAdd"), roleReset:$("roleReset"),
    surveySum:$("surveySum"), surveyList:$("surveyList"),
    surveySave:$("surveySave"), surveyClear:$("surveyClear"),
    nameList:$("nameList"), sum:$("sum"),
    rosterSum:$("rosterSum"), rosterList:$("rosterList"),
    rosterAll:$("rosterAll"), rosterNone:$("rosterNone"),
    histSum:$("histSum"), scoreList:$("scoreList"),
    stuView:$("stuView"), svName:$("svName"), svTag:$("svTag"), svFigs:$("svFigs"),
    svTab:$("svTab"), svNote:$("svNote"), svClose:$("svClose"),
    histList:$("histList"), histNote:$("histNote"), clearHist:$("clearHist"),
    fileChip:$("fileChip"), fileState:$("fileState"), fileHint:$("fileHint"),
    fsButtons:$("fsButtons"), dlButtons:$("dlButtons"),
    fileNew:$("fileNew"), fileOpen:$("fileOpen"),
    fileExport:$("fileExport"), fileImport:$("fileImport"), filePicker:$("filePicker")
  };

  // 3차 청소개혁(2026-09) 이후의 기본 구역
  const DEFAULT_AREAS = [
    ["칠판, 게시판 관리","easy",1],
    ["창틀 청소(운동장)","mid",1], ["창틀 청소(복도)","mid",1], ["멀티탭 관리","mid",1],
    ["책상 끌기(1분단)","mid",2], ["책상 끌기(2분단)","mid",2], ["책상 끌기(3분단)","mid",2],
    ["교실 쓸기(좌)","mid",1], ["교실 쓸기(우)","mid",1],
    ["교실 대걸레(월수금)","mid",2], ["교실 대걸레(화목)","mid",2],
    ["교사회의실","hard",2,true], ["과학실","hard",4,true], ["분리수거함 치우기","hard",2]
  ];

  // 점검 기준 기본값 — 구역 이름으로 알아본다 (선생님이 주신 체크리스트 그대로)
  const DEFAULT_CHECKS = [
    ["교사회의실",  ["해당 장소에 갔다 왔는가? (청소일만)"]],
    ["교실 쓸기",   ["바닥을 쓸었는가? (청소부장에게 쓰레받기 보여주기)", "바닥에 쓰레기가 없는가?"]],
    ["교실 쓸기(좌)", ["바닥을 쓸었는가? (청소부장에게 쓰레받기 보여주기)", "바닥에 쓰레기가 없는가?"]],
    ["교실 쓸기(우)", ["바닥을 쓸었는가? (청소부장에게 쓰레받기 보여주기)", "바닥에 쓰레기가 없는가?"]],
    ["멀티탭",      ["자리 이동 혹은 기타 일정 시 멀티탭을 치웠는가?", "책상을 끈 뒤 멀티탭이 치워져 있는가?"]],
    ["창틀 청소(운동장)", ["물건 전부 치웠는가? (학급 공용품 제외)", "창틀을 닦았는가?"]],
    ["창틀 청소(복도)",   ["창틀을 닦았는가?", "창틀에 먼지가 없는가?"]],
    ["칠판",        ["오늘 칠판 사용 후 지웠는가?"]],
    ["교탁",        ["오늘 칠판 사용 후 지웠는가?"]],
    ["게시판",      ["오늘 칠판 사용 후 지웠는가?"]],
    ["책상 끌기",   ["책상을 다섯 개 끌었는가?"]],
    ["교실 대걸레", ["바닥에 물기가 고루 묻었는가?"]],
    ["과학실",      ["해당 장소에 갔다 왔는가?"]],
    ["분리수거",    ["월 수 금에 나갔다 왔는가?"]]
  ];
  const DAYS = ["월", "화", "수", "목", "금"];
  const NL = String.fromCharCode(10);      // 점검 기준 줄바꿈

  const flatName = n => String(n || "").replace(/\s/g, "");
  function guessChecks(name){
    const n = flatName(name);
    for(const [key, list] of DEFAULT_CHECKS) if(n.includes(flatName(key))) return list.slice();
    return [];
  }
  // 역할에 따라 실제로 하는 요일 (이름·기준에서 알아본다)
  function daysOf(a){
    const n = flatName(a.name) + flatName((a.checks || []).join(""));
    if(/월수금/.test(n)) return [0, 2, 4];
    if(/화목/.test(n))   return [1, 3];
    return [0, 1, 2, 3, 4];
  }

  let full = {}, C = null, students = [], busy = false, setup = false;

  const clamp = (v, lo, hi, dflt) =>
    Number.isFinite(+v) ? Math.min(hi, Math.max(lo, Math.round(+v))) : dflt;
  const newId = () => "a" + Math.random().toString(36).slice(2, 9);
  const nameOf = no => (students.find(s => s.no === no) || {}).name || ("?" + no);

  const TIER_PT = { easy:1, mid:2, hard:3 };   // 쉬움 1 · 중간 2 · 어려움 3
  const DEFAULT_ROLES = ["총괄", "부총괄", "청소부장", "외부감독 청소부장"];
  const HARD_LOCK_SHARE = 0.5;                 // 어려움은 정원의 1/2 까지만 고정
  const HIST_MAX = 10;                          // 최근 10번 배정을 저장
  const AVOID_LAST = 2;                         // 최근 2번 맡았던 구역은 피한다

  function defaultCleaning(){
    return {
      title:"청소 역할",
      areas: DEFAULT_AREAS.map(([name, tier, cap, outside]) =>
               ({ id:newId(), name, tier, cap, outside: !!outside })),
      assign:{}, base:{}, locked:[],
      roles: DEFAULT_ROLES.map(label => ({ id:newId(), label, no:null })),
      chief:null, vice:null, captain:null,   // 옛 형식 — roles 에서 되비춰 준다
      survey:null,                     // survey   = 금요일 난이도 설문 집계
      history:[], excluded:[],         // excluded = 청소 명단에서 뺀 학생 번호
      badly:[],                        // badly    = 청소를 못해 외부청소로 보낼 학생 번호
      checks:{},                       // checks   = 종이로 세서 직접 넣은 횟수 (번호 → 횟수)
      marks:{},                        // marks    = 화면에서 찍은 체크 (번호 → 요일 목록)
      pending:null                     // pending  = 다음 배치에 쓰려고 미리 잡아 둔 구역
    };
  }

  /* ── 저장 ──────────────────────────────────── */
  // 배정은 '확정'을 눌러야 저장된다. 확정 전에는 화면만 바뀌고,
  // 파일에는 마지막으로 확정된 배정(committed)이 그대로 남는다.
  let dirty = false, dirtyKind = null, committed = null, pendingRollback = null;

  const grabAssign = () => JSON.parse(JSON.stringify({
    assign:C.assign, base:C.base, history:C.history
  }));

  // 지금 화면 그대로의 상태 (확정 전 배정 포함) — TV 로 보낼 때 쓴다
  function liveData(){ return Object.assign({}, full, { v:3, cleaning:C }); }
  var liveAt = 0;                            // (TV) 노트북 화면을 마지막으로 받은 시각
  function tvSend(){
    if(TV || !TV_CH) return;
    try{ TV_CH.postMessage({ cmd:"state", page:"cleaning", data:liveData() }); }catch(e){}
  }

  function snapshot(){
    full.cleaning = (dirty && committed) ? Object.assign({}, C, committed) : C;
    if(pendingRollback) full.cleaning = Object.assign({}, full.cleaning, pendingRollback);
    full.v = 3;
    full.savedAt = new Date().toISOString();
    return full;
  }

  const DIRTY_RANK = { edit:0, load:1, draw:2 };    // 뽑기 > 불러오기 > 손질
  function markDirty(kind){
    dirty = true;
    if(!dirtyKind || DIRTY_RANK[kind] >= DIRTY_RANK[dirtyKind]) dirtyKind = kind;
    updateConfirm();
    save();                                   // 배정 외의 변경(고정·역할 등)은 그대로 저장된다
  }

  // 지금 화면의 배정이 가장 최근 기록과 같은가
  function sameAsLatest(){
    const h = C.history[0];
    if(!h) return false;
    const cur = {};
    for(const a of C.areas) for(const no of (C.assign[a.id] || [])) cur[no] = a.id;
    const old = {};
    for(const no in h.rec) old[no] = h.rec[no].a;
    const k = Object.keys(cur);
    return k.length === Object.keys(old).length && k.every(n => cur[n] === old[n]);
  }

  // 기준 배치와 다른 자리(보라색)가 하나라도 있는가
  function hasMoved(){
    for(const a of C.areas)
      for(const no of (C.assign[a.id] || [])){
        const b = areaOf(C.base, no);
        if(b && b !== a.id) return true;
      }
    return false;
  }

  // 확정할 것이 있는가 : 바뀐 것이 있거나 · 아직 기록에 없거나 · 보라색이 남아 있거나
  function canCommit(){
    if(busy || setup) return false;
    const assigned = C.areas.reduce((n, a) => n + (C.assign[a.id] || []).length, 0);
    if(!assigned) return false;
    return dirty || !sameAsLatest() || hasMoved();
  }

  function updateConfirm(){
    els.confirmBtn.disabled = !canCommit();
    els.draftTag.hidden = !dirty;
    els.confirmBtn.title = dirty
      ? "이 배정을 확정하고 저장합니다"
      : "지금 화면의 배정을 기록으로 남깁니다";
  }

  function commit(){
    if(!canCommit()) return;
    if(dirtyKind === "draw" || dirtyKind === "load" || !C.history.length){
      pushHistory();                           // 새로 뽑았거나 불러왔거나 기록이 없다 → 새 기록
    }else if(!sameAsLatest()){
      if(dirty) syncHistoryHead();             // 방금 손질한 것 → 최근 기록을 갱신
      else pushHistory();                      // 저장돼 있던 다른 배정 → 새 기록
    }
    // 이미 같은 내용이 기록돼 있으면 기록은 그대로 두고 기준만 갱신한다 (보라색만 정리)

    // 확정한 배치가 새 기준이 된다 → 손으로 바꿨던 보라색 표시가 사라진다
    C.base = {};
    for(const id in C.assign) C.base[id] = C.assign[id].slice();

    committed = grabAssign();
    pendingRollback = null;
    dirty = false; dirtyKind = null;

    // 청소 못한 학생은 그날그날 적는 목록이라, 확정하면 비운다
    // (안 그러면 다음 날 뽑기에 어제 명단이 그대로 딸려 온다)
    const 보냈던인원 = C.badly.length
      + students.filter(st => chk(st.no) > 0).length;
    C.badly = [];
    // 체크는 아래에서 비워진다 → 이번 회차 기록에 몇 번이었는지를 먼저 옮겨 둔다.
    // 같은 배정을 두 번 확정하면 그 사이의 체크가 더해진다.
    const snap = chkSnapshot();
    if(C.history.length && Object.keys(snap).length){
      const had = C.history[0].chk || {};
      for(const k in snap) had[k] = (+had[k] || 0) + snap[k];
      C.history[0].chk = had;
      commitHistory();          // 확정본에도 같이 넣는다 (안 그러면 다음 저장 때 되돌아간다)
    }
    C.checks = {}; C.marks = {};

    render();                                  // 보라색 표시를 지우고 다시 그린다
    updateConfirm(); renderSum(); save();
    toast(보냈던인원
      ? `배정을 확정했습니다. 청소 못한 학생 ${보냈던인원}명 지정은 비웠습니다.`
      : "배정을 확정했습니다. 이 배치가 새 기준이 됩니다.", 보냈던인원 ? 4500 : undefined);
  }

  let saveTimer = null;
  function save(){
    if(TV) return;           // TV 화면은 보여 주기만 한다
    if(editRec) return;      // 고치는 중에는 파일에 쓰지 않는다 (✓ 저장을 눌러야 반영)
    if(busy) return;                    // 뽑기 중간 상태는 저장하지 않는다
    needsSave = true; editVersion++;
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(snapshot())); }catch(e){}
    tvSend();
    if(SERVER){
      clearTimeout(saveTimer);
      saveTimer = setTimeout(putServer, 350);
      return;
    }
    if(!fileHandle) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(writeFile, 350);
  }

  /* ── 서버 모드 : data.json 을 직접 읽고 쓴다 ── */
  // 저장에 실패해도 포기하지 않는다. 프로그램이 잠깐 꺼져 있었어도
  // 다시 켜지는 순간 밀린 내용이 저장되도록 계속 다시 시도한다.
  let retryTimer = null, saveFailed = false, needsSave = false, editVersion = 0;
  async function putServer(){
    if(editRec) return;               // 고치는 중에는 절대 쓰지 않는다
    clearTimeout(saveTimer); saveTimer = null;
    clearTimeout(retryTimer);
    const version = editVersion;
    try{
      const r = await fetch("api/data", {
        method:"PUT",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify(snapshot())
      });
      if(!r.ok) throw new Error(r.status);
      tvPing();                                  // TV 화면을 새로 고치게 한다
      if(saveFailed) toast("연결이 돌아와 밀린 내용을 저장했습니다.");
      saveFailed = false;
      if(version === editVersion) needsSave = false;
      setChip("linked", needsSave ? "저장 중" : "저장됨");
      return true;
    }catch(e){
      saveFailed = true;
      setChip("attn", "저장 안 됨");
      if(!window.classroomStorage?.blocked) retryTimer = setTimeout(putServer, 3000);
      return false;
    }
  }
  // 창으로 돌아오거나 네트워크가 살아나면 즉시 한 번 더
  document.addEventListener("visibilitychange", () => {
    if(!document.hidden && saveFailed) putServer();
  });
  window.addEventListener("online", () => { if(saveFailed) putServer(); });

  async function loadServer(){
    if(needsSave || window.classroomStorage?.pending || window.classroomStorage?.blocked) return;
    try{
      const r = await fetch("api/data", { cache:"no-store" });
      if(!r.ok) throw new Error(r.status);
      const d = await r.json();
      if(needsSave || window.classroomStorage?.pending) return;
      window.classroomStorage?.acceptRead(r);
      adopt(d && Object.keys(d).length ? d : null);
      render();
      setChip("linked", "자동 저장");
      els.fileState.textContent = SERVER_NAME + " · 자동 저장";
    }catch(e){
      setChip("attn", "읽기 실패");
    }
  }

  // 구역 하나를 안전한 모양으로 다듬는다 (기록 · 미리 설정에도 같이 쓴다)
  function cleanArea(a){
    a = a || {};
    const name = String(a.name || "구역");
    return {
      id: a.id || newId(),
      name,
      tier: TIERS[a.tier] ? a.tier : "easy",
      cap: clamp(a.cap, 1, 20, 1),
      outside: !!a.outside,
      // 저장된 기준이 없으면 이름으로 기본값을 찾아 준다
      checks: Array.isArray(a.checks) ? a.checks.map(t => String(t)) : guessChecks(name)
    };
  }
  const cloneAreas = list => (list || []).map(a => Object.assign({}, a));
  const capOf = list => (list || []).reduce((n, a) => n + a.cap, 0);

  function adopt(d){
    pendingRollback = null;
    full = (d && typeof d === "object") ? d : {};
    students = Array.isArray(full.students)
      ? full.students.filter(s => s && s.name).map(s => ({ no:+s.no || 0, name:String(s.name) }))
      : [];
    C = (full.cleaning && typeof full.cleaning === "object") ? full.cleaning : defaultCleaning();
    // 외부청소 표시가 한 번도 저장된 적 없으면 이름으로 알아본다 (한 번짜리)
    const hadOutside = Array.isArray(C.areas) && C.areas.some(a => a && "outside" in a);
    const looksOutside = n => /^(교사회의실|과학실)/.test(String(n || ""));
    C.areas = Array.isArray(C.areas) && C.areas.length
      ? C.areas.map(a => Object.assign(cleanArea(a),
          { outside: hadOutside ? !!a.outside : looksOutside(a.name) }))
      : defaultCleaning().areas;
    C.assign = C.assign && typeof C.assign === "object" ? C.assign : {};
    C.base   = C.base   && typeof C.base   === "object" ? C.base   : {};
    C.locked = Array.isArray(C.locked) ? C.locked.map(Number) : [];
    C.chief   = Number.isFinite(+C.chief)   ? +C.chief   : null;
    C.vice    = Number.isFinite(+C.vice)    ? +C.vice    : null;
    C.captain = Number.isFinite(+C.captain) ? +C.captain : null;
    normalizeRoles();
    C.excluded = Array.isArray(C.excluded) ? C.excluded.map(Number) : [];
    C.badly    = Array.isArray(C.badly)    ? C.badly.map(Number)    : [];
    C.checks = (C.checks && typeof C.checks === "object") ? C.checks : {};
    for(const k in C.checks){
      const n = clamp(C.checks[k], 0, 999, 0);
      if(n > 0) C.checks[k] = n; else delete C.checks[k];
    }
    // 체크 기록은 { "2026-08-24": { 번호: { 항목: [요일…] } } } 모양
    C.marks = (C.marks && typeof C.marks === "object") ? C.marks : {};
    for(const w in C.marks){
      const wk = C.marks[w];
      if(!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(w) || !wk || typeof wk !== "object"){ delete C.marks[w]; continue; }
      for(const k in wk){
        // 예전 모양([요일…])이면 첫 항목 것으로 본다
        const st = Array.isArray(wk[k]) ? { 0: wk[k] } : wk[k];
        if(!st || typeof st !== "object"){ delete wk[k]; continue; }
        for(const it in st){
          const list = Array.isArray(st[it])
            ? [...new Set(st[it].map(Number).filter(d => d >= 0 && d < DAYS.length))].sort((a,b) => a-b)
            : [];
          if(list.length) st[it] = list; else delete st[it];
        }
        if(Object.keys(st).length) wk[k] = st; else delete wk[k];
      }
      if(!Object.keys(wk).length) delete C.marks[w];
    }
    C.history = (Array.isArray(C.history) ? C.history : [])
      .filter(h => h && h.rec && typeof h.rec === "object")
      .map(h => {
        const e = Array.isArray(h.areas) && h.areas.length
          ? { at:h.at, rec:h.rec, areas:h.areas.map(cleanArea) }
          : { at:h.at, rec:h.rec };
        // 그 회차의 체크 횟수 — 이 기능이 생기기 전 기록에는 없다
        if(h.chk && typeof h.chk === "object"){
          const c = {};
          for(const k in h.chk){ const n = clamp(h.chk[k], 0, 999, 0); if(n > 0) c[k] = n; }
          if(Object.keys(c).length) e.chk = c;
        }
        return e;
      })
      .slice(0, HIST_MAX);
    C.pending = Array.isArray(C.pending) && C.pending.length ? C.pending.map(cleanArea) : null;
    prune();
    committed = grabAssign();                 // 파일에서 읽은 상태가 곧 '확정된' 상태
    dirty = false; dirtyKind = null;
    updateConfirm();
  }

  function prune(){
    const nos = new Set(students.map(s => s.no));
    const ids = new Set(C.areas.map(a => a.id));
    for(const key of Object.keys(C.assign)) if(!ids.has(key)) delete C.assign[key];
    for(const key of Object.keys(C.base))   if(!ids.has(key)) delete C.base[key];
    for(const a of C.areas){
      C.assign[a.id] = (C.assign[a.id] || []).filter(no => nos.has(no)).slice(0, a.cap);
      C.base[a.id]   = (C.base[a.id]   || []).filter(no => nos.has(no));
    }
    sortAll();
    // 명단은 구역과 무관하다. 구역을 지워도 그대로 두고, 학생 명단에서 빠진 사람만 정리한다.
    C.excluded = C.excluded.filter(no => nos.has(no));
    C.badly    = C.badly.filter(no => nos.has(no));
    for(const k in C.checks) if(!nos.has(+k)) delete C.checks[k];
    for(const w in C.marks) for(const k in C.marks[w]) if(!nos.has(+k)) delete C.marks[w][k];
    C.locked = C.locked.filter(no => nos.has(no));
    for(const r of C.roles) if(r.no != null && !nos.has(r.no)) r.no = null;
    mirrorLegacyLeads();
  }

  /* ── 저장 파일 (File System Access API) ────── */
  const FS_OK = typeof window.showSaveFilePicker === "function";
  let fileHandle = null, pendingHandle = null, writing = false, writeAgain = false;

  function idb(){
    return new Promise((res, rej) => {
      const r = indexedDB.open("seating-chart", 1);
      r.onupgradeneeded = () => { try{ r.result.createObjectStore("kv"); }catch(e){} };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function idbSet(k, v){
    const db = await idb();
    return new Promise((res, rej) => {
      const t = db.transaction("kv", "readwrite");
      t.objectStore("kv").put(v, k);
      t.oncomplete = res; t.onerror = () => rej(t.error);
    });
  }
  async function idbGet(k){
    const db = await idb();
    return new Promise((res, rej) => {
      const t = db.transaction("kv", "readonly");
      const q = t.objectStore("kv").get(k);
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
    });
  }

  function setChip(mode, text){
    els.fileChip.classList.toggle("linked", mode === "linked");
    els.fileChip.classList.toggle("attn", mode === "attn");
    els.fileChip.querySelector(".label").textContent = text;
  }
  function fileStatus(msg){
    if(SERVER){
      setChip("linked", msg || "자동 저장");
      els.fileState.textContent = SERVER_NAME + " · 자동 저장";
      return;
    }
    if(fileHandle){
      setChip("linked", msg ? fileHandle.name + " · " + msg : fileHandle.name);
      els.fileState.textContent = `연결됨 — ${fileHandle.name}`;
    }else if(pendingHandle){
      setChip("attn", "연결 필요");
      els.fileState.textContent = `${pendingHandle.name} — 다시 연결 필요`;
    }else{
      setChip("", "저장 파일 연결");
      els.fileState.textContent = "연결 안 됨 · 이 브라우저에만 임시 저장";
    }
  }

  let fileWriteQueue = Promise.resolve();
  function writeFile(){
    const job = fileWriteQueue.then(writeFileNow);
    fileWriteQueue = job.catch(() => {});
    return job;
  }
  async function writeFileNow(){
    if(editRec) return;               // 고치는 중에는 절대 쓰지 않는다
    if(!fileHandle) return true;
    if(writing){ writeAgain = true; return false; }
    writing = true;
    try{
      const w = await fileHandle.createWritable();
      await w.write(JSON.stringify(snapshot(), null, 2));
      await w.close();
      fileStatus("저장됨");
      return true;
    }catch(e){
      fileStatus("저장 실패");
      toast("저장 파일에 쓸 수 없습니다. 파일을 다시 연결해 주세요.");
      return false;
    }finally{
      writing = false;
      if(writeAgain){ writeAgain = false; writeFile(); }
    }
  }

  async function readFile(handle){
    const f = await handle.getFile();
    const txt = (await f.text()).trim();
    if(!txt) return false;
    adopt(JSON.parse(txt));
    render();
    return true;
  }

  async function linkNew(){
    try{
      const h = await window.showSaveFilePicker({
        suggestedName: FILE_NAME,
        types:[{ description:"자리배치 저장 파일", accept:{ "application/json":[".json"] } }]
      });
      fileHandle = h; pendingHandle = null;
      await idbSet("handle", h);
      await writeFile();
      toast("이제 " + h.name + " 에 자동으로 저장됩니다.");
    }catch(e){ if(e && e.name !== "AbortError") toast("저장 파일을 만들지 못했습니다."); }
  }

  async function linkOpen(){
    try{
      const [h] = await window.showOpenFilePicker({
        types:[{ description:"자리배치 저장 파일", accept:{ "application/json":[".json"] } }]
      });
      if((await h.requestPermission({ mode:"readwrite" })) !== "granted"){
        toast("파일 쓰기 권한이 필요합니다."); return;
      }
      fileHandle = h; pendingHandle = null;
      await idbSet("handle", h);
      const ok = await readFile(h);
      if(!ok) await writeFile();
      fileStatus("저장됨");
      toast(h.name + " 을(를) 불러왔습니다.");
    }catch(e){
      if(e && e.name === "AbortError") return;
      toast("파일을 읽지 못했습니다. 형식을 확인해 주세요.");
    }
  }

  async function reconnect(){
    if(!pendingHandle) return;
    try{
      if((await pendingHandle.requestPermission({ mode:"readwrite" })) !== "granted"){
        toast("파일 접근을 허용해야 자동 저장됩니다."); return;
      }
      fileHandle = pendingHandle; pendingHandle = null;
      await readFile(fileHandle);
      fileStatus("저장됨");
      toast(fileHandle.name + " 에 다시 연결되었습니다.");
    }catch(e){
      pendingHandle = null; fileStatus();
      toast("파일에 다시 연결하지 못했습니다. ‘저장 파일 열기’로 선택해 주세요.");
    }
  }

  async function restoreHandle(){
    if(!FS_OK) return;
    let h = null;
    try{ h = await idbGet("handle"); }catch(e){}
    if(!h) return;
    try{
      const p = await h.queryPermission({ mode:"readwrite" });
      if(p === "granted"){ fileHandle = h; await readFile(h); fileStatus("저장됨"); }
      else { pendingHandle = h; fileStatus(); }
    }catch(e){ fileStatus(); }
  }

  function exportFile(){
    const blob = new Blob([JSON.stringify(snapshot(), null, 2)], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = FILE_NAME;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  els.filePicker.addEventListener("change", () => {
    const f = els.filePicker.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{ adopt(JSON.parse(r.result)); render(); save(); toast(f.name + " 을(를) 불러왔습니다."); }
      catch(e){ toast("파일을 읽지 못했습니다. 형식을 확인해 주세요."); }
    };
    r.readAsText(f);
    els.filePicker.value = "";
  });

  /* ── 배정 ──────────────────────────────────── */
  const leadNos = () => C.roles.map(r => r.no).filter(v => v != null);

  // 옛 저장본(roles 가 없던 시절)을 새 형식으로 옮기고, 형태를 다듬는다.
  function normalizeRoles(){
    if(!Array.isArray(C.roles) || !C.roles.length){
      const legacy = [["총괄", C.chief], ["부총괄", C.vice], ["청소부장", C.captain]];
      C.roles = legacy.map(([label, no]) => ({ id:newId(), label, no }));
    }
    const seen = new Set();
    C.roles = C.roles
      .filter(r => r && typeof r === "object")
      .map(r => ({
        id: r.id || newId(),
        label: String(r.label == null ? "" : r.label).trim().slice(0, 20) || "역할",
        no: Number.isFinite(+r.no) ? +r.no : null
      }))
      .filter(r => {                       // 한 사람이 여러 역할을 갖지 않게
        if(r.no == null) return true;
        if(seen.has(r.no)){ r.no = null; return true; }
        seen.add(r.no); return true;
      })
      .slice(0, 8);
    mirrorLegacyLeads();
  }
  // check.html 등 옛 화면이 읽는 chief/vice/captain 를 앞 세 역할로 맞춰 둔다.
  function mirrorLegacyLeads(){
    C.chief   = (C.roles[0] || {}).no ?? null;
    C.vice    = (C.roles[1] || {}).no ?? null;
    C.captain = (C.roles[2] || {}).no ?? null;
  }
  const totalCap = () => C.areas.reduce((n, a) => n + a.cap, 0);

  // 청소 명단 : 전체 학생에서 '제외'한 사람과 역할 3명을 뺀 나머지
  const rosterNos = () => students.map(s => s.no)
    .filter(no => !C.excluded.includes(no) && !leadNos().includes(no));
  const poolNos = () => rosterNos();

  // 최근일수록 크게 반영하는 가중치 : 가장 최근 ×1.0 → 10번 전 ×0.1
  const weightAt = i => (HIST_MAX - i) / HIST_MAX;

  // 기록에 박제된 난이도 대신 '지금의 난이도' 를 쓴다.
  // 난이도를 바꾸면 지난 기록의 점수도 함께 바뀐다 (소급 적용).
  function tierOfRec(r){
    if(!r) return null;
    const now = C.areas.find(a => a.id === r.a);
    return now ? now.tier : r.t;        // 없어진 구역은 그때 난이도를 그대로 쓴다
  }

  // 저장된 기록으로 누적 점수를 낸다 (쉬움1·중간2·어려움3 × 최근 가중치)
  function scores(){
    const m = {};
    for(const s of students) m[s.no] = 0;
    C.history.forEach((h, i) => {
      const w = weightAt(i);
      for(const no in h.rec) if(m[no] != null) m[no] += (TIER_PT[tierOfRec(h.rec[no])] || 0) * w;
    });
    return m;
  }
  // 화면에서 찍은 체크 (모든 주 · 모든 점검 항목을 합친다)
  const marked = no => Object.keys(C.marks).reduce((n, w) => {
    const st = (C.marks[w] || {})[no] || {};
    return n + Object.keys(st).reduce((m, it) => m + (st[it] || []).length, 0);
  }, 0);
  const chk = no => marked(no) + (+(C.checks[no] || 0));   // 합쳐서 이게 '체크 횟수'

  // 누적 점수가 같을 때 : 최근에 어려운 걸 한 학생을 앞(쉬운 자리)에 둔다.
  // 최근 회차부터 한 칸씩 비교해서 먼저 갈리는 쪽으로 정한다.
  function recentCmp(x, y){
    for(let i = 0; i < C.history.length; i++){
      const rec = C.history[i].rec;
      const a = TIER_PT[tierOfRec(rec[x])] || 0;
      const b = TIER_PT[tierOfRec(rec[y])] || 0;
      if(a !== b) return b - a;                     // 어려운 걸 한 쪽이 앞
    }
    return 0;                                       // 정말 같으면 무작위(앞에서 섞어 둔 순서)
  }

  // 배정 순서 : 점수 높은 순 → 동점이면 최근 난이도로 → 그래도 같으면 무작위
  function orderForSlots(list, pt){
    return shuffled(list).sort((x, y) => (pt[y] - pt[x]) || recentCmp(x, y));
  }

  // 최근 몇 회 동안 맡았던 구역
  function recentAreas(n){
    const m = {};
    for(const h of C.history.slice(0, n))
      for(const no in h.rec) (m[no] || (m[no] = new Set())).add(h.rec[no].a);
    return m;
  }

  function areaOf(map, no){
    for(const id in map) if((map[id] || []).includes(no)) return id;
    return null;
  }

  // 구역 안 학생은 항상 번호순. 칸 안에서의 순서는 손으로 바꾸지 않는다.
  function sortAll(){
    for(const id in C.assign) C.assign[id].sort((a, b) => a - b);
  }
  function shuffled(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  // 고정된 학생을 자기 구역에 남기고, 남은 자리 목록과 남은 학생을 돌려준다
  function keepLocked(){
    const pool = poolNos();
    const lockSet = new Set(C.locked);
    const next = {}, used = new Set();
    for(const a of C.areas){
      next[a.id] = [];
      for(const no of (C.assign[a.id] || [])){
        if(lockSet.has(no) && pool.includes(no) && next[a.id].length < a.cap){
          next[a.id].push(no); used.add(no);
        }
      }
    }
    return { next, rest: pool.filter(no => !used.has(no)) };
  }

  // 뽑기 연출용 : 그냥 무작위
  function assignOnce(){
    const { next, rest } = keepLocked();
    const bag = shuffled(rest);
    let i = 0;
    for(const a of C.areas){
      while(next[a.id].length < a.cap && i < bag.length) next[a.id].push(bag[i++]);
    }
    C.assign = next;
    sortAll();
  }

  // 외부청소로 지정된 구역 — 어려운 쪽이 먼저다 (과학실 → 교사회의실)
  const TIER_RANK = { hard:0, mid:1, easy:2 };
  function outsideAreas(){
    return C.areas.filter(a => a.outside)
                  .sort((x, y) => TIER_RANK[x.tier] - TIER_RANK[y.tier]);
  }

  // 청소를 못한 학생을 외부청소 자리에 먼저 앉힌다.
  // 자리보다 많으면 누적 점수 높은 사람부터 자리 수만큼만, 적으면 어려운 구역부터 채운다.
  // 남는 자리는 그대로 두어 뒤의 일반 배정이 채운다.
  let sentOutside = 0;                              // 직전 뽑기에서 외부청소로 보낸 인원
  function placeBadly(next, rest, pt, fixed){
    sentOutside = 0;
    const areas = outsideAreas();
    const 후보있음 = C.badly.length || rest.some(no => chk(no) > 0);
    if(!areas.length || !후보있음) return rest;

    const slots = [];
    for(const a of areas)
      for(let i = next[a.id].length; i < a.cap; i++) slots.push(a.id);
    if(!slots.length) return rest;

    // 외부청소 후보 : 손으로 지정한 학생 + 체크 횟수가 있는 학생
    const mark = new Set(C.badly);
    const picked = shuffled(rest.filter(no => mark.has(no) || chk(no) > 0))
      .sort((x, y) => (chk(y) - chk(x))         // 체크를 많이 받은 순
                   || (pt[y] - pt[x])           // 다음은 누적 점수 높은 순
                   || recentCmp(x, y))          // 그래도 같으면 최근 난이도로
      .slice(0, slots.length);

    picked.forEach((no, i) => { next[slots[i]].push(no); fixed.add(no); });
    sentOutside = picked.length;
    const used = new Set(picked);
    return rest.filter(no => !used.has(no));
  }

  // 실제 결과 : 누적 점수가 높은 학생일수록 쉬운 구역, 최근 2번 구역은 회피
  function assignFair(){
    const { next, rest: pool } = keepLocked();
    const pt = scores();
    const recent = recentAreas(AVOID_LAST);
    const fixed = new Set();                        // 외부청소로 못박은 학생 (뒤에서 안 건드린다)
    const rest = placeBadly(next, pool, pt, fixed);

    // 자리 목록 : 난이도 쉬움 → 어려움, 같은 난이도 안에서는 무작위
    const slots = [];
    for(const tier of ["easy", "mid", "hard"]){
      for(const a of shuffled(C.areas.filter(x => x.tier === tier))){
        for(let i = next[a.id].length; i < a.cap; i++) slots.push(a.id);
      }
    }
    // 학생 : 누적 점수 높은 순 → 동점이면 최근에 어려운 걸 한 쪽이 먼저(쉬운 자리)
    const order = orderForSlots(rest, pt);

    const taken = new Array(slots.length).fill(false);
    let unavoidable = 0;
    for(const no of order){
      const avoid = recent[no] || new Set();
      let idx = slots.findIndex((id, i) => !taken[i] && !avoid.has(id));
      if(idx < 0){                                   // 피할 자리가 없으면 그냥 배정
        idx = slots.findIndex((id, i) => !taken[i]);
        if(idx >= 0) unavoidable++;
      }
      if(idx < 0) break;                             // 남은 자리 없음
      taken[idx] = true;
      next[slots[idx]].push(no);
    }
    C.assign = next;
    // 남은 위반은 같은 난이도끼리 맞바꿔 정리한다 (난이도가 같아 점수 배분은 그대로)
    const left = repairRecent(next, recent, unavoidable, fixed);
    sortAll();
    return left;
  }

  function repairRecent(next, recent, unavoidable, fixed){
    const lockSet = new Set(C.locked);
    const flat = [];
    for(const a of C.areas)
      (next[a.id] || []).forEach((no, i) => {
        if(!lockSet.has(no) && !fixed.has(no)) flat.push({ id:a.id, t:a.tier, i, no });
      });
    const hit = (no, id) => !!(recent[no] && recent[no].has(id));

    for(const x of flat){
      if(!hit(x.no, x.id)) continue;
      const y = flat.find(z => z.t === x.t && z.id !== x.id && !hit(z.no, x.id) && !hit(x.no, z.id));
      if(!y) continue;
      next[x.id][x.i] = y.no;
      next[y.id][y.i] = x.no;
      const t = x.no; x.no = y.no; y.no = t;
      if(unavoidable > 0) unavoidable--;
    }
    return flat.filter(z => hit(z.no, z.id)).length;
  }

  // 확정하는 순간의 체크 횟수 (번호 → 횟수). 확정하면 체크는 0으로 돌아가므로,
  // 그 회차에 몇 번 지적됐는지는 여기서 기록에 박아 두어야 나중에 볼 수 있다.
  function chkSnapshot(){
    const m = {};
    for(const s of students){ const n = chk(s.no); if(n > 0) m[s.no] = n; }
    return m;
  }

  // 이번 배정을 기록에 남긴다 (최신이 앞, 최대 10개)
  function pushHistory(){
    const rec = {};
    for(const a of C.areas)
      for(const no of (C.assign[a.id] || [])) rec[no] = { a:a.id, t:a.tier };
    C.history.unshift({ at:new Date().toISOString(), rec, areas:cloneAreas(C.areas) });
    C.history = C.history.slice(0, HIST_MAX);
  }

  // 손으로 자리를 바꾸면 가장 최근 기록도 실제 배정에 맞춘다
  function syncHistoryHead(){
    if(!C.history.length) return;
    const rec = {};
    for(const a of C.areas)
      for(const no of (C.assign[a.id] || [])) rec[no] = { a:a.id, t:a.tier };
    C.history[0].rec = rec;
    C.history[0].areas = cloneAreas(C.areas);
  }

  /* ── 과거 기록 고치기 · 다음 구역 미리 설정 ── */
  // 살아 있는 배치는 잠시 치워 두고, 고칠 대상을 화면에 올려서 평소처럼 손보게 한다.
  let editRec = null;      // null | {kind:"past", i} | {kind:"next"}
  let stash = null;        // 편집 전의 살아 있는 상태

  let recDropped = 0;                    // 기록을 열 때 자리를 못 찾은 인원
  function assignFromRec(rec, areas){
    const nos = new Set(students.map(s => s.no));
    const next = {};
    for(const a of areas) next[a.id] = [];
    recDropped = 0;
    for(const key in rec){
      const no = +key, id = rec[key] && rec[key].a;
      if(!nos.has(no)){ recDropped++; continue; }        // 명단에서 빠진 학생
      const a = next[id] ? areas.find(x => x.id === id) : null;
      if(!a || next[id].length >= a.cap){ recDropped++; continue; }   // 없어진 구역·줄어든 정원
      next[id].push(no);
    }
    return next;
  }

  function openEdit(kind, i){
    if(busy || editRec) return;
    if(setup) setSetup(false);

    clearTimeout(saveTimer);          // 예약된 저장이 편집 중에 터지면 살아 있는 배치를 덮어쓴다
    clearTimeout(retryTimer);
    stash = {
      areas: cloneAreas(C.areas),
      assign: JSON.parse(JSON.stringify(C.assign)),
      base: JSON.parse(JSON.stringify(C.base)),
      locked: C.locked.slice(),
      dirty, dirtyKind                                // 고치는 동안의 변경이 새지 않게
    };

    let 안내 = "";
    if(kind === "past"){
      const h = C.history[i];
      const 스냅샷있음 = !!(h.areas && h.areas.length);
      // 이 기능이 생기기 전에 확정한 기록에는 그때 구역이 없다 → 지금 구역으로 연다
      C.areas = cloneAreas(스냅샷있음 ? h.areas : C.areas);
      C.assign = assignFromRec(h.rec, C.areas);
      if(!스냅샷있음)
        안내 = "이 기록에는 그때의 구역 설정이 없어 지금 구역으로 열었습니다. " +
               "저장하면 지금 보이는 구역이 이 기록의 구역으로 남습니다.";
      if(recDropped)
        안내 += (안내 ? " " : "") + `${recDropped}명은 구역이 없어지거나 정원이 줄어 빠졌습니다.`;
    }else{
      C.areas = cloneAreas(C.pending && C.pending.length ? C.pending : C.areas);
      C.assign = {};
      for(const a of C.areas) C.assign[a.id] = [];      // 구역만 잡는 자리라 사람은 비운다
    }
    C.base = JSON.parse(JSON.stringify(C.assign));      // 보라색 표시가 뜨지 않게
    C.locked = [];

    editRec = { kind, i };
    document.body.classList.add("editrec");
    closeSheet();
    showEditNote();
    render();
    if(kind === "next") setSetup(true);                 // 구역만 잡는 모드라 바로 설정으로
    els.rosterBar.hidden = true;
    if(안내) toast(안내, 7000);
  }

  function showEditNote(){
    if(!editRec){ els.editNote.hidden = true; return; }
    els.editNote.hidden = false;
    if(editRec.kind === "next"){
      els.editNote.innerHTML =
        "<b>다음 배치용 구역</b> 을 잡는 중입니다 — 저장하면 다음 <b>청소 뽑기</b> 때 이 구역으로 바뀝니다";
    }else{
      const d = new Date(C.history[editRec.i].at);
      const 몇 = editRec.i === 0 ? "직전" : `${editRec.i}회 전`;
      els.editNote.innerHTML =
        `<b>${몇} 기록(${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()})</b> 을 고치는 중입니다 — ` +
        "사람은 끌어서, 구역은 <b>구역 고치기</b> 로 바꿉니다";
    }
  }

  function closeEdit(keep){
    if(!editRec) return;
    const was = editRec;
    if(setup) setSetup(false);

    if(keep){
      if(was.kind === "past"){
        const rec = {};
        for(const a of C.areas)
          for(const no of (C.assign[a.id] || [])) rec[no] = { a:a.id, t:a.tier };
        const 체크기록 = C.history[was.i].chk;        // 체크 횟수는 배정과 무관하게 남긴다
        C.history[was.i] = { at:C.history[was.i].at, rec, areas:cloneAreas(C.areas) };
        if(체크기록) C.history[was.i].chk = 체크기록;
        commitHistory();
      }else{
        C.pending = cloneAreas(C.areas);
      }
    }

    C.areas  = stash.areas;
    C.assign = stash.assign;
    C.base   = stash.base;
    C.locked = stash.locked;
    dirty = stash.dirty; dirtyKind = stash.dirtyKind;
    stash = null; editRec = null;

    document.body.classList.remove("editrec");
    els.editNote.hidden = true;
    prune();
    render(); renderSum(); save();

    if(!keep){ toast("고치기를 취소했습니다."); return; }
    toast(was.kind === "next"
      ? `다음 배치용 구역을 저장했습니다 (${C.pending.length}곳 · 정원 ${capOf(C.pending)}명). 청소 뽑기 때 적용됩니다.`
      : "기록을 고쳤습니다. 누적 점수도 함께 바뀝니다.", 5000);
  }

  // 미리 잡아 둔 구역을 실제로 적용한다
  function applyPending(){
    if(!C.pending || !C.pending.length) return false;
    if(!pendingRollback) pendingRollback = JSON.parse(JSON.stringify({
      areas:C.areas, pending:C.pending, locked:C.locked
    }));
    dirty = true;
    C.areas = C.pending;
    C.pending = null;
    C.assign = {}; C.base = {};
    for(const a of C.areas){ C.assign[a.id] = []; C.base[a.id] = []; }
    C.locked = [];                                   // 구역이 바뀌었으니 고정도 푼다
    return true;
  }

  function doDraw(){
    if(busy || setup) return;
    if(!students.length){ toast("먼저 자리 배치 페이지에서 학생 이름을 입력해 주세요."); return; }
    if(!C.areas.length){ toast("청소 구역을 먼저 추가해 주세요."); return; }

    // 명단 인원과 자리 수가 정확히 맞을 때만 뽑는다
    // (미리 잡아 둔 구역이 있으면 그쪽 정원으로 따진다)
    const n = rosterNos().length, cap = C.pending ? capOf(C.pending) : totalCap();
    if(n !== cap){
      toast(`청소 명단 ${n}명과 정원 합계 ${cap}명이 맞지 않습니다. ` +
            `추가 설정에서 명단이나 구역 정원을 맞춰 주세요.`, 5500);
      return;
    }

    if(C.badly.length && !(C.pending || C.areas).some(a => a.outside)){
      toast("외부청소 구역이 없습니다. 설정 모드에서 구역의 ‘외부’ 를 켜 주세요.", 5000);
      return;
    }

    if(applyPending()){
      render();
      toast(`미리 잡아 둔 구역을 적용했습니다 (${C.areas.length}곳 · 정원 ${totalCap()}명).`, 4000);
    }
    busy = true;
    els.draw.disabled = true;
    document.body.classList.add("spinning");

    // 처음엔 빠르게, 갈수록 느리게 — 돌아가던 룰렛이 멈추는 느낌
    const start = performance.now(), DURATION = 2600;
    (function tick(){
