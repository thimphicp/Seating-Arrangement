      const p = Math.min(1, (performance.now() - start) / DURATION);
      assignOnce(); render();

      if(p >= 1){
        const forced = assignFair();
        C.base = {};
        for(const id in C.assign) C.base[id] = C.assign[id].slice();
        busy = false;
        els.draw.disabled = false;
        document.body.classList.remove("spinning");
        render();
        settleStudents();                      // 쉬움 → 어려움 순으로 착지
        markDirty("draw");                     // 기록·저장은 '확정'을 눌러야 이뤄진다
        if(forced) toast(`${forced}명은 자리가 모자라 최근에 했던 구역에 다시 배정됐습니다.`, 4500);
        else if(sentOutside) toast(`청소 못한 학생 ${sentOutside}명을 외부청소로 보냈습니다.`, 4000);
        return;
      }
      setTimeout(tick, 30 + 300 * Math.pow(p, 3));
    })();
  }

  // 화면에 놓인 순서(쉬움 → 중간 → 어려움)대로 한 칸씩 내려앉힌다
  function settleStudents(){
    const list = [...document.querySelectorAll(".stu")];
    const step = list.length > 24 ? 28 : 36;
    list.forEach((el, k) => {
      el.classList.remove("pop", "settle");
      void el.offsetWidth;
      el.style.setProperty("--d", (k * step) + "ms");
      el.classList.add("settle");
    });
  }

  /* ── 그리기 ────────────────────────────────── */
  function render(){
    // 특별(총괄들) : 구역 칸과 같은 모양 — 이름 + 정원, 그 아래 학생 칸
    els.leads.replaceChildren(...C.roles.map(({ label, no }) => {
      const d = document.createElement("div");
      d.className = "area lead" + (no == null ? " none" : "");
      const head = document.createElement("div");
      head.className = "area-head";
      const nm = document.createElement("span");
      nm.className = "area-name"; nm.textContent = label;
      const cp = document.createElement("span");
      cp.className = "area-cap"; cp.textContent = (no == null ? 0 : 1) + "/1명";
      head.append(nm, cp);
      const slots = document.createElement("div");
      slots.className = "slots";
      if(no == null){
        const e = document.createElement("div");
        e.className = "empty-slot"; e.textContent = "미지정";
        slots.append(e);
      }else{
        const st = document.createElement("div");
        st.className = "stu is-lead";
        const a = document.createElement("b");
        a.textContent = nameOf(no);
        const b2 = document.createElement("em");
        b2.textContent = no + "번";
        st.append(a, b2);
        slots.append(st);
      }
      d.append(head, slots);
      return d;
    }));
    const lh = els.leads.parentElement.querySelector("header i");
    if(lh) lh.textContent = C.roles.filter(r => r.no != null).length + "명";

    // 청소 못한 학생을 지정해 두면 화면에 남겨 둔다 (다음 날 그대로 쓰이는 일이 없게)
    if(C.badly.length){
      const d = document.createElement("div");
      d.className = "area lead badly";
      const b = document.createElement("span"); b.className = "area-name"; b.textContent = "청소 못함";
      const sp = document.createElement("span"); sp.className = "todo";
      const names = C.badly.slice().sort((x, y) => x - y).map(no => `${no}번 ${nameOf(no)}`);
      sp.textContent = names.length > 3 ? `${names.slice(0, 3).join(" · ")} 외 ${names.length - 3}명`
                                        : names.join(" · ");
      const x = document.createElement("button");
      x.className = "badly-x"; x.textContent = "×"; x.title = "지정 지우기";
      x.addEventListener("click", e => { e.stopPropagation(); clearBadly(); });
      d.title = "눌러서 명단에서 고치기";
      d.addEventListener("click", () => openRoster("bad"));
      d.append(b, sp, x);
      els.leads.append(d);
    }

    const lockSet = new Set(C.locked);
    for(const tier of Object.keys(TIERS)){
      const col = els.cols.querySelector(`.col[data-tier="${tier}"]`);
      const box = col.querySelector(".areas");
      const list = C.areas.filter(a => a.tier === tier);
      col.querySelector("header i").textContent =
        list.length ? `${list.length}곳 · 정원 ${list.reduce((n,a)=>n+a.cap,0)}명` : "비어 있음";
      box.replaceChildren(...groupAreas(list).map(g =>
        g.items.length > 1 ? groupEl(g, lockSet) : areaEl(g.items[0].a, lockSet, null)));
    }

    const assigned = C.areas.reduce((n,a) => n + (C.assign[a.id] || []).length, 0);
    const cap = totalCap(), roster = rosterNos().length;
    // 현황 줄 — 숫자는 흐리게 (시안과 같은 모양)
    els.count.replaceChildren(...[
      ["학생", students.length], ["청소 명단", roster], ["구역", C.areas.length],
      ["정원", cap], ["배정", assigned],
    ].map(([lab, n]) => {
      const s = document.createElement("span");
      s.append(lab + " ");
      const i = document.createElement("i"); i.textContent = n;
      s.append(i);
      return s;
    }));

    if(!students.length){
      showWarn("학생 명단이 없습니다. ‘← 자리 배치’ 페이지에서 이름을 먼저 입력해 주세요.");
    }else if(roster !== cap){
      showWarn(`청소 명단 ${roster}명 · 정원 합계 ${cap}명 — ` +
               `수가 같아야 청소 뽑기를 할 수 있습니다. (추가 설정에서 조정)`);
    }else{
      showWarn("");
    }
    renderRosterBar();
    updateConfirm();
    showPlacedDate();
    showTvHead();
    fit();
  }

  // 상단바에 "언제 배치했는지" — 마지막으로 확정한 날짜
  // TV 화면 맨 위 : 언제 정한 배치인지
  function showTvHead(){
    if(!TV){ els.tvHead.hidden = true; return; }
    els.tvHead.hidden = false;
    const h = C.history && C.history[0];
    const d = h ? new Date(h.at) : null;
    els.tvHead.replaceChildren();
    const b = document.createElement("span");
    b.textContent = "청소 구역";
    els.tvHead.append(b);
    if(d && !isNaN(d)){
      const sm = document.createElement("small");
      sm.textContent = `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 확정`;
      els.tvHead.append(sm);
    }
  }

  function showPlacedDate(){
    const h = C.history && C.history[0];
    const d = h ? new Date(h.at) : null;
    if(!d || isNaN(d)){ els.placedDate.textContent = ""; return; }
    els.placedDate.innerHTML =
      `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일<span class="suffix">확정</span>`;
  }

  function showWarn(msg){
    els.warn.textContent = msg;
    els.warn.classList.toggle("on", !!msg);
  }

  // "분단별 쓸기(1분단)" → { base:"분단별 쓸기", sub:"1분단" }
  function splitName(name){
    const m = String(name).match(/^(.*\S)\s*\(([^()]*)\)\s*$/);
    return m ? { base:m[1].trim(), sub:m[2].trim() } : { base:name, sub:null };
  }

  // 이름 앞부분이 같고 괄호만 다른 구역끼리 묶는다 (같은 역할 · 다른 장소)
  function groupAreas(list){
    const groups = [], byBase = new Map();
    for(const a of list){
      const { base, sub } = splitName(a.name);
      const key = sub ? "b:" + base : "s:" + a.id;
      let g = byBase.get(key);
      if(!g){ g = { base, items:[] }; byBase.set(key, g); groups.push(g); }
      g.items.push({ a, sub });
    }
    return groups;
  }

  function groupEl(g, lockSet){
    const wrap = document.createElement("div");
    wrap.className = "group";
    const top = document.createElement("div");
    top.className = "group-head";
    const head = document.createElement("span");
    head.className = "group-name";
    head.textContent = g.base;
    top.append(head);
    const gTodo = todoEl(g.items[0].a);       // 묶음은 역할이 같으니 기준도 한 번만

    if(setup){
      head.setAttribute("contenteditable", "plaintext-only");
      head.spellcheck = false;
      head.title = "역할 이름 수정 (묶인 구역 전체에 적용)";
      noDrag(head);
      head.addEventListener("input", () => {
        g.base = head.textContent.trim() || "구역";
        for(const it of g.items) it.a.name = `${g.base}(${it.sub})`;
        save();
      });

      const add = document.createElement("button");
      add.className = "sub-add";
      add.textContent = "＋";
      add.title = "이 역할에 세부구역 추가";
      noDrag(add);
      add.addEventListener("click", e => { e.stopPropagation(); addSub(g); });
      top.append(add);
    }

    const body = document.createElement("div");
    body.className = "group-body";
    // g 를 그대로 넘긴다. 역할 이름을 고치면 g.base 가 바뀌므로 값 복사는 낡은 값이 된다.
    body.append(...g.items.map(it => areaEl(it.a, lockSet, { g, sub:it.sub })));

    wrap.append(top);
    if(gTodo) top.append(gTodo);          // 자리가 없으면 placeTodos 가 아래로 내린다
    wrap.append(body);
    return wrap;
  }

  // 묶음에 세부구역 하나 더 (1분단·2분단… 이면 다음 번호를 붙여 준다)
  function addSub(g){
    const last = g.items[g.items.length - 1];
    const m = (last.sub || "").match(/^(\d+)(.*)$/);
    const sub = m ? (parseInt(m[1], 10) + 1) + m[2] : "새 자리";
    const idx = C.areas.indexOf(last.a);
    C.areas.splice(idx + 1, 0, { id:newId(), name:`${g.base}(${sub})`, tier:last.a.tier, cap:1 });
    render(); save();
    focusName(sub);
  }

  // 방금 만든 칸의 이름에 커서를 놓는다
  function focusName(text){
    const el = [...els.cols.querySelectorAll(".area-name[contenteditable]")]
      .find(n => n.textContent === text);
    if(!el) return;
    el.focus();
    const r = document.createRange(); r.selectNodeContents(el);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  }

  // 구역이 해야 할 일 (점검 기준) 을 한 줄로 — 설정 모드에서는 방해되지 않게 숨긴다
  function todoEl(a){
    const list = (a.checks || []).filter(t => String(t).trim());
    if(!list.length || setup) return null;
    const d = document.createElement("span");
    d.className = "todo";
    d.textContent = list.join(" · ");
    d.title = list.join(NL);
    d.dataset.items = list.join(NL);
    return d;
  }

  function areaEl(a, lockSet, part){
    const wrap = document.createElement("div");
    wrap.className = "area" + (part ? " sub" : "");
    wrap.dataset.id = a.id;

    // 설정 모드에서도 카드 모양은 그대로 두고, 이름·정원만 제자리에서 고친다
    const head = document.createElement("div");
    head.className = "area-head";
    const cur = (C.assign[a.id] || []).length;
    let splitBtn = null;

    const nm = document.createElement("span");
    nm.className = "area-name";
    nm.textContent = part ? part.sub : a.name;      // 묶음 안에서는 장소만 보여 준다
    if(a.outside && !part){                          // 외부청소로 보내는 구역임을 표로
      const tg = document.createElement("span");
      tg.className = "tag"; tg.textContent = "외부";
      nm.append(tg);
    }
    const cp = document.createElement("span");
    cp.className = "area-cap";

    if(setup){
      wrap.draggable = true;
      nm.setAttribute("contenteditable", "plaintext-only");
      nm.spellcheck = false;
      nm.title = part ? "장소 수정" : "이름 수정";
      noDrag(nm);
      nm.addEventListener("input", () => {
        const t = nm.textContent.trim();
        a.name = part ? (t ? `${part.g.base}(${t})` : part.g.base) : (t || "구역");
        if(part) part.sub = t;
        save();
      });

      const capIn = document.createElement("input");
      capIn.type = "number"; capIn.className = "cap-in";
      capIn.min = 1; capIn.max = 20; capIn.value = a.cap; capIn.title = "정원";
      capIn.name = "cap-" + a.id; capIn.autocomplete = "off";
      noDrag(capIn);
      capIn.addEventListener("change", () => {
        a.cap = clamp(capIn.value, 1, 20, 1);
        C.assign[a.id] = (C.assign[a.id] || []).slice(0, a.cap);
        render(); save();
      });
      cp.append(`${cur}/`, capIn, "명");

      // 단독 구역은 세부구역 둘로 나눌 수 있게 한다 (과학실 → 과학실(1) · 과학실(2))
      if(!part){
        splitBtn = document.createElement("button");
        splitBtn.className = "sub-add";
        splitBtn.textContent = "＋";
        splitBtn.title = "세부구역으로 나누기";
        noDrag(splitBtn);
        splitBtn.addEventListener("click", e => {
          e.stopPropagation();
          const base = a.name;
          a.name = `${base}(1)`;
          const idx = C.areas.indexOf(a);
          C.areas.splice(idx + 1, 0, { id:newId(), name:`${base}(2)`, tier:a.tier, cap:1 });
          render(); save();
          focusName("2");
        });
      }

      const del = document.createElement("button");
      del.className = "area-del"; del.textContent = "×"; del.title = "구역 삭제";
      noDrag(del);
      del.addEventListener("click", e => {
        e.stopPropagation();
        C.areas.splice(C.areas.indexOf(a), 1);
        delete C.assign[a.id]; delete C.base[a.id];
        render(); save();
      });
      wrap.append(del);
      bindAreaSetup(wrap, a);
    }else{
      cp.textContent = `${cur}/${a.cap}명`;
    }
    head.append(nm, cp);
    if(splitBtn) head.append(splitBtn);

    const slots = document.createElement("div");
    slots.className = "slots";
    for(const no of (C.assign[a.id] || [])) slots.append(stuEl(no, a.id, lockSet));
    for(let i = cur; i < a.cap; i++){
      const e = document.createElement("div");
      e.className = "empty-slot"; e.textContent = "빈자리";
      slots.append(e);
    }
    wrap.append(head);
    // 묶음 안 세부구역은 묶음 머리에 한 번만 적는다 (같은 역할이라 내용이 같다)
    // 일단 이름 옆에 붙이고, 자리가 없으면 placeTodos 가 아래로 내린다
    if(!part){ const t = todoEl(a); if(t) head.insertBefore(t, cp); }
    wrap.append(slots);
    if(!setup) bindArea(wrap);
    return wrap;
  }

  // 편집 요소를 잡았을 때는 구역 드래그가 시작되지 않게 한다
  function noDrag(el){
    el.draggable = false;
    el.addEventListener("dragstart", e => { e.preventDefault(); e.stopPropagation(); });
    el.addEventListener("mousedown", e => e.stopPropagation());
    // Enter 로 줄바꿈이 들어가지 않게. 대신 다음 편집칸으로 넘어간다.
    el.addEventListener("keydown", e => {
      if(e.key !== "Enter") return;
      e.preventDefault();
      const all = [...els.cols.querySelectorAll("[contenteditable], .cap-in")];
      const i = all.indexOf(el);
      const next = all[i + (e.shiftKey ? -1 : 1)];
      if(next){
        next.focus();
        if(next.select) next.select();
        else{
          const r = document.createRange(); r.selectNodeContents(next);
          const s = getSelection(); s.removeAllRanges(); s.addRange(r);
        }
      }else el.blur();
    });
  }

  // 구역 추가는 배치도 밖(안내 줄)에서 한다 — 칸 위에 겹치지 않게
  function addArea(tier){
    C.areas.push({ id:newId(), name:"새 구역", tier, cap:1 });
    render(); save();
    focusName("새 구역");
  }

  function stuEl(no, areaId, lockSet){
    const el = document.createElement("div");
    el.className = "stu";
    el.draggable = true;
    el.dataset.no = no;
    el.dataset.area = areaId;
    if(lockSet.has(no)) el.classList.add("locked");
    else if(!busy && areaOf(C.base, no) && areaOf(C.base, no) !== areaId) el.classList.add("moved");

    const n = document.createElement("b");
    n.textContent = nameOf(no);
    const b = document.createElement("em");
    b.textContent = no + "번";
    el.append(n, b);
    bindStu(el);
    return el;
  }

  /* ── 학급 인원 목록 ────────────────────────── */
  // 명단 패널은 두 가지 모드로 쓴다 : 청소 제외 지정 / 청소 못한 학생 지정
  let rbMode = "out";

  function renderRosterBar(){
    if(els.rosterBar.hidden) return;
    const bad = rbMode === "bad";
    const leads = leadNos();
    const placed = new Set();
    for(const id in C.assign) for(const no of C.assign[id]) placed.add(no);
    const areaName = no => {
      const a = C.areas.find(x => x.id === areaOf(C.assign, no));
      return a ? a.name : "";
    };
    const pt = bad ? scores() : null;
    const badSet = new Set(C.badly);

    for(const b of els.rbModes.children) b.classList.toggle("on", b.dataset.rbmode === rbMode);

    const 참여 = rosterNos().length;
    const 제외 = students.filter(s => C.excluded.includes(s.no) && !leads.includes(s.no)).length;
    const 미배정 = rosterNos().filter(n => !placed.has(n)).length;
    const outNames = outsideAreas().map(a => a.name).join(" · ");
    const outCap = outsideAreas().reduce((n, a) => n + a.cap, 0);

    els.rbCount.textContent = bad
      ? `못한 학생 ${C.badly.length}명 · 외부청소 ${outCap}자리`
      : `청소 ${참여}명 · 제외 ${제외}명 · 미배정 ${미배정}명`;
    els.rbTip.textContent = bad
      ? (outNames ? `누르면 지정 · 뽑기하면 ${outNames} 순서로 누적 점수 높은 학생부터 · 확정하면 비워집니다`
                  : "외부청소 구역이 없습니다 — 설정 모드에서 구역의 ‘외부’ 를 켜 주세요")
      : "구역으로 끌면 배정 · 여기로 끌거나 누르면 청소에서 제외(뽑기에서도 빠짐)";

    els.rbList.replaceChildren(...students.map(s => {
      const no = s.no;
      const isLead = leads.includes(no);
      const isOut  = !isLead && C.excluded.includes(no);
      const isBad  = badSet.has(no);
      const el = document.createElement("div");
      el.className = "rb-item" + (bad
        ? ((isLead || isOut) ? " off" : isBad ? " bad" : "")
        : (isLead ? " is-lead" : isOut ? " out" : placed.has(no) ? " placed" : ""));
      el.draggable = !bad && !isLead && !busy && !setup;
      el.dataset.no = no;
      el.title = bad
        ? ((isLead || isOut) ? "청소 명단에 없어 외부청소로 보낼 수 없습니다"
                             : isBad ? "지정됨 — 눌러서 해제" : "눌러서 ‘청소 못함’ 으로 지정")
        : (isLead ? "역할 담당 — 구역 배정에서 제외됩니다"
                  : isOut ? "청소에서 제외됨 — 눌러서 되돌리기"
                          : "눌러서 청소에서 제외 · 끌어서 구역에 배정");

      const t = document.createElement("span");
      t.textContent = `${no} ${s.name}`;
      el.append(t);
      const tag = bad
        ? ((isLead || isOut) ? "제외" : `${Math.round(pt[no] || 0)}점`)
        : (isLead ? "역할" : isOut ? "제외" : placed.has(no) ? areaName(no) : "");
      if(tag){
        const sm = document.createElement("small");
        sm.textContent = tag;
        el.append(sm);
      }

      if(bad){
        if(!isLead && !isOut) el.addEventListener("click", () => {
          if(busy || setup) return;
          const i = C.badly.indexOf(no);
          if(i >= 0) C.badly.splice(i, 1); else C.badly.push(no);
          render(); save();
        });
      }else if(!isLead){
        el.addEventListener("click", () => {
          if(busy || setup) return;
          if(isOut){ includeStu(no); render(); markDirty("edit"); }
          else unplaceStu(no);                  // 안에서 render · markDirty 까지 한다
        });
        el.addEventListener("dragstart", e => {
          if(busy || setup){ e.preventDefault(); return; }
          dragNo = no; dragArea = areaOf(C.assign, no);   // 배정 전이면 null
          el.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", String(no));
        });
        el.addEventListener("dragend", () => {
          document.querySelectorAll(".dragging,.target,.over")
            .forEach(x => x.classList.remove("dragging","target","over"));
          dragNo = null; dragArea = null;
        });
      }
      return el;
    }));
  }

  // 명단으로 끌어오면 배정을 해제한다
  els.rosterBar.addEventListener("dragover", e => {
    if(dragNo === null || dragArea == null) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    els.rosterBar.classList.add("over");
  });
  els.rosterBar.addEventListener("dragleave", e => {
    if(!els.rosterBar.contains(e.relatedTarget)) els.rosterBar.classList.remove("over");
  });
  els.rosterBar.addEventListener("drop", e => {
    e.preventDefault();
    els.rosterBar.classList.remove("over");
    if(dragNo === null || dragArea == null) return;
    unplaceStu(dragNo);
  });


  /* ── 화면에 맞추기 (스크롤 없이 꽉 차게) ─────
     폭은 '칸 배치' 트리가 정하고, 여기서는 글자 크기(--k)만 화면에 맞춘다.
     넘치면 줄이고 남으면 키운다 — 넘치지 않는 가장 큰 값에서 멈춘다. */
  let lastK = 1.35;                       // 평소(설정 모드가 아닐 때)의 배율
  function fit(){
    const box = els.cols;
    if(!box.clientHeight) return;
    try{ placeTodos(); }catch(e){ console.error(e); }

    const cols = [...box.querySelectorAll(".col")];
    if(!cols.length) return;
    const fits = () => cols.every(c =>
      c.scrollHeight <= c.clientHeight + 1 && c.scrollWidth <= c.clientWidth + 1);
    const set = k => { box.style.setProperty("--k", k); applyTreeSizes(); };

    // 구역 설정 모드에서는 해야 할 일이 숨어 자리가 남는다.
    // 그때 배율까지 키우면 글자가 갑자기 커지므로, 평소 크기를 그대로 쓰고
    // 넘칠 때만 줄인다.
    let k = setup ? lastK : 1.35;
    set(k);
    if(!fits()){
      while(k > 0.6){ k = +(k - 0.05).toFixed(2); set(k); if(fits()) break; }
    }else if(!setup){
      while(k < 1.9){
        const t = +(k + 0.05).toFixed(2);
        set(t);
        if(!fits()){ set(k); break; }
        k = t;
      }
    }
    if(!setup) lastK = k;
    balanceCols();
  }

  /* 넘치는 칸이 있으면 여유 있는 옆 칸에서 폭을 조금씩 가져온다.
     글자 크기는 건드리지 않는다 — 폭만 옮긴다. */
  function balanceCols(){
    if(!tree) return;
    const leaves = () => [...els.cols.querySelectorAll(".col")]
      .filter(c => c.dataset.tier !== "special");
    const tight = c => c.scrollHeight > c.clientHeight + 1 || c.scrollWidth > c.clientWidth + 1;

    for(let step = 0; step < 30; step++){
      const need = leaves().filter(tight);
      if(!need.length) return;
      let moved = false;
      for(const c of need){
        const box = c.parentElement;
        if(!box || !box.classList.contains("sb-row")) continue;   // 폭은 가로 묶음 안에서만
        const node = nodeAt(box.dataset.path);
        const sibs = [...box.children].filter(x => !x.classList.contains("split"));
        const i = sibs.indexOf(c);
        if(i < 0) continue;

        // 가장 여유 있는 형제를 고른다 (묶음이면 그 안에서 가장 빠듯한 칸 기준)
        let j = -1, best = 8, donors = null;
        sibs.forEach((sib, x) => {
          if(x === i) return;
          const inner = sib.classList.contains("col") ? [sib] : [...sib.querySelectorAll(".col")];
          if(!inner.length) return;
          const slack = Math.min(...inner.map(n => n.clientHeight - n.scrollHeight));
          if(slack > best){ best = slack; j = x; donors = inner.map(n => n.dataset.tier); }
        });
        if(j < 0) continue;

        const total = node.size.reduce((a, b) => a + b, 0) || 1;
        const give = node.size[j] * 0.08;
        if(node.size[j] - give < total * 0.12) continue;
        node.size[j] -= give; node.size[i] += give;
        applyTreeSizes();

        const after = donors.map(t => els.cols.querySelector('.col[data-tier="' + t + '"]'))
                            .filter(Boolean);
        if(after.some(tight)){                       // 준 쪽이 넘치면 되돌린다
          node.size[j] += give; node.size[i] -= give;
          applyTreeSizes();
          continue;
        }
        moved = true;
      }
      if(!moved) return;
    }
  }

  /* 해야 할 일 자리 잡기
     · 업무가 둘 이상 : 이름 옆에 두 줄로 쌓는다 — 둘째 줄이 첫째 줄 바로 밑에 붙어
                       세로로 줄이 맞는다 (글자 크기가 바뀌어도 같이 움직인다)
     · 하나뿐        : 이름 줄이 학생 칸 줄보다 짧으면 이름 옆, 아니면 아래
     fit() 이 여러 번 부르므로, 매번 원래 모양으로 되돌린 뒤 다시 나눈다. */
  function placeTodos(){
    const width = el => {
      const gap = parseFloat(getComputedStyle(el).columnGap) || 0;
      return [...el.children].reduce((n, c) => n + c.offsetWidth, 0)
           + Math.max(0, el.children.length - 1) * gap;
    };
    for(const box of els.cols.querySelectorAll(".area, .group")){
      const todo = box.querySelector(":scope > .todo, :scope > .area-head > .todo, " +
                                     ":scope > .group-head > .todo");
      if(!todo) continue;
      const head = box.querySelector(":scope > .area-head, :scope > .group-head");
      const body = box.querySelector(":scope > .slots, :scope > .group-body");
      if(!head || !body) continue;
      const cap = head.querySelector(".area-cap");
      const items = (todo.dataset.items || todo.textContent).split(NL).filter(Boolean);

      head.insertBefore(todo, cap || null);                 // 이름 옆
      todo.classList.toggle("stack", items.length >= 2);
      if(items.length >= 2){
        const first = document.createElement("span");
        first.textContent = items[0];
        const rest = document.createElement("span");
        rest.textContent = items.slice(1).join(" · ");
        todo.replaceChildren(first, rest);                  // 첫째 줄 · 그 밑에 나머지
        continue;
      }
      todo.textContent = items[0] || "";
      if(width(head) > width(body)) box.insertBefore(todo, body);   // 자리가 없으면 아래로
    }
  }

  /* ── 칸 배치 : 끌어서 자리·크기 바꾸기 ─────────
     배치를 트리 하나로 둔다.
       잎   = "easy" | "mid" | "hard"
       마디 = { dir:"row"|"col", items:[...], size:[...] }
     예) { dir:"row", items:["mid", {dir:"col", items:["hard","easy"]}] }
         → 왼쪽은 중간이 통으로, 오른쪽만 어려움/쉬움으로 위아래 분할.

     · 칸 머리를 끌어 다른 칸의 모서리에 놓으면 그 방향으로 쪼개거나 끼어든다
     · 칸 사이 경계를 끌면 두 칸이 폭(또는 높이)을 주고받는다
     · 경계를 두 번 누르면 그 묶음만 균등해진다
     배치는 이 컴퓨터에만 저장한다 (보는 방식이라 저장 파일에는 넣지 않는다). */
  const LAY_KEY = "cleaning-layout-v2";
  // 중간은 구역이 10곳이라 넓어야 한 줄에 여러 개가 들어간다.
  // 왼쪽을 통으로 쓰고 오른쪽만 쉬움/어려움으로 나눈다 (시안과 같은 기본값).
  const FRESH_TREE = () => ({
    dir:"row",
    items:["mid", { dir:"col", items:["easy", "hard"], size:[1, 1.8] }],
    size:[2, 1]
  });
  // var 로 두는 이유 : fit() 이 이 블록보다 먼저 한 번 돌 수 있는데
  // const/let 이면 그때 참조만 해도 스크립트 전체가 죽는다 (TDZ)
  var tree = FRESH_TREE();
  var treeCustom = false;              // 손으로 바꾼 적이 있나
  var leadsBottom = false;             // 특별을 맨 아래로 내렸나
  var DEM = {};                        // fit() 이 잰 칸별 요구 폭

  try{
    const v = JSON.parse(localStorage.getItem(LAY_KEY) || "null");
    if(v && v.tree && v.tree.items){
      tree = v.tree; treeCustom = !!v.custom; leadsBottom = !!v.leadsBottom;
    }
  }catch(e){}
  const saveLayout = () => {
    try{ localStorage.setItem(LAY_KEY, JSON.stringify(
      { tree, custom:treeCustom, leadsBottom })); }catch(e){}
  };

  const nodeAt = path => {
    if(!path) return tree;
    let n = tree;
    for(const i of path.split(".")) n = n.items[+i];
    return n;
  };

  // 잎이 하나뿐인 마디는 없앤다. 같은 방향이 겹치면 한 겹으로 편다.
  function tidyTree(node){
    if(typeof node === "string") return node;
    node.items = node.items.map(tidyTree);
    if(node.items.length === 1) return node.items[0];
    const items = [], size = [];
    node.items.forEach((kid, i) => {
      if(typeof kid !== "string" && kid.dir === node.dir){
        const sum = kid.size.reduce((a, b) => a + b, 0) || 1;
        kid.items.forEach((g, j) => {
          items.push(g); size.push((node.size[i] || 1) * (kid.size[j] || 1) / sum);
        });
      }else{ items.push(kid); size.push(node.size[i] || 1); }
    });
    node.items = items; node.size = size;
    return node;
  }

  // 트리에서 한 잎을 떼어 낸다
  function dropLeaf(node, tier){
    if(typeof node === "string") return node === tier ? null : node;
    const keep = [], size = [];
    node.items.forEach((kid, i) => {
      const r = dropLeaf(kid, tier);
      if(r !== null){ keep.push(r); size.push(node.size[i] || 1); }
    });
    if(!keep.length) return null;
    node.items = keep; node.size = size;
    return node;
  }

  // 목표 잎을 { dir } 방향으로 쪼개고 그 앞/뒤에 옮겨 온 잎을 넣는다
  function splitAt(node, target, tier, dir, before){
    if(typeof node === "string"){
      if(node !== target) return node;
      return { dir, items: before ? [tier, node] : [node, tier], size:[1, 1] };
    }
    node.items = node.items.map(kid => splitAt(kid, target, tier, dir, before));
    return node;
  }

  function moveTier(tier, target, dir, before){
    if(tier === target) return;
    tree = dropLeaf(tree, tier) || FRESH_TREE();
    tree = splitAt(tree, target, tier, dir, before);
    tree = tidyTree(tree);
    if(typeof tree === "string") tree = { dir:"row", items:[tree], size:[1] };
    treeCustom = true;
    saveLayout();
    buildTree();
    fit();
  }

  // 트리대로 DOM 을 다시 쌓는다 (칸 자체는 그대로 옮겨 붙인다)
  function buildTree(){
    if(!tree) return;
    const secOf = {};
    els.cols.querySelectorAll(".col").forEach(c => { secOf[c.dataset.tier] = c; });
    if(Object.keys(secOf).length < 4) return;   // 특별 + 세 난이도

    const special = els.cols.querySelector('.col[data-tier="special"]');
    delete secOf.special;                       // 특별은 트리에 넣지 않는다
    const mk = cls => { const d = document.createElement("div"); d.className = cls; return d; };
    const build = (node, path) => {
      if(typeof node === "string") return secOf[node];
      const box = mk("splitbox " + (node.dir === "row" ? "sb-row" : "sb-col"));
      box.dataset.path = path;
      node.items.forEach((kid, i) => {
        if(i){
          const bar = mk("split " + (node.dir === "row" ? "v" : "h"));
          bar.dataset.path = path; bar.dataset.i = i;
          box.append(bar);
        }
        box.append(build(kid, path ? path + "." + i : String(i)));
      });
      return box;
    };
    const root = build(tree, "");
    const treebox = mk("treebox");
    treebox.append(root);
    if(special){
      // 특별과 난이도 칸 사이에 가르는 선을 둔다 (끌지는 않는다 — 특별은 제 높이만 쓴다)
      const bar = mk("split h fixed");
      els.cols.replaceChildren(...(leadsBottom ? [treebox, bar, special]
                                               : [special, bar, treebox]));
    }else els.cols.replaceChildren(treebox);
  }

  // 트리 비율을 flex 로 옮긴다
  // 트리가 정한 비율을 flex 로 옮긴다. 구역 하나하나의 폭은 건드리지 않는다 —
  // 시안 CSS 에서 구역이 제 내용만큼 차지하고 좁아지면 다음 줄로 넘어가기 때문이다.
  function applyTreeSizes(){
    if(!tree) return;
    const tb = els.cols.querySelector(":scope > .treebox");
    const root = tb ? tb.firstElementChild : null;
    const walk = (node, el) => {
      if(typeof node === "string" || !el) return;
      const kids = [...el.children].filter(x => !x.classList.contains("split"));
      node.items.forEach((kid, i) => {
        const c = kids[i];
        if(!c) return;
        c.style.flex = (node.size[i] || 1) + " 1 0";
        walk(kid, c);
      });
    };
    walk(tree, root);
  }

  /* 칸 머리를 끌어 다른 칸의 모서리에 놓기 */
  let dragTier = null;
  const EDGES = ["edge-l", "edge-r", "edge-t", "edge-b"];
  const clearEdges = () =>
    els.cols.querySelectorAll(".col").forEach(c => c.classList.remove(...EDGES));

  function bindColDrag(col){
    const h = col.querySelector(":scope > header");
    if(!h) return;
    h.draggable = true;
    h.addEventListener("dragstart", e => {
      if(setup || TV){ e.preventDefault(); return; }   // 구역 설정 중엔 구역 끌기가 먼저 · TV 는 보기만
      dragTier = col.dataset.tier;
      col.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", "col:" + dragTier);
      e.stopPropagation();
    });
    h.addEventListener("dragend", () => {
      col.classList.remove("dragging");
      clearEdges();
      dragTier = null;
    });

    // 어느 모서리에 가까운지로 쪼갤 방향을 정한다
    const edgeOf = e => {
      const r = col.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      const near = Math.min(x, 1 - x, y, 1 - y);
      if(near === x) return ["row", true, "edge-l"];
      if(near === 1 - x) return ["row", false, "edge-r"];
      if(near === y) return ["col", true, "edge-t"];
      return ["col", false, "edge-b"];
    };
    col.addEventListener("dragover", e => {
      if(!dragTier || dragTier === col.dataset.tier) return;
      e.preventDefault(); e.stopPropagation();
      e.dataTransfer.dropEffect = "move";
      col.classList.remove(...EDGES);
      col.classList.add(edgeOf(e)[2]);
    });
    col.addEventListener("dragleave", () => col.classList.remove(...EDGES));
    col.addEventListener("drop", e => {
      if(!dragTier || dragTier === col.dataset.tier) return;
      e.preventDefault(); e.stopPropagation();
      const [dir, before] = edgeOf(e);
      const tier = dragTier;
      dragTier = null;
      clearEdges();
      moveTier(tier, col.dataset.tier, dir, before);
      toast("칸 배치를 바꿨습니다.");
    });
  }

  /* 경계 끌기 : 두 칸이 폭(또는 높이)을 주고받는다 */
  const MIN_SPLIT = 120;
  els.cols.addEventListener("pointerdown", e => {
    const bar = e.target.closest(".split");
    if(!bar || !els.cols.contains(bar) || bar.classList.contains("fixed")) return;
    if(/[?&]tv\b/.test(location.search)) return;         // TV 는 보기만
    e.preventDefault();

    const node = nodeAt(bar.dataset.path);
    const i = +bar.dataset.i;
    const vertical = node.dir === "row";
    const elA = bar.previousElementSibling, elB = bar.nextElementSibling;
    if(!elA || !elB) return;

    // 지금 크기를 픽셀로 고정해 두고 시작한다 (비율과 픽셀이 섞이지 않게)
    const kids = [...bar.parentElement.children].filter(c => !c.classList.contains("split"));
    kids.forEach((el, k) => {
      const r = el.getBoundingClientRect();
      node.size[k] = vertical ? r.width : r.height;
    });
    treeCustom = true;
    const aSize = node.size[i - 1], sum = node.size[i - 1] + node.size[i];
    const start = vertical ? e.clientX : e.clientY;

    bar.classList.add("on");
    bar.setPointerCapture(e.pointerId);
    document.body.style.userSelect = "none";

    // 얼마나 넘치는지를 숫자로 잰다. '넘치면 무조건 되돌리기' 로 하면
    // 이미 넘치는 칸이 있을 때 경계가 아예 안 움직인다.
    const over = el => [...(el.classList.contains("col") ? [el] : el.querySelectorAll(".col"))]
      .reduce((n, c) => n + Math.max(0, c.scrollHeight - c.clientHeight)
                          + Math.max(0, c.scrollWidth - c.clientWidth), 0);
    const startOver = over(elA) + over(elB);
    let good = [node.size[i - 1], node.size[i]];
    const put = (x, y) => {
      node.size[i - 1] = x; node.size[i] = y;
      elA.style.flex = x + " 1 0";
      elB.style.flex = y + " 1 0";
    };
    const move = ev => {
      const d = (vertical ? ev.clientX : ev.clientY) - start;
      const na = Math.min(sum - MIN_SPLIT, Math.max(MIN_SPLIT, aSize + d));
      put(na, sum - na);
      if(over(elA) + over(elB) > startOver) put(good[0], good[1]);
      else good = [node.size[i - 1], node.size[i]];
    };
    const up = () => {
      bar.classList.remove("on");
      bar.removeEventListener("pointermove", move);
      bar.removeEventListener("pointerup", up);
      bar.removeEventListener("pointercancel", up);
      document.body.style.userSelect = "";
      saveLayout();
      fit();
    };
    bar.addEventListener("pointermove", move);
    bar.addEventListener("pointerup", up);
    bar.addEventListener("pointercancel", up);
  });

  // 경계를 두 번 누르면 그 묶음만 균등하게
  els.cols.addEventListener("dblclick", e => {
    const bar = e.target.closest(".split");
    if(!bar) return;
    const node = nodeAt(bar.dataset.path);
    node.size = node.items.map(() => 1);
    treeCustom = true;
    saveLayout();
    fit();
    toast("칸 크기를 똑같이 맞췄습니다.");
  });

  /* 특별(총괄들) : 맨 위 / 맨 아래만 */
  // 특별 칸은 난이도 칸들의 맨 위 또는 맨 아래, 두 자리만 쓴다
  function placeLeads(){
    const special = els.cols.querySelector('.col[data-tier="special"]');
    const tb = els.cols.querySelector(":scope > .treebox");
    const bar = els.cols.querySelector(":scope > .split.fixed");
    if(!special || !tb) return;
    if(leadsBottom){ els.cols.append(bar || special); if(bar) els.cols.append(special); }
    else{ els.cols.insertBefore(special, tb); if(bar) els.cols.insertBefore(bar, tb); }
  }
  // 특별 칸 : 머리를 끌어 난이도 칸들의 맨 위 / 맨 아래로만 옮긴다
  (function(){
    const sp = els.cols.querySelector('.col[data-tier="special"]');
    if(!sp) return;
    const h = sp.querySelector(":scope > header");
    if(!h) return;
    h.draggable = true;
    h.title = "끌어서 맨 위 / 맨 아래로";
    let on = false;
    h.addEventListener("dragstart", e => {
      if(setup || TV){ e.preventDefault(); return; }
      on = true;
      sp.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", "leads");
      e.stopPropagation();
    });
    h.addEventListener("dragend", () => {
      on = false;
      sp.classList.remove("dragging");
      els.cols.classList.remove("drop-top", "drop-bottom");
    });
    els.cols.addEventListener("dragover", e => {
      if(!on) return;
      e.preventDefault();
      const r = els.cols.getBoundingClientRect();
      const top = (e.clientY - r.top) < r.height / 2;
      els.cols.classList.toggle("drop-top", top);
      els.cols.classList.toggle("drop-bottom", !top);
    });
    els.cols.addEventListener("drop", e => {
      if(!on) return;
      e.preventDefault();
      const r = els.cols.getBoundingClientRect();
      leadsBottom = (e.clientY - r.top) >= r.height / 2;
      els.cols.classList.remove("drop-top", "drop-bottom");
      on = false;
      saveLayout();
      placeLeads();
      fit();
      toast(leadsBottom ? "특별을 맨 아래로 옮겼습니다." : "특별을 맨 위로 옮겼습니다.");
    });
  })();

  window.addEventListener("storage", e => {
    if(e.key !== LAY_KEY || !e.newValue) return;
    try{
      const v = JSON.parse(e.newValue);
      if(!v || !v.tree || !v.tree.items) return;
      tree = v.tree; treeCustom = !!v.custom; leadsBottom = !!v.leadsBottom;
      buildTree(); placeLeads(); fit();
    }catch(err){}
  });

  // 칸 배치를 처음 한 번 세운다
  els.cols.querySelectorAll('.col:not([data-tier="special"])').forEach(bindColDrag);
  buildTree();
  placeLeads();
  try{ fit(); }catch(e){}

  /* ── 학생 상호작용 ─────────────────────────── */
  let dragNo = null, dragArea = null;

  // 어려움 구역은 전체 정원의 1/2 까지만 고정할 수 있다.
  function hardCap(){
    return C.areas.filter(a => a.tier === "hard").reduce((n, a) => n + a.cap, 0);
  }
  function hardLockMax(){ return Math.floor(hardCap() * HARD_LOCK_SHARE); }
  function hardLockedNos(){
    const hard = new Set(C.areas.filter(a => a.tier === "hard").map(a => a.id));
    const out = [];
    for(const id in C.assign) if(hard.has(id))
      for(const no of C.assign[id]) if(C.locked.includes(no)) out.push(no);
    return out;
  }
  // 고정하려는 학생이 어려움 구역이면, 한도를 넘는지 본다. 넘으면 안내 문구를 돌려준다.
  function hardLockBlocked(no){
    const area = C.areas.find(a => (C.assign[a.id] || []).includes(no));
    if(!area || area.tier !== "hard") return "";
    const max = hardLockMax();
    if(hardLockedNos().length < max) return "";
    return `어려움은 정원 ${hardCap()}명의 절반인 ${max}명까지만 고정할 수 있습니다.`;
  }

  function bindStu(el){
    const no = +el.dataset.no, areaId = el.dataset.area;
    el.addEventListener("animationend", () => {
      el.classList.remove("pop", "settle");
      el.style.removeProperty("--d");
    });

    el.addEventListener("click", e => {
      if(busy) return;
      e.stopPropagation();
      const i = C.locked.indexOf(no);
      if(i >= 0) C.locked.splice(i, 1);
      else{
        const block = hardLockBlocked(no);
        if(block){ toast(block); return; }
        C.locked.push(no);
      }
      render(); save();
    });
    el.addEventListener("dragstart", e => {
      if(busy){ e.preventDefault(); return; }
      dragNo = no; dragArea = areaId;
      el.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", String(no));
    });
    el.addEventListener("dragend", () => {
      document.querySelectorAll(".dragging,.target,.over")
        .forEach(x => x.classList.remove("dragging","target","over"));
      dragNo = null; dragArea = null;
    });
    // 같은 구역(dragArea === areaId)이면 아예 받지 않는다 — 표시도 뜨지 않는다
    el.addEventListener("dragover", e => {
      if(dragNo === null || dragNo === no || dragArea === areaId) return;
      e.preventDefault(); e.stopPropagation();
      e.dataTransfer.dropEffect = "move";
      el.classList.add("target");
    });
    el.addEventListener("dragleave", () => el.classList.remove("target"));
    el.addEventListener("drop", e => {
      e.preventDefault(); e.stopPropagation();
      el.classList.remove("target");
      if(dragNo === null || dragNo === no || dragArea === areaId) return;
      swapStu(dragNo, no);
    });
  }

  function bindArea(wrap){
    const id = wrap.dataset.id;
    wrap.addEventListener("dragover", e => {
      if(dragNo === null || dragArea === id) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      wrap.classList.add("over");
    });
    wrap.addEventListener("dragleave", () => wrap.classList.remove("over"));
    wrap.addEventListener("drop", e => {
      e.preventDefault();
      wrap.classList.remove("over");
      if(dragNo === null || dragArea === id) return;

      const area = C.areas.find(x => x.id === id);
      if(area && (C.assign[id] || []).length >= area.cap){
        // 정원이 찼으면 놓은 자리에서 가장 가까운 학생과 맞바꾼다 (칩을 정확히 맞출 필요 없이)
        let best = null, bestD = Infinity;
        for(const el of wrap.querySelectorAll(".stu")){
          const r = el.getBoundingClientRect();
          const d = Math.hypot(e.clientX - (r.left + r.width/2), e.clientY - (r.top + r.height/2));
          if(d < bestD){ bestD = d; best = el; }
        }
        if(best) swapStu(dragNo, +best.dataset.no);
        return;
      }
      moveStu(dragNo, id);
    });
  }

  function swapStu(a, b){
    const ai = areaOf(C.assign, a), bi = areaOf(C.assign, b);
    if(!bi || ai === bi) return;                 // 같은 구역 안에서는 순서를 바꾸지 않는다
    includeStu(a);                               // 제외돼 있었다면 다시 대상에 넣는다
    if(ai){
      C.assign[ai][C.assign[ai].indexOf(a)] = b; // 둘 다 배정돼 있으면 맞바꾼다
      C.assign[bi][C.assign[bi].indexOf(b)] = a;
    }else{
      C.assign[bi][C.assign[bi].indexOf(b)] = a; // 명단에서 끌어왔으면 그 자리를 대신한다
    }
    sortAll();                                   // 옮겨 간 구역에서 번호순 자리를 찾아 들어간다
    render(); markDirty("edit");
  }

  function moveStu(no, toId){
    const from = areaOf(C.assign, no);
    const area = C.areas.find(x => x.id === toId);
    if(!area || from === toId) return;
    if((C.assign[toId] || []).length >= area.cap){
      toast(`‘${area.name}’ 은(는) 정원이 찼습니다. 학생 카드 위로 끌어다 놓으면 자리를 맞바꿉니다.`);
      return;
    }
    includeStu(no);                              // 제외돼 있었다면 다시 대상에 넣는다
    if(from) C.assign[from].splice(C.assign[from].indexOf(no), 1);
    C.assign[toId].push(no);
    sortAll();                                   // 새 구역에서 번호순 자리에 들어간다
    render(); markDirty("edit");
  }

  // 명단으로 끌어다 놓기 = 배정 해제 + 청소에서 제외 (다음 뽑기 대상에서 빠진다)
  function unplaceStu(no){
    const from = areaOf(C.assign, no);
    if(from) C.assign[from].splice(C.assign[from].indexOf(no), 1);
    if(!C.excluded.includes(no)) C.excluded.push(no);
    render(); markDirty("edit");
  }

  // 구역으로 끌어다 놓기 = 다시 청소 대상에 포함
  function includeStu(no){
    const i = C.excluded.indexOf(no);
    if(i >= 0) C.excluded.splice(i, 1);
  }

  /* ── 설정 모드 : 구역 끌어서 난이도·순서 변경 ─ */
  let dragAreaId = null;

  function bindAreaSetup(wrap, a){
    wrap.addEventListener("dragstart", e => {
      dragAreaId = a.id;
      wrap.classList.add("drag");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", a.id);
    });
    wrap.addEventListener("dragend", () => {
      document.querySelectorAll(".drag,.drop-before,.drop-in")
        .forEach(x => x.classList.remove("drag","drop-before","drop-in"));
      dragAreaId = null;
    });
    wrap.addEventListener("dragover", e => {
      if(!dragAreaId || dragAreaId === a.id) return;
      e.preventDefault(); e.stopPropagation();
      e.dataTransfer.dropEffect = "move";
      wrap.classList.add("drop-before");
    });
    wrap.addEventListener("dragleave", () => wrap.classList.remove("drop-before"));
    wrap.addEventListener("drop", e => {
      e.preventDefault(); e.stopPropagation();
      wrap.classList.remove("drop-before");
      if(!dragAreaId || dragAreaId === a.id) return;
      moveArea(dragAreaId, a.tier, C.areas.indexOf(a));
    });
  }

  // 열(난이도) 자체에 떨어뜨리면 그 난이도의 맨 뒤로 보낸다
  els.cols.querySelectorAll(".col").forEach(col => {
    col.addEventListener("dragover", e => {
      if(!setup || !dragAreaId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      col.classList.add("drop-in");
    });
    col.addEventListener("dragleave", () => col.classList.remove("drop-in"));
    col.addEventListener("drop", e => {
      if(!setup || !dragAreaId) return;
      e.preventDefault();
      col.classList.remove("drop-in");
      moveArea(dragAreaId, col.dataset.tier, -1);
    });
  });

  function moveArea(id, tier, beforeIdx){
    const from = C.areas.findIndex(x => x.id === id);
    if(from < 0) return;
    const [a] = C.areas.splice(from, 1);
    a.tier = tier;
    if(beforeIdx < 0){
      C.areas.push(a);
    }else{
      const idx = beforeIdx > from ? beforeIdx - 1 : beforeIdx;
      C.areas.splice(Math.max(0, idx), 0, a);
    }
    render(); save();
  }

  function setSetup(on){
    if(on === setup || busy) return;
    setup = on;
    document.body.classList.toggle("setup", on);
    els.legend.hidden = on;
    els.setupTip.hidden = !on;
    render();
    if(!on) save();
  }

  /* ── 설정 창 ───────────────────────────────── */
  const isOpen = () => !els.backdrop.hasAttribute("hidden");
  function openSheet(){
    if(setup) return;
    if(editRec){ toast("고치는 중입니다. ✓ 저장 또는 취소를 먼저 눌러 주세요."); return; }
    els.backdrop.removeAttribute("hidden");
    fillNameList(); renderRoles(); renderSurvey(); renderRoster(); renderSum(); fileStatus();
  }
  function closeSheet(){ els.backdrop.setAttribute("hidden", ""); }

  function fillNameList(){
    els.nameList.replaceChildren(...students.map(s => {
      const o = document.createElement("option"); o.value = s.name; return o;
    }));
  }
  /* ── 역할 편집 ─────────────────────────────── */
  function renderRoles(){
    els.roleList.replaceChildren(...C.roles.map(role => {
      const row = document.createElement("div");
      row.className = "role-row";

      const label = document.createElement("input");
      label.type = "text"; label.className = "role-label";
      label.value = role.label; label.placeholder = "역할 이름";
      label.maxLength = 20;
      label.addEventListener("change", () => applyRoleLabel(role, label));

      const who = document.createElement("input");
      who.type = "text"; who.className = "role-who";
      who.setAttribute("list", "nameList");
      who.value = role.no == null ? "" : nameOf(role.no);
      who.placeholder = "학생 이름"; who.autocomplete = "off";
      who.addEventListener("change", () => applyRoleWho(role, who));

      const x = document.createElement("button");
      x.className = "role-x"; x.type = "button";
      x.textContent = "×"; x.title = "역할 지우기";
      x.addEventListener("click", () => removeRole(role));

      row.append(label, who, x);
      return row;
    }));
  }
  // 역할이 바뀌면 명단·배정이 함께 흔들리므로 한 곳에서 뒷정리한다.
  function afterRoleChange(){
    mirrorLegacyLeads();
    for(const id in C.assign) C.assign[id] = C.assign[id].filter(no => !leadNos().includes(no));
    C.locked = C.locked.filter(no => !leadNos().includes(no));
    renderRoles(); renderRoster(); renderSum(); render(); save();
  }
  function applyRoleLabel(role, input){
    const v = input.value.trim().slice(0, 20);
    role.label = v || "역할";
    afterRoleChange();
  }
  function applyRoleWho(role, input){
    const name = input.value.trim();
    if(!name) role.no = null;
    else{
      const t = students.find(s => s.name === name);
      if(!t){ toast(`‘${name}’ 이름의 학생이 명단에 없습니다.`); renderRoles(); return; }
      for(const r of C.roles) if(r !== role && r.no === t.no) r.no = null;   // 한 사람은 역할 하나
      role.no = t.no;
    }
    afterRoleChange();
  }
  function removeRole(role){
    if(C.roles.length <= 1){ toast("역할은 하나 이상 있어야 합니다."); return; }
    C.roles = C.roles.filter(r => r !== role);
    afterRoleChange();
  }
  function addRole(){
    if(C.roles.length >= 8){ toast("역할은 최대 8개까지입니다."); return; }
    C.roles.push({ id:newId(), label:"새 역할", no:null });
    afterRoleChange();
  }
  function resetRoles(){
    C.roles = DEFAULT_ROLES.map(label => ({ id:newId(), label, no:null }));
    afterRoleChange();
    toast("기본 역할로 되돌렸습니다. 담당자를 다시 지정해 주세요.");
  }

  /* ── 난이도 설문 집계 ───────────────────────── */
  const surveyVotes = () => (C.survey && C.survey.votes) || {};
  function renderSurvey(){
    const votes = surveyVotes();
    const rows = C.areas.slice().sort((a, b) =>
      (+votes[b.id] || 0) - (+votes[a.id] || 0) || a.name.localeCompare(b.name));

    els.surveyList.replaceChildren(...rows.map(a => {
      const row = document.createElement("div");
      row.className = "survey-row";
      const nm = document.createElement("span");
      nm.className = "survey-name"; nm.textContent = a.name;
      const ti = document.createElement("span");
      ti.className = "survey-tier"; ti.textContent = TIERS[a.tier];
      const inp = document.createElement("input");
      inp.type = "number"; inp.min = "0"; inp.max = "99";
      inp.dataset.area = a.id;
      inp.value = votes[a.id] == null ? "" : String(votes[a.id]);
      row.append(nm, ti, inp);
      return row;
    }));

    const total = Object.values(votes).reduce((n, v) => n + (+v || 0), 0);
    const l = document.createElement("span");
    l.textContent = C.survey && C.survey.at
      ? `${C.survey.at.slice(0, 10)} 집계` : "집계 없음";
    const r = document.createElement("span");
    r.textContent = total ? `${total}표` : "표 없음";
    els.surveySum.replaceChildren(l, r);
  }
  function saveSurvey(){
    const votes = {};
    els.surveyList.querySelectorAll("input[data-area]").forEach(inp => {
      const n = clamp(inp.value, 0, 99, 0);
      if(n > 0) votes[inp.dataset.area] = n;
    });
    C.survey = Object.keys(votes).length
      ? { at:new Date().toISOString(), votes } : null;
    renderSurvey(); save();
    toast(C.survey ? "설문 집계를 저장했습니다." : "설문 집계를 비웠습니다.");
  }
  function clearSurvey(){
    C.survey = null; renderSurvey(); save();
    toast("설문 집계를 지웠습니다.");
  }

  function renderSum(){
    const cap = totalCap();
    const l = document.createElement("span");
    l.textContent = `구역 ${C.areas.length}곳`;
    const r = document.createElement("span");
    r.textContent = `정원 합계 ${cap}명`;
    els.sum.replaceChildren(l, r);
    renderRosterSum();
    renderOutside();
    renderPend();
    renderChk();
    renderStd();
    renderScores();

  function renderChk(){
    const leads = leadNos();
    const 대상 = students.filter(st => chk(st.no) > 0);
    const 합계 = students.reduce((n, st) => n + chk(st.no), 0);
    const 화면 = students.reduce((n, st) => n + marked(st.no), 0);
    const l = document.createElement("span");
    l.textContent = 대상.length ? `${대상.length}명 지적됨` : "지적된 학생 없음";
    const r = document.createElement("span");
    r.textContent = 대상.length
      ? `합계 ${합계}회 (화면 ${화면} · 직접 ${합계 - 화면})`
      : "외부청소는 평소대로 배정됩니다";
    if(!els.chkSum) return;
    els.chkSum.replaceChildren(l, r);

    els.chkList.replaceChildren(...students.map(st => {
      const no = st.no, isLead = leads.includes(no), off = C.excluded.includes(no);
      const row = document.createElement("div");
      row.className = "chk-row" + (isLead || off ? " lead" : "") + (chk(no) ? " on" : "");
      const t = document.createElement("span");
      t.textContent = `${no} ${st.name}` + (marked(no) ? ` ·${marked(no)}` : "");
      const inp = document.createElement("input");
      inp.type = "number"; inp.min = 0; inp.max = 99;
      inp.value = (+C.checks[no] || "") || "";
      inp.placeholder = "0";
      inp.autocomplete = "off"; inp.name = "chk-" + no;
      inp.disabled = isLead || off;
      inp.title = isLead ? "역할 담당 — 구역 배정에서 빠집니다"
                : off ? "청소 명단에서 빠진 학생입니다"
                : marked(no) ? `직접 더할 횟수 (화면 체크 ${marked(no)}회는 따로 더해집니다)`
                             : "종이로 센 횟수를 직접 넣습니다";
      inp.addEventListener("change", () => {
        const n = clamp(inp.value, 0, 99, 0);
        if(n > 0) C.checks[no] = n; else delete C.checks[no];
        inp.value = n || "";
        row.classList.toggle("on", n > 0);
        renderChk(); render(); save();
      });
      row.append(t, inp);
      return row;
    }));
  }

  function renderStd(){
    els.stdList.replaceChildren(...C.areas.map(a => {
      const box = document.createElement("div");
      box.className = "std-item";
      const b = document.createElement("b");
      b.textContent = a.name;
      const sm = document.createElement("small");

      b.append(sm);

      ta.rows = 2; ta.spellcheck = false;
      ta.value = (a.checks || []).join(NL);
      ta.placeholder = "점검 기준을 한 줄에 하나씩";
      ta.addEventListener("change", () => {
        a.checks = ta.value.split(NL).map(t => t.trim()).filter(Boolean);
        sm.textContent = daysOf(a).map(i => DAYS[i]).join("·");
        save();
      });
      box.append(b, ta);
      return box;
    }));
  }

  function renderPend(){
    const on = !!(C.pending && C.pending.length);
    const l = document.createElement("span");
    l.textContent = on ? `${C.pending.length}곳 준비됨` : "준비해 둔 구역 없음";
    const r = document.createElement("span");
    if(on){
      const n = rosterNos().length, cap = capOf(C.pending);
      r.textContent = `정원 합계 ${cap}명` + (n === cap ? " · 명단과 일치" : ` · 명단 ${n}명과 안 맞음`);
      if(n !== cap) r.className = "bad";
    }else{
      r.textContent = "지금 구역 그대로 씁니다";
    }
    els.pendSum.replaceChildren(l, r);
    els.pendApply.disabled = !on;
    els.pendClear.disabled = !on;
    els.pendEdit.textContent = on ? "이어서 고치기" : "미리 설정하기";

  function renderRosterSum(){
    const n = rosterNos().length, cap = totalCap();
    const l = document.createElement("span");
    l.textContent = `청소 명단 ${n}명`;
    const r = document.createElement("span");
    r.textContent = n === cap ? `정원 합계 ${cap}명 · 일치` : `정원 합계 ${cap}명 · ${n > cap ? n-cap+"명 초과" : cap-n+"명 부족"}`;
    if(n !== cap) r.className = "bad";
    if(!els.rosterSum) return;
    els.rosterSum.replaceChildren(l, r);
  }


  // 외부청소 구역 체크리스트 — 어려운 쪽부터 보여 준다 (채우는 순서와 같다)
  function renderOutside(){
    const on = outsideAreas();
    const cap = on.reduce((n, a) => n + a.cap, 0);
    const l = document.createElement("span");
    l.textContent = on.length ? `${on.map(a => a.name).join(" → ")}` : "지정된 구역 없음";
    const r = document.createElement("span");
    r.textContent = `자리 ${cap}명`;
    if(!on.length) r.className = "bad";
    els.outsideSum.replaceChildren(l, r);

    const order = C.areas.slice().sort((x, y) =>
      TIER_RANK[x.tier] - TIER_RANK[y.tier] || C.areas.indexOf(x) - C.areas.indexOf(y));
    els.outsideList.replaceChildren(...order.map(a => {
      const lab = document.createElement("label");
      lab.className = a.outside ? "" : "off";
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = !!a.outside;
      cb.addEventListener("change", () => {
        a.outside = cb.checked;
        lab.className = cb.checked ? "" : "off";
        renderOutside(); render(); save();
      });
      const t = document.createElement("span");
      t.textContent = `${a.name} · ${TIERS[a.tier]} ${a.cap}명`;
      lab.append(cb, t);
      return lab;
    }));
  }

  // 명단 체크리스트. 역할 3명은 자동 제외라 잠가 둔다.
  function renderRoster(){
    if(!els.rosterList) return;          // 명단은 상단 명단 아이콘에서 본다
    const leads = leadNos();
    els.rosterList.replaceChildren(...students.map(s => {
      const isLead = leads.includes(s.no);
      const off = C.excluded.includes(s.no);
      const lab = document.createElement("label");
      lab.className = isLead ? "is-lead" : (off ? "off" : "");

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !isLead && !off;
      cb.disabled = isLead;
      cb.addEventListener("change", () => {
        const i = C.excluded.indexOf(s.no);
        if(cb.checked){ if(i >= 0) C.excluded.splice(i, 1); }
        else if(i < 0) C.excluded.push(s.no);
        lab.className = cb.checked ? "" : "off";
        renderRosterSum(); render(); save();
      });

      const t = document.createElement("span");
      t.textContent = `${s.no} ${s.name}` + (isLead ? " · 역할" : "");
      lab.append(cb, t);
      return lab;
    }));
    renderRosterSum();
  }

  // 기록에 남은 배정을 화면으로 되살린다. 확정을 눌러야 새 기록으로 남는다.
  function loadHistory(i){
    const h = C.history[i];
    if(!h || busy || setup) return;

    const nos = new Set(students.map(x => x.no));
    const ids = new Set(C.areas.map(a => a.id));
    const next = {};
    for(const a of C.areas) next[a.id] = [];

    let 빠짐 = 0;
    for(const key in h.rec){
      const no = +key, a = h.rec[key].a;
      if(!nos.has(no)){ 빠짐++; continue; }          // 명단에서 없어진 학생
      if(!ids.has(a)){ 빠짐++; continue; }           // 지워진 구역
      const area = C.areas.find(x => x.id === a);
      if(next[a].length >= area.cap){ 빠짐++; continue; }   // 정원이 줄어든 구역
      next[a].push(no);
    }

    C.assign = next;
    sortAll();
    // 되살린 배치가 곧 기준이다 → 보라색(수동 변경) 표시가 뜨지 않는다
    C.base = {};
    for(const id in C.assign) C.base[id] = C.assign[id].slice();

    render();
    markDirty("load");
    closeSheet();
    const 몇 = i === 0 ? "직전" : `${i}회 전`;
    toast(빠짐
      ? `${몇} 배정을 불러왔습니다. ${빠짐}명은 명단·구역이 바뀌어 빠졌습니다. ✓ 확정을 눌러야 기록됩니다.`
      : `${몇} 배정을 불러왔습니다. ✓ 확정을 눌러야 기록됩니다.`, 5000);
  }

  // 기록을 직접 손댈 때는 확정본에도 같이 반영한다.
  // (확정 전 저장은 committed 를 기준으로 나가서, 안 그러면 삭제가 되돌아온다)
  function commitHistory(){
    if(committed) committed.history = JSON.parse(JSON.stringify(C.history));
  }

  // 저장된 배정 기록 목록 — 원하는 회차만 골라서 지운다

    if(!C.history.length){
      const e = document.createElement("div");

      const mix = document.createElement("span");

      mix.textContent = `${Object.keys(h.rec).length}명 · ` +

      const edit = document.createElement("button");
      edit.className = "btn";

  /* ── 학생 한 명의 과거 기록 (전체 화면) ─────────
     점수표에서 이름을 누르면 화면 가득 표를 편다.
     가로(X) = 회차별 날짜, 세로(Y) = 그 회차의 구역·난이도·점수·등수·체크. */
  let openStu = null;                          // 지금 열어 둔 학생 번호

  // 화면에 보이는 자리(소수 첫째 자리)까지만 본다 — 눈에 같은 점수면 같은 등수다
  const round1 = v => Math.round((v || 0) * 10) / 10;

  // 회차마다 : 그때 맡은 구역 · 지금 기준 난이도 · 가중치 · 실제로 더해진 점수 · 체크
  // 점수 계산(scores)과 같은 tierOfRec 을 쓰므로, 난이도를 고치면 여기도 같이 바뀐다.
  function stuRounds(no){
    return C.history.map((h, i) => {
      const r = h.rec[no], w = weightAt(i);
      // chk 가 아예 없는 기록 = 체크를 남기기 전에 확정한 회차 → null (0 회와 구분한다)
      const chkN = h.chk ? (+h.chk[no] || 0) : null;
      const guess = chkN == null ? outsideGuess(i, no) : "";   // 기록이 없으면 역산
      if(!r) return { i, at:h.at, w, miss:true, pt:0, got:0, chk:chkN, guess };
      const now  = C.areas.find(a => a.id === r.a);          // 지금도 있는 구역
      const then = (h.areas || []).find(a => a.id === r.a);  // 그때의 구역 스냅샷
      const tier = tierOfRec(r), pt = TIER_PT[tier] || 0;
      return {
        i, at:h.at, w, miss:false, tier, pt, got: pt * w, chk:chkN, guess,
        area: (now || then || {}).name || "없어진 구역",
        gone: !now                       // 지금은 없는 구역 → 그때 난이도로 계산된다
      };
    });
  }

  // i 회차를 '뽑기 직전' 의 누적 점수 — 그날 누가 어디로 갈지를 가른 점수다
  function scoresBefore(i){
    const m = {};
    for(const s of students) m[s.no] = 0;
    C.history.slice(i + 1).forEach((h, j) => {
      const w = weightAt(j);
      for(const no in h.rec) if(m[no] != null) m[no] += (TIER_PT[tierOfRec(h.rec[no])] || 0) * w;
    });
    return m;
  }

  // 체크 기록이 없던 시절의 회차를 역산한다.
  // 외부청소는 '체크를 받았거나 청소 못한 학생으로 지정된' 학생만 가는 자리다.
  // 다만 점수가 낮아 어차피 어려움 자리였다면 근거가 못 되므로 가려낸다.
  // (고정으로 그 자리에 남은 경우는 기록이 없어 가려낼 수 없다 — 안내문에 적어 둔다)
  function outsideGuess(i, no){
    const h = C.history[i], r = h && h.rec[no];
    if(!r) return "";
    // 그때의 구역 설정이 없으면 외부청소였는지 알 수 없다 (지금 설정으로 넘겨짚지 않는다)
    if(!h.areas || !h.areas.length) return "noarea";
    const a = h.areas.find(x => x.id === r.a);
    if(!a || !a.outside) return "";

    // 점수 순으로 줄을 세웠을 때 이 학생이 받았을 난이도를 따져 본다.
    // 실제로 그보다 어려운 곳에 있었다면 점수로는 설명이 안 된다 = 보내진 것이다.
    const pt = scoresBefore(i);
    const order = Object.keys(h.rec).map(Number)
      .sort((x, y) => (pt[y] || 0) - (pt[x] || 0) || x - y);
    const seats = [];
    for(const t of ["easy", "mid", "hard"])
      for(const x of h.areas.filter(v => v.tier === t))
        for(let k = 0; k < x.cap; k++) seats.push(t);
    const would = seats[order.indexOf(no)] || "hard";
    // TIER_RANK 은 어려움이 0 인 역순이다 — 값이 작을수록 어렵다
    return TIER_RANK[a.tier] < TIER_RANK[would] ? "sent" : "score";
  }

  // i 회차까지 (그 회차를 포함해) 쌓인 누적 점수 — 그 배치를 마친 뒤의 성적표다.
  // 그 회차가 '직전' 이었던 시점이므로 가중치도 그때 기준(×1.0부터)으로 다시 매긴다.
  // 지금의 난이도로 세므로, 난이도를 고치면 지난 등수도 함께 움직인다.
  function scoresUpTo(i){
    const m = {};
    for(const s of students) m[s.no] = 0;
    C.history.slice(i).forEach((h, j) => {
      const w = weightAt(j);
      for(const no in h.rec) if(m[no] != null) m[no] += (TIER_PT[tierOfRec(h.rec[no])] || 0) * w;
    });
    return m;
  }

  // '지금' 칸의 등수 : 이 배정을 확정했다고 치면 몇 등이 되는지.
  // 확정하면 새 기록이 되거나(뽑기·불러오기) 최근 기록을 갈아치운다(손질) — commit() 와 같은 갈림.
  function scoresIfCommitted(){
    const rec = {};
    for(const a of C.areas)
      for(const no of (C.assign[a.id] || [])) rec[no] = { a:a.id, t:a.tier };
    const replaces = dirty && dirtyKind !== "draw" && dirtyKind !== "load" && !!C.history.length;
    const list = [{ rec }, ...C.history.slice(replaces ? 1 : 0)].slice(0, HIST_MAX);
    const m = {};
    for(const s of students) m[s.no] = 0;
    list.forEach((h, j) => {
      const w = weightAt(j);
      for(const no in h.rec) if(m[no] != null) m[no] += (TIER_PT[tierOfRec(h.rec[no])] || 0) * w;
    });
    return m;
  }

  // 공동 순위 : 나보다 점수가 높은 사람 수 + 1
  function rankOf(pt, no){
    const v = round1(pt[no]);
    let above = 0, same = 0;
    for(const s of students){
      const x = round1(pt[s.no]);
      if(x > v) above++;
      else if(x === v) same++;
    }
    return { rank: above + 1, same };
  }
  const rankText = k => (k.same > 1 ? "공동 " : "") + k.rank + "등";

  function openStuView(no){
    if(openStu === no && !els.stuView.hidden){ backToSheet(); return; }
    openStu = no;
    closeSheet();                              // 설정 창은 접고 화면 가득 편다
    renderStuView();
  }
  function closeStuView(){
    openStu = null;
    els.stuView.hidden = true;
    els.svTab.replaceChildren();
  }
  // 닫으면 고르던 자리(설정 창의 점수표)로 돌아간다
  function backToSheet(){ closeStuView(); openSheet(); }

  function renderStuView(){
    if(!els.stuView) return;
    const me = students.find(s => s.no === openStu);
    if(!me){ closeStuView(); return; }          // 명단에서 빠졌다

    const pt = scores(), total = pt[me.no] || 0;
    const nowRank = rankOf(pt, me.no);
    const rounds = stuRounds(me.no);
    const cnt = { easy:0, mid:0, hard:0 };
    let miss = 0, kept = 0;
    for(const r of rounds){
      if(r.miss){ miss++; continue; }
      kept++;
      if(cnt[r.tier] != null) cnt[r.tier]++;
    }

    // '직전' 은 마지막으로 확정한 기록이고, 보통 지금 화면의 배정과 같다.
    // 그래서 맨 오른쪽 '지금' 칸은 둘이 다를 때만 붙인다.
    // 견줄 때는 반 전체(sameAsLatest)가 아니라 이 학생의 자리만 본다 —
    // 전체로 견주면 명단이나 구역이 한 번이라도 바뀐 뒤로는 늘 '다르다' 가 되어
    // 확정을 눌러도 '지금' 칸이 사라지지 않는다. 이 표는 한 학생의 것이다.
    const nowId = areaOf(C.assign, me.no);
    const headRec = C.history[0] && C.history[0].rec[me.no];
    const showNow = !C.history.length || nowId !== (headRec ? headRec.a : null);
    const nowArea = nowId ? C.areas.find(a => a.id === nowId) : null;

    /* 머리 : 누구인지 */
    els.svName.textContent = `${me.no}번 ${me.name}`;
    const role = C.roles.find(r => r.no === me.no);
    const mix = Object.keys(TIERS).filter(t => cnt[t]).map(t => `${TIERS[t]} ${cnt[t]}회`).join(" · ");
    els.svTag.textContent = role ? `${role.label} — 뽑기에서 빠집니다`
      : C.excluded.includes(me.no) ? "청소 명단에서 빠져 있습니다"
      : mix || "아직 배정된 기록이 없습니다";

    /* 머리 오른쪽 : 지금 등수 · 누적 점수 · 체크 */
    const fig = (big, small, cls) => {
      const d = document.createElement("div"); d.className = "sv-fig" + (cls ? " " + cls : "");
      const b = document.createElement("b"); b.textContent = big;
      const s = document.createElement("small"); s.textContent = small;
      d.append(b, s);
      return d;
    };
    const nowChk = chk(me.no);
    els.svFigs.replaceChildren(
      fig(rankText(nowRank), `${students.length}명 중`),
      fig(total.toFixed(1) + "점", "누적 점수"),
      fig(nowChk + "회", "지금 체크", nowChk ? "warn" : "")
    );

    /* 표 : 가로 = 회차 (왼쪽이 오래된 것) + 맨 오른쪽 '지금' */
    const cols = rounds.slice().reverse();

    const cell = (text, sub, cls) => {
      const td = document.createElement("td");
      if(cls) td.className = cls;
      td.textContent = text;
      if(sub){ const s = document.createElement("small"); s.textContent = sub; td.append(s); }
      return td;
    };

    const head = document.createElement("tr");
    const corner = document.createElement("th");
    corner.className = "sv-lab";
    corner.textContent = rounds.length ? `지난 ${rounds.length}회` : "기록 없음";
    head.append(corner);
    for(const r of cols){
      const th = document.createElement("th");
      th.className = r.i === 0 ? "sv-last" : "";
      const d = new Date(r.at);
      th.textContent = isNaN(d) ? "(시각 없음)" : `${d.getMonth()+1}.${d.getDate()}`;
      const s = document.createElement("small");
      // 확정하지 않은 뽑기가 없으면 직전 기록이 곧 지금 배치다 — 그렇다고 적어 준다
      s.textContent = r.i === 0 ? (showNow ? "직전" : "직전 · 지금") : `${r.i}회 전`;
      th.append(s);
      head.append(th);
    }
    if(showNow){
      const nowTh = document.createElement("th");
      nowTh.className = "sv-now";
      nowTh.textContent = "지금";
      const nowSm = document.createElement("small");
      nowSm.textContent = "확정 전";
      nowTh.append(nowSm);
      head.append(nowTh);
    }

    const thead = document.createElement("thead"); thead.append(head);
    const tbody = document.createElement("tbody");

    // 한 줄 = 한 가지 데이터. fill(r) 은 회차 칸, fill(null, true) 는 '지금' 칸.
    const addRow = (label, tip, fill, cls) => {
      const tr = document.createElement("tr");
      if(cls) tr.className = cls;
      const h = document.createElement("th");
      h.className = "sv-lab";
      h.scope = "row";
      h.textContent = label;
      if(tip) h.title = tip;
      tr.append(h);
      for(const r of cols) tr.append(fill(r, false));
      if(showNow) tr.append(fill(null, true));
      tbody.append(tr);
    };

    addRow("구역", "그 회차에 맡은 청소 구역", (r, isNow) => isNow
      ? cell(nowArea ? nowArea.name : "배정 없음", "", nowArea ? "sv-area" : "dim")
      : cell(r.miss ? "배정 없음" : r.area, r.gone ? "없어진 구역" : "",
             r.miss ? "dim" : "sv-area"));

    addRow("난이도", "지금 설정된 난이도로 셉니다 (난이도를 고치면 지난 점수도 함께 바뀝니다)",
      (r, isNow) => {
        const t = isNow ? (nowArea ? nowArea.tier : null) : (r.miss ? null : r.tier);
        return cell(t ? TIERS[t] : "—", "", t ? "t-" + t : "dim");
      });

    addRow("점수", "쉬움 1 · 중간 2 · 어려움 3", (r, isNow) => isNow
      ? cell(nowArea ? TIER_PT[nowArea.tier] + "점" : "—", "", "dim")
      : cell(r.miss ? "—" : r.pt + "점", "", r.miss ? "dim" : ""));

    addRow("가중치", "최근일수록 크게 반영한다 (직전 ×1.0 → 10회 전 ×0.1)", (r, isNow) => isNow
      ? cell("—", "", "dim")
      : cell("×" + r.w.toFixed(1), "", "dim"));

    addRow("반영 점수", "점수 × 가중치 — 지금 누적 점수에 더해지는 값", (r, isNow) => isNow
      ? cell("—", "확정하면 반영", "dim")
      : cell(r.got.toFixed(1) + "점", "", r.miss ? "dim" : "big"), "sv-key");

    addRow("등수", "그 회차의 청소를 마친 뒤의 누적 점수 기준 등수",
      (r, isNow) => {
        if(isNow){                                  // 아직 확정 전 → 확정했다고 쳤을 때의 등수
          const ifc = scoresIfCommitted();
          return cell(rankText(rankOf(ifc, me.no)), `확정하면 ${(ifc[me.no] || 0).toFixed(1)}점`, "big");
        }
        const upto = scoresUpTo(r.i);
        return cell(rankText(rankOf(upto, me.no)), upto[me.no].toFixed(1) + "점", "");
      });

    addRow("체크", "그 회차를 확정할 때까지 받은 지적 횟수 " +
                   "(기록이 없는 옛 회차는 외부청소에 배정됐는지로 역산해 표시합니다)", (r, isNow) => {
      if(isNow) return cell(nowChk + "회", "확정 전", nowChk ? "warn" : "dim");
      if(r.chk != null) return cell(r.chk + "회", "", r.chk ? "warn" : "dim");
      // 기록이 없는 회차 — 외부청소로 보내진 흔적이 있으면 그것으로 대신한다
      // 지금 고정된 학생은 고정 때문에 그 자리에 남았을 수도 있다 (고정 이력은 남지 않는다)
      if(r.guess === "sent")
        return cell("외부청소", C.locked.includes(me.no) ? "역산 · 고정?" : "역산", "warn");
      return cell("—", r.guess === "noarea" ? "구역 기록 없음" : "기록 없음", "dim");
    });

    els.svTab.replaceChildren(thead, tbody);

    els.svNote.textContent =
      "가로는 지난 배정 회차입니다 (왼쪽이 오래된 것 · 맨 오른쪽 ‘직전’ 이 마지막으로 확정한 배정). " +
      (showNow ? "이 학생 자리가 직전 기록과 달라 맨 끝에 ‘지금’ 칸을 따로 뒀습니다 — 확정해야 점수에 들어갑니다. "
       : dirty ? "반 전체로는 확정하지 않은 배정이 있지만, 이 학생 자리는 직전 기록과 같습니다. " : "") +
      "난이도와 점수는 지금 설정된 난이도로 다시 계산하므로, 난이도를 고치면 지난 회차의 점수와 등수도 함께 바뀝니다. " +
      "체크는 그 회차를 확정할 때 남아 있던 지적 횟수입니다. 기록이 없는 옛 회차는 " +
      "‘외부청소’ 구역에 배정됐는지로 역산해 표시합니다 — 외부청소는 체크를 받았거나 청소 못한 학생으로 " +
      "지정된 학생이 가는 자리이기 때문입니다. 점수가 낮아 어차피 갈 자리였던 경우는 빼고 셌지만, " +
      "고정으로 그 자리에 남았던 경우는 고정 이력이 저장되지 않아 섞일 수 있습니다.";

    els.stuView.hidden = false;
  }

  // 누적 점수표 (높은 순) — 다음 뽑기에서 위쪽 학생이 더 쉬운 구역을 받는다
  function renderScores(){
    const n = C.history.length;
    els.clearHist.disabled = !n;
    renderHistList();
    // 확정하지 않은 뽑기는 점수에 들어가지 않는다는 것을 화면에 명시한다
    els.histNote.hidden = !(dirty && dirtyKind === "draw");
    els.histNote.textContent =
      "확정하지 않은 뽑기가 있습니다 — 누적 점수와 기록은 ‘✓ 확정’ 을 눌러야 반영됩니다.";
    const l = document.createElement("span");
    l.textContent = n ? `확정된 배정 ${n}회 / 최대 ${HIST_MAX}회` : "확정된 배정 없음";
    const r = document.createElement("span");
    r.textContent = "쉬움 1 · 중간 2 · 어려움 3 × 최근 가중치";
    els.histSum.replaceChildren(l, r);

    if(!n || !students.length){
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = "청소 뽑기를 확정하면 점수가 쌓입니다";
      els.scoreList.replaceChildren(e);
      if(openStu != null) closeStuView();   // 볼 기록이 없으니 열어 둔 것도 닫는다
      return;
    }
    const pt = scores();
    const rows = students.slice().sort((a, b) => pt[b.no] - pt[a.no] || a.no - b.no);
    els.scoreList.replaceChildren(...rows.map(s => {
      const d = document.createElement("div");
      d.className = "s-row" + (s.no === openStu ? " me" : "")
                  + (rows.indexOf(s) < 3 ? " top" : "");
      d.tabIndex = 0;
      d.setAttribute("role", "button");
      d.title = "누르면 이 학생의 회차별 구역·난이도·점수·등수·체크를 전체 화면으로 봅니다";
      d.addEventListener("click", () => openStuView(s.no));
      d.addEventListener("keydown", e => {
        if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openStuView(s.no); }
      });
      const rk = document.createElement("em");
      rk.textContent = rows.indexOf(s) + 1;
      const nm = document.createElement("span");
      nm.textContent = `${s.no} ${s.name}`;
      const v = document.createElement("b");
      v.textContent = pt[s.no].toFixed(1);
      d.append(rk, nm, v);
      return d;
    }));
    if(openStu != null) renderStuView();   // 열어 둔 학생이 있으면 같이 다시 그린다
  }

  /* ── 알림 / 인쇄 ───────────────────────────── */
  let toastTimer = null;
  function toast(msg, ms){
    els.toast.textContent = msg;
    els.toast.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove("on"), ms || 3200);
  }
  function toggleMenu(show){
    const on = show === undefined ? els.printMenu.hasAttribute("hidden") : show;
    if(on) els.printMenu.removeAttribute("hidden");
    else els.printMenu.setAttribute("hidden", "");
    els.printBtn.classList.toggle("open", on);
    els.printBtn.setAttribute("aria-expanded", String(on));
  }

  /* ── 이벤트 ────────────────────────────────── */
  els.clearHist.addEventListener("click", () => {
    if(!C.history.length) return;
    if(!confirm(`저장된 배정 기록 ${C.history.length}회와 누적 점수를 모두 지울까요?`)) return;
    C.history = [];
    commitHistory();
    renderSum(); save();
    toast("배정 기록을 모두 지웠습니다.");
  });

  els.setupTip.addEventListener("click", e => {
    const b = e.target.closest("button[data-add]");
    if(b) addArea(b.dataset.add);
  });
  els.setupStart.addEventListener("click", () => { closeSheet(); setSetup(true); });
  els.doneSetup.addEventListener("click", () => setSetup(false));

  // 고치는 중 : 구역 손보기 / 저장 / 취소
  els.editAreas.addEventListener("click", () => setSetup(true));
  els.editSave.addEventListener("click", () => closeEdit(true));
  els.editCancel.addEventListener("click", () => closeEdit(false));

  els.chkOpen && els.chkOpen.addEventListener("click", () => { closeSheet(); navTo(PAGE_URL[2]); });
  els.chkClear && els.chkClear.addEventListener("click", () => {
    if(!students.some(st => chk(st.no) > 0)){ toast("입력된 횟수가 없습니다."); return; }
    C.checks = {}; C.marks = {};
    renderChk(); render(); save();
    toast("체크를 모두 0으로 되돌렸습니다.");
  });

  els.pendEdit.addEventListener("click", () => openEdit("next"));
  els.pendApply.addEventListener("click", () => {
    if(!C.pending || !C.pending.length) return;
    if(!confirm(`미리 잡아 둔 구역(${C.pending.length}곳 · 정원 ${capOf(C.pending)}명)으로 지금 바꿀까요?
` +
                "지금 배정된 사람들은 지워집니다.")) return;
    applyPending();
    closeSheet();
    render(); renderSum(); markDirty("edit");
    toast("구역을 바꿨습니다. 청소 뽑기를 눌러 배정하세요.", 4500);
  });
  els.pendClear.addEventListener("click", () => {
    if(!C.pending) return;
    C.pending = null;
    renderPend(); save();
    toast("미리 잡아 둔 구역을 지웠습니다.");
  });
  els.resetAreas.addEventListener("click", () => {
    if(!confirm("청소 구역을 기본 구성으로 되돌릴까요? 지금 배정은 사라집니다.")) return;
    const d = defaultCleaning();

    pendingRollback = null; dirty = false; dirtyKind = null; committed = grabAssign();

  // 외부청소 지정을 한 번에 지운다 (매일 새로 적는 목록이라 비우기 쉬워야 한다)
  function clearBadly(){
